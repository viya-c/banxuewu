# 星光伴学屋 · Cloudflare Worker 配置
# 部署前：先 `wrangler login`（OAuth 登录 Cloudflare），再按下方注释填好 id / account_id。
name = "xingguang-banxuewu"
main = "worker.js"
compatibility_date = "2024-11-01"

# ---- D1 数据库：整份家庭状态以一个 JSON 行存储（与本地 data.json 兼容）----
[[d1_databases]]
binding = "DB"
database_name = "xingguang"
# 执行 `wrangler d1 create xingguang` 后，把返回的 id 填到下面（保留引号）
database_id = "7e664834-4de7-4a57-80e3-fcc79e79d7e6"

# ---- 实时同步 Durable Object：每个家庭一个实例，持有在线 WebSocket 并广播 ----
[[durable_objects.bindings]]
name = "REALTIME"
class_name = "Realtime"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Realtime"]

# ---- 可选：图片存储（R2）。不配置也能跑，图片会回退为 base64 dataURL ----
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "xingguang-img"
# 配置后别忘了在 Cloudflare 控制台创建同名 R2 桶，并把桶名填到上面

# ---- 你的 Cloudflare 账户 ID ----
# 已 `wrangler login` 且只有一个账户时，可整行注释掉；否则取消注释并填入 `wrangler whoami` 看到的 id
# account_id = "REPLACE_WITH_CF_ACCOUNT_ID"
