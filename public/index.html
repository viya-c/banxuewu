<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6E9BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>星光伴学屋</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 登录 -->
<div class="login" id="login" style="display:none">
  <div class="login-box">
    <div class="lg">📚</div>
    <h2 id="loginTitle">星光伴学屋</h2>
    <p>请输入家庭访问码</p>
    <input class="code-in" id="codeInput" type="tel" maxlength="10" placeholder="••••" autocomplete="off">
    <button class="btn block" id="loginBtn">进 入</button>
    <p style="margin:12px 0 0;font-size:11px">首次使用默认访问码：2026</p>
  </div>
</div>

<!-- 选择身份 -->
<div class="who-select" id="whoSelect" style="display:none">
  <div class="who-box">
    <div class="who-lg">👋</div>
    <h2>我是谁？</h2>
    <p>选择你的身份进入，不同身份看到的界面与权限不同</p>
    <div id="whoList"></div>
    <button class="btn ghost sm" onclick="whoBackToLogin()" style="margin-top:18px">换一个访问码</button>
  </div>
</div>

<div class="app" id="app" style="display:none">

  <!-- 顶部 -->
  <header class="topbar">
    <div class="topbar-row">
      <div class="tb-child">
        <div class="tb-ava" id="tbAva">🌸</div>
        <div class="col">
          <div class="tb-name" id="tbName">宝贝</div>
          <div class="tb-sub" id="tbSub">今天是个好日子</div>
        </div>
      </div>
      <div class="tb-actions">
        <button class="gradepick" id="gradeBtn"><span id="gradeName">三年级</span> ▾</button>
        <button class="icon-btn" id="bellBtn" title="提醒">🔔</button>
      </div>
    </div>
    <div class="tb-stats" id="tbStats"></div>
  </header>

  <!-- 课表 -->
  <section class="page on" id="page-timetable">
    <div class="tt-bar">
      <div class="seg" id="ttSeg">
        <button class="on" data-v="week">周视图</button>
        <button data-v="list">列表</button>
      </div>
      <div class="seg" id="ttWeekSeg">
        <button class="on" data-v="all">每周</button>
        <button data-v="odd">单周</button>
        <button data-v="even">双周</button>
      </div>
    </div>
    <div id="ttBody"></div>
    <div class="legend">
      <span><i style="background:linear-gradient(150deg,#6E9BFF,#4A80F0)"></i>学校正课</span>
      <span><i style="background:linear-gradient(150deg,#FFB05C,#F5912B)"></i>延时课</span>
      <span><i style="background:linear-gradient(150deg,#B77BEE,#9450DE)"></i>课外辅导</span>
      <span><i style="background:#FFC531;border-radius:50%"></i>有作业</span>
    </div>
    <div class="sec-h" id="ttToolsSec"><div class="sec-t">⚙️ 课表工具</div></div>
    <div class="card" id="ttToolsCard">
      <div class="row" style="margin-bottom:10px">
        <div class="col"><b style="font-size:13.5px">批量录入课表</b><span class="muted">一次把一周正课全部填好</span></div>
        <button class="btn sm" id="batchBtn">去录入</button>
      </div>
      <div class="row">
        <div class="col"><b style="font-size:13.5px">作息时间设置</b><span class="muted">节次与延时课时间段</span></div>
        <button class="btn sm ghost" id="periodBtn">设置</button>
      </div>
    </div>
    <div class="ver" id="ver1"></div>
  </section>

  <!-- 作业 -->
  <section class="page" id="page-today">
    <div id="todayBody"></div>
    <div class="ver" id="ver2"></div>
  </section>

  <!-- 课包 -->
  <section class="page" id="page-package">
    <div id="pkgBody"></div>
    <div class="ver" id="ver3"></div>
  </section>

  <!-- 成绩 -->
  <section class="page" id="page-exam">
    <div id="examBody"></div>
    <div class="ver" id="ver4"></div>
  </section>

  <!-- 我的 -->
  <section class="page" id="page-me">
    <div id="meBody"></div>
    <div class="ver" id="ver5"></div>
  </section>

  <button class="fab" id="fab">＋</button>
</div>

<nav class="nav" id="nav" style="display:none">
  <button class="on" data-p="timetable"><i>📅</i>课表</button>
  <button data-p="today"><i>✅</i>作业<span class="badge" id="navBadge" style="display:none">0</span></button>
  <button data-p="package"><i>🎒</i>课包</button>
  <button data-p="exam"><i>📈</i>成绩</button>
  <button data-p="me"><i>👨‍👩‍👧</i>我的</button>
</nav>

<div class="mask" id="mask">
  <div class="sheet" id="sheet">
    <div class="sheet-hd"><h3 id="sheetTitle">标题</h3><button class="close-x" id="sheetClose">✕</button></div>
    <div class="sheet-bd" id="sheetBody"></div>
    <div class="sheet-ft" id="sheetFoot"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/config.js"></script>
<script src="js/core.js"></script>
<script src="js/timetable.js"></script>
<script src="js/today.js"></script>
<script src="js/packages.js"></script>
<script src="js/exams.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
