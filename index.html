/* ---------- 课包结转（升级到新年级，选目标学期/假期） ---------- */
function rollPkgForm(id) {
  if (!needRole('package')) return;
  const p = S.data.packages.find(x => x.id === id);
  if (!p) return;
  const st = p.stats || {};
  const remain = st.remain || 0;
  if (remain <= 0) return toast('该课包没有剩余课时，无需结转');
  const others = (S.data.grades || []).filter(g => g.id !== gid());
  if (!others.length) return toast('没有其它年级可结转，请先在「我的」里添加新年级');
  const body = `
    <p class="muted">将「<b>${esc(p.name)}</b>」的 <b style="color:var(--fu)">${remain}</b> 节剩余课时，结转到新年级，并选择目标学期 / 假期。原课包会标记为「已结课」，已上记录保留在旧年级。</p>
    <div class="f"><label>目标年级 <em>*</em></label>
      <select id="rollGrade">${others.map(g => `<option value="${g.id}">${esc(g.name)}${g.schoolYear ? '（' + esc(g.schoolYear) + '）' : ''}</option>`).join('')}</select></div>
    <div class="f"><label>目标学期 / 假期 <em>*</em></label>
      <select id="rollTerm"></select></div>
    <p class="muted" id="rollTermHint"></p>`;
  const foot = `<button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn fu" id="rollSave">结转</button>`;
  openSheet('结转课包到新年级', body, foot, () => {
    const fillTerms = () => {
      const tg = (S.data.grades || []).find(g => g.id === val('rollGrade'));
      const sel = document.getElementById('rollTerm');
      const hint = document.getElementById('rollTermHint');
      const terms = (tg && tg.terms) || [];
      if (terms.length) {
        sel.innerHTML = terms.map(t => `<option value="${t.id}">${esc(t.name)}${t.start ? '（' + t.start + ' ~ ' + t.end + '）' : ''}</option>`).join('');
        if (hint) hint.textContent = '新课包有效期将设为所选学期/假期的起止日期，剩余课时会在该区间内自动排课。';
      } else {
        sel.innerHTML = `<option value="">（该年级未设学期，结转后作为长线课包）</option>`;
        if (hint) hint.textContent = '目标年级未设置学期区间，结转后作为不限定有效期的长线课包。';
      }
    };
    fillTerms();
    const ge = document.getElementById('rollGrade'); if (ge) ge.onchange = fillTerms;
    document.getElementById('rollSave').onclick = async () => {
      const tgId = val('rollGrade'); const termId = val('rollTerm');
      await rollPkg(id, tgId, termId);
    };
  });
}

async function rollPkg(id, targetGradeId, termId) {
  const p = S.data.packages.find(x => x.id === id);
  if (!p) return;
  if (p.rolledHours) return toast('该课包已结转到新年级，无需重复结转');
  const st = p.stats || {};
  const remain = st.remain || 0;
  if (remain <= 0) return toast('该课包没有剩余课时');
  const tg = (S.data.grades || []).find(g => g.id === targetGradeId);
  if (!tg) return toast('目标年级不存在');
  const hasTerms = !!(tg.terms && tg.terms.length);
  const term = hasTerms ? (tg.terms.find(t => t.id === termId) || null) : null;
  const sched = (p.schedule && p.schedule.length) ? p.schedule : [{ weekday: 2, start: '18:30', end: '20:00' }];
  const dur = Number(p.durationMin) || 90;
  const fromName = (curGrade() && curGrade().name) || '原年级';
  const newBody = {
    gradeId: tg.id,
    subject: p.subject, name: p.name + '（结转）', org: p.org || '', teacher: p.teacher || '', teacherContact: p.teacherContact || '',
    term: hasTerms ? null : 'all',
    totalHours: remain, hoursEach: Number(p.hoursEach) || 1, durationMin: dur,
    price: null, unitPrice: null,
    startDate: term ? term.start : (p.startDate || today()),
    endDate: term ? term.end : '',
    note: (p.note ? p.note + '\n' : '') + `由「${fromName}」的「${p.name}」结转，剩余 ${remain} 课时`,
    status: 'active', leaveRule: p.leaveRule || 'keep',
    fromRoll: id, fromRollHours: remain,   // 来源：旧课包结转，新课包可用课时 = 结转课时
    schedule: sched.map(s => ({ weekday: Number(s.weekday), start: s.start, end: s.end || endFromStart(s.start, dur) })),
    sessions: []
  };
  try {
    window.__SAVING = true;
    const r = await api('/packages', { method: 'POST', body: newBody });
    const newId = r.data.id;
    await api('/packages/' + id, { method: 'PUT', body: { status: 'done', rolledHours: remain, rolledTo: newId, rolledAt: today(), note: (p.note ? p.note + '\n' : '') + `已结转 ${remain} 课时至「${tg.name}」` } });
    await refresh();
    await switchGrade(tg.id);   // 切到新年级（内部 refresh + closeSheet + toast）
    pkgDetail(newId);
  } catch (e) { toast(e.message); }
  finally { window.__SAVING = false; }
}

<script>
/* ================= 考试成绩与分数曲线 ================= */

const SUBJ_COLORS = ['#5B8CFF', '#FF7EB3', '#25C685', '#FF9F43', '#A55EEA', '#39C5D8', '#FF6B6B', '#8D9EFF'];
const EXAM_TYPES = ['单元测', '随堂测', '月考', '期中考', '期末考', '竞赛', '其他'];

function renderExams() {
  const box = document.getElementById('examBody');
  const seg = gradeHasTerms() ? termSegHTML() : '';
  const all = gExams().slice().sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  if (!all.length) {
    box.innerHTML = seg + examSecTitle(0) + `<div class="card"><div class="empty"><span class="em">📈</span>
      <p>还没有考试记录<br>${canEdit('exam') ? '每次考完录一下分数，<br>自动生成成绩曲线，进步一目了然' : '请联系管理员或孩子的身份录入成绩'}</p>
      ${canEdit('exam') ? `<button class="btn" style="margin-top:14px" onclick="examForm()">记录第一次成绩</button>` : ''}</div></div>` + hwStatsHTML();
    bindTermSeg();
    bindHwRange();
    return;
  }

  const subjects = [...new Set(all.map(e => e.subject))];
  if (S.examSubject && S.examSubject !== '__all' && !subjects.includes(S.examSubject)) S.examSubject = '';
  const cur = S.examSubject || subjects[0];
  const showAll = cur === '__all';
  const list = showAll ? all : all.filter(e => e.subject === cur);
  const scored = list.filter(hasScore);

  // 统计
  const rates = scored.map(e => rateOf(e));
  const avg = rates.length ? Math.round(rates.reduce((a, b) => a + b, 0) / rates.length) : 0;
  const best = scored.length ? scored.reduce((m, e) => (rateOf(e) > rateOf(m) ? e : m), scored[0]) : null;
  const last2 = scored.slice(-2);
  const trend = last2.length === 2 ? Math.round(rateOf(last2[1]) - rateOf(last2[0])) : 0;

  let h = examSecTitle(all.length);

  h += `<div class="chips" id="examChips">
    ${subjects.map(s => `<button class="chip ${cur === s ? 'on' : ''}" onclick="pickSubject('${esc(s)}')">${emojiOf(s)} ${esc(s)}</button>`).join('')}
    <button class="chip ${showAll ? 'on' : ''}" onclick="pickSubject('__all')">📊 全科对比</button>
  </div>`;

  h += `<div class="stat3">
    <div><b style="color:var(--main)">${showAll ? avg + '%' : (scored.length ? Math.round(avgScore(scored)) : '-')}</b><span>${showAll ? '平均得分率' : '平均分'}</span></div>
    <div><b style="color:var(--ok)">${best ? best.score : '-'}</b><span>最高分</span></div>
    <div><b style="color:${trend > 0 ? 'var(--ok)' : trend < 0 ? 'var(--warn)' : 'var(--mu)'}">${trend > 0 ? '↑' + trend : trend < 0 ? '↓' + Math.abs(trend) : '—'}</b><span>较上次</span></div>
  </div>`;

  h += `<div class="chart-card">${chartSVG(all, cur)}</div>`;

  // 成绩明细：按日期倒序，每 5 条一页，左右滑动查看（记录多了也不会把页面拉长）
  const items = list.slice().reverse();
  const PS = EXAM_PAGE_SIZE;
  const pageN = Math.max(1, Math.ceil(items.length / PS));

  h += `<div class="sec-h"><div class="sec-t">📋 成绩记录 <small>${items.length} 次 · 每 ${PS} 条一页</small></div>
    ${canEdit('exam') ? `<button class="btn xs" onclick="examForm()">+ 记成绩</button>` : ''}</div>`;

  h += `<div class="pg"><div class="pg-track" id="examTrack" data-pages="${pageN}">`;
  for (let i = 0; i < pageN; i++) {
    h += `<div class="pg-page">${items.slice(i * PS, i * PS + PS).map(e => examCardHTML(e, all)).join('')}</div>`;
  }
  h += `</div>`;
  if (pageN > 1) {
    h += `<div class="pg-bar">
      <button class="pg-btn" type="button" onclick="examGo(-1)" aria-label="上一页">‹</button>
      <span class="pg-dots" id="examDots">${Array.from({ length: pageN }, (_, i) => `<i class="${i === 0 ? 'on' : ''}"></i>`).join('')}</span>
      <span class="pg-num" id="examPageNum">1 / ${pageN}</span>
      <button class="pg-btn" type="button" onclick="examGo(1)" aria-label="下一页">›</button>
    </div>`;
  }
  h += `</div>`;

  h += hwStatsHTML();

  box.innerHTML = seg + h;
  bindTermSeg();
  bindExamPaging();
  bindHwRange();
}

/** 成绩页第一块的小标题（与下方「📊 作业记录」对应） */
const examSecTitle = n => `<div class="sec-h" style="margin-top:4px"><div class="sec-t">📈 考试成绩${n ? ` <small>${n} 次</small>` : ''}</div></div>`;

/** 成绩明细卡片（分页内的一屏最多 EXAM_PAGE_SIZE 条，字号已整体调小） */
function examCardHTML(e, all) {

        ${e.classAvg ? `<span class="muted ex-meta">班级平均 ${e.classAvg}${r - (e.classAvg / (e.fullScore || 100) * 100) > 0 ? '（高于平均 ' + Math.round(r - e.classAvg / (e.fullScore || 100) * 100) + '%）' : ''}</span>` : ''}
      </div>
      ${dv !== null ? `<span class="tag ${dv > 0 ? 'g' : dv < 0 ? 'r' : 'gy'}">${dv > 0 ? '↑' + dv : dv < 0 ? '↓' + Math.abs(dv) : '持平'}</span>` : ''}
    </div>
    ${e.lostPoints ? `<p class="muted ex-lost">❗ 失分点：${esc(e.lostPoints)}</p>` : ''}

/* ---------- 成绩明细翻页（每页 5 条，左右滑动 / 点箭头） ---------- */
const EXAM_PAGE_SIZE = 5;
let examSwiped = false;
/** 卡片点击：滑动过程中不触发详情，避免误点 */
function examOpen(id) { if (examSwiped) return; examDetail(id); }
function examGo(d) {
  const t = document.getElementById('examTrack');
  if (!t) return;
  const w = t.clientWidth || 1;
  t.scrollTo({ left: t.scrollLeft + d * w, behavior: 'smooth' });
}
function bindExamPaging() {
  const t = document.getElementById('examTrack');
  if (!t) return;
  const n = Number(t.dataset.pages) || 1;
  // 滑动时抑制误触
  t.addEventListener('touchmove', () => { examSwiped = true; }, { passive: true });
  t.addEventListener('touchend', () => { setTimeout(() => { examSwiped = false; }, 90); });
  t.addEventListener('scroll', () => {
    const w = t.clientWidth || 1;
    const i = Math.max(0, Math.min(n - 1, Math.round(t.scrollLeft / w)));
    const dots = document.getElementById('examDots');
    if (dots) Array.from(dots.children).forEach((el, k) => el.classList.toggle('on', k === i));
    const num = document.getElementById('examPageNum');
    if (num) num.textContent = (i + 1) + ' / ' + n;
  }, { passive: true });
}

const hasScore = e => e.score !== null && e.score !== undefined && e.score !== '';
const rateOf = e => Math.round((Number(e.score) || 0) / (Number(e.fullScore) || 100) * 1000) / 10;
const avgScore = list => list.length ? list.reduce((s, e) => s + (Number(e.score) || 0), 0) / list.length : 0;
function prevExam(all, e) {
  const same = all.filter(x => x.subject === e.subject).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
  const i = same.findIndex(x => x.id === e.id);
  return i > 0 ? same[i - 1] : null;
}
function pickSubject(s) { S.examSubject = s; renderExams(); }

/* ---------- 作业记录 · 积分（蜡烛柱 + 积分折线） ----------
   口径：作业数量 = 当天「到期」的作业数（今天该做多少）
         完成数量 = 当天「打卡」完成的作业数（今天实际做了多少）
   积分：完成 1 个作业 +1（记在打卡那天）；每日评价「态度/方法/努力」每项 ≥4 星 各 +2（记在评价那天）
         「获得」不落库，实时算出，避免重复记账；「使用」落 points 流水，用掉的部分转为失效积分 */
const PT_PER_HW = 1;      // 每完成一个作业
const PT_PER_RATE = 2;    // 评价每项达标
const RATE_PASS = 4;      // 达标星数（含）
const RATE_LABEL = { att: '态度', meth: '方法', eff: '努力' };
let HW_RANGE = '14';      // '7' | '14' | '30' | 'term'
const HW_RANGES = [{ v: '7', t: '7天' }, { v: '14', t: '14天' }, { v: '30', t: '30天' }, { v: 'term', t: '本学期' }];
const shiftDate = (ds, n) => { const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return ymd(d); };

/** 单日：到期作业数 / 打卡完成数 / 评价达标项 / 当天积分 */
function hwDayStat(hws, d) {
  const dueN = hws.filter(x => x.dueDate === d).length;
  const doneN = hws.filter(x => x.status === 'done' && (x.checkinAt || '').slice(0, 10) === d).length;
  const dr = (S.data.dailyRatings || []).find(r => r.gradeId === gid() && r.date === d);
  const rateHit = dr ? ['att', 'meth', 'eff'].filter(k => Number(dr[k]) >= RATE_PASS) : [];
  const ratePt = rateHit.length * PT_PER_RATE;
  return { date: d, dueN, doneN, rateHit, ratePt, points: doneN * PT_PER_HW + ratePt };
}

/** 积分总账（全时段，不受图表范围影响） */
function pointsSummary() {
  const hws = gHomeworks();
  const earnHW = hws.filter(x => x.status === 'done' && x.checkinAt).length * PT_PER_HW;
  const earnRate = (S.data.dailyRatings || []).filter(r => r.gradeId === gid())
    .reduce((s, r) => s + ['att', 'meth', 'eff'].filter(k => Number(r[k]) >= RATE_PASS).length * PT_PER_RATE, 0);
  const total = earnHW + earnRate;
  const used = (S.data.points || []).filter(p => p.gradeId === gid())
    .reduce((s, p) => s + (Number(p.amount) || 0), 0);
  return { earnHW, earnRate, total, used, live: Math.max(0, total - used) };
}

/** 图表要展示的日期序列（升序，末尾是今天） */
function hwRangeDays() {
  const t = today();
  let start;
  if (HW_RANGE === 'term') {
    const ts = curGradeTerms();
    const tt = ts.find(x => x.id === curTerm()) || activeTermOf(t) || null;
    start = (tt && tt.start) || (curGrade() && curGrade().startDate) || '';
    if (!start) start = shiftDate(t, -29);
    if (start > t) start = t;
    if (relDays(start) < -180) start = shiftDate(t, -29);   // 起始日过远（如学年起点）→ 回落 30 天
  } else {
    start = shiftDate(t, -(Number(HW_RANGE) - 1));
  }
  const out = [];
  let d = start, guard = 0;
  while (d <= t && guard++ < 400) { out.push(d); d = shiftDate(d, 1); }
  return out;
}

/** 蜡烛柱（作业量 / 完成量）+ 积分折线 */
function hwKLineSVG(days) {
  const n = days.length;
  if (!n) return '<p class="muted center">暂无数据</p>';
  const W = 340, H = 200, L = 26, R = 32, T = 14, B = 32;
  const PW = W - L - R, slot = PW / n;
  const bw = Math.max(2.5, Math.min(22, slot * 0.6));

  const maxDue = Math.max(1, ...days.map(d => Math.max(d.dueN, d.doneN)));
  const yHi = Math.max(4, Math.ceil(maxDue * 1.15));
  const maxPt = Math.max(1, ...days.map(d => d.points));
  const pHi = Math.max(4, Math.ceil(maxPt * 1.2));
  const Y = v => T + (1 - v / yHi) * (H - T - B);
  const YP = v => T + (1 - v / pHi) * (H - T - B);
  const cx = i => L + slot * i + slot / 2;

  let g = '';
  // 网格 + 左轴（作业数）+ 右轴（积分），共用 4 条线
  for (let i = 0; i <= 4; i++) {
    const y = T + (H - T - B) * i / 4, f = 1 - i / 4;
    g += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W - R}" y2="${y.toFixed(1)}" stroke="#EDF1F9" stroke-width="1"/>
      <text x="${L - 4}" y="${(y + 3).toFixed(1)}" font-size="8" fill="#9AA3BC" text-anchor="end">${Math.round(yHi * f)}</text>
      <text x="${W - R + 4}" y="${(y + 3).toFixed(1)}" font-size="8" fill="#6E9BFF" text-anchor="start">${Math.round(pHi * f)}</text>`;
  }
  g += `<text x="${L - 4}" y="${T - 4}" font-size="7.5" fill="#C2C9DC" text-anchor="end">作业</text>
        <text x="${W - R + 4}" y="${T - 4}" font-size="7.5" fill="#6E9BFF" text-anchor="start">积分</text>`;

  // 蜡烛：空心框=当天到期作业数，实心柱=当天完成数，虚线上影=未完成缺口
  const yBase = Y(0);
  days.forEach((d, i) => {
    const x0 = cx(i) - bw / 2, yDue = Y(d.dueN), yDone = Y(d.doneN);
    const full = d.dueN > 0 && d.doneN >= d.dueN;
    const part = d.doneN > 0 && d.doneN < d.dueN;
    const col = full ? '#25C685' : part ? '#FFB05C' : '#D6DDEE';
    if (d.dueN > 0) g += `<rect x="${x0.toFixed(1)}" y="${yDue.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, yBase - yDue).toFixed(1)}" fill="none" stroke="#C9D1E6" stroke-width="1" rx="1"/>`;
    if (d.doneN > 0) g += `<rect x="${x0.toFixed(1)}" y="${yDone.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0, yBase - yDone).toFixed(1)}" fill="${col}" opacity=".88" rx="1"/>`;
    if (d.dueN > d.doneN && d.dueN > 0) {
      g += `<line x1="${cx(i).toFixed(1)}" y1="${yDone.toFixed(1)}" x2="${cx(i).toFixed(1)}" y2="${yDue.toFixed(1)}" stroke="#FF7EB3" stroke-width="1.1" stroke-dasharray="2 1.6"/>`;
    }
  });

  // 积分折线（右轴）
  const pts = days.map((d, i) => ({ x: cx(i), y: YP(d.points) }));
  g += `<path d="${pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}" fill="none" stroke="#6E9BFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".9"/>`;
  pts.forEach((p, i) => { if (days[i].points > 0) g += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="2.3" fill="#fff" stroke="#6E9BFF" stroke-width="1.6"/>`; });

  // X 轴日期
  const step = n <= 14 ? 1 : n <= 31 ? 2 : Math.ceil(n / 6);
  days.forEach((d, i) => {
    if (i % step !== 0 && i !== n - 1) return;
    const dt = new Date(d.date + 'T00:00:00');
    g += `<text x="${cx(i).toFixed(1)}" y="${H - B + 14}" font-size="7.5" fill="#9AA3BC" text-anchor="middle">${dt.getMonth() + 1}/${dt.getDate()}</text>`;
    if (i === n - 1) g += `<text x="${cx(i).toFixed(1)}" y="${H - B + 24}" font-size="7" fill="#6E9BFF" text-anchor="middle" font-weight="700">今天</text>`;
  });

  // 透明热区放最后（覆盖在最上层，方便点窄柱看当天明细）
  days.forEach((d, i) => {
    g += `<rect x="${(L + slot * i).toFixed(1)}" y="${T}" width="${slot.toFixed(1)}" height="${(H - T - B).toFixed(1)}" fill="transparent" style="cursor:pointer" onclick="hwDayDetail('${d.date}')"/>`;
  });

  return `<div class="kl-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="作业量与积分">${g}</svg>
    <div class="kl-lg">
      <span><i style="background:#25C685"></i>全部完成</span>
      <span><i style="background:#FFB05C"></i>部分完成</span>
      <span><i class="hollow"></i>当天作业量</span>
      <span><i class="line"></i>当天积分</span>
    </div>
    <p class="muted center" style="font-size:10.5px;margin-top:5px">点柱子看当天明细</p></div>`;
}

function hwDayDetail(d) {
  const s = hwDayStat(gHomeworks(), d);
  const rd = relDays(d);
  const name = rd === 0 ? '今天' : rd === -1 ? '昨天' : rd === -2 ? '前天' : fmtDate(d);
  toast(`${name}：作业 ${s.dueN} 项 · 完成 ${s.doneN} 项 · 积分 +${s.points}` +
    (s.rateHit.length ? `（${s.rateHit.map(k => RATE_LABEL[k]).join('、')}达标）` : ''));
}

/** 成绩页第二块：作业记录 + 积分 */
function hwStatsHTML() {
  const hws = gHomeworks();
  const days = hwRangeDays();

      <p>还没有作业与积分数据<br>完成作业打卡后，这里会出现每天的作业量、完成量和积分曲线</p></div></div>`;

  h += `<div class="stat3">
    <div><b style="color:var(--main)">${sum.total}</b><span>总积分</span></div>

    <div><b style="color:var(--mu)">${sum.used}</b><span>失效积分（已用）</span></div>
  </div>`;

  h += `<p class="muted" style="margin:-4px 2px 10px;font-size:11.5px;line-height:1.65">
    每完成 1 个作业 <b>+${PT_PER_HW}</b> 分（记在打卡那天）；每日评价「态度 / 方法 / 努力」每项 ≥${RATE_PASS} 星 各 <b>+${PT_PER_RATE}</b> 分。<br>
    累计获得 ${sum.total} 分 = 作业 ${sum.earnHW} + 评价 ${sum.earnRate}；已使用 ${sum.used} 分（失效），剩 ${sum.live} 分可用。</p>`;

  h += `<div class="seg" id="hwRangeSeg" style="margin:2px 0 10px">${HW_RANGES.map(r =>
    `<button data-v="${r.v}" class="${HW_RANGE === r.v ? 'on' : ''}">${r.t}</button>`).join('')}</div>`;

  h += `<div class="chart-card">${hwKLineSVG(stats)}</div>`;

  const uses = (S.data.points || []).filter(p => p.gradeId === gid())

  if (uses.length) {
    h += `<div class="sec-h"><div class="sec-t" style="font-size:13.5px;color:var(--mu)">🎁 积分使用 <small>${uses.length} 笔 · 共 ${sum.used} 分</small></div></div>`;
    h += uses.map(p => {
      const click = isAdmin() ? ` onclick="pointUseForm('${p.id}')"` : '';
      return `<div class="card"${click}><div class="row"><div class="col grow">
        <b style="font-size:14px">−${Number(p.amount) || 0} 分 · ${esc(p.note || '未填用途')}</b>
        <span class="muted">${fmtDate(p.date)}${p.by ? ' · ' + esc(p.by) : ''}</span></div>
        <span class="tag gy">已失效</span></div></div>`;
    }).join('');
  }
  return h;
}
const bindHwRange = () => {

  if (el) el.onclick = e => { const b = e.target.closest('button'); if (b) { HW_RANGE = b.dataset.v; renderExams(); } };

/* ---------- SVG 曲线 ---------- */
function chartSVG(allRaw, cur) {
  const all = allRaw.filter(hasScore);
  const W = 340, H = 190, L = 30, R = 12, T = 14, B = 34;
  const showAll = cur === '__all';
  const subjects = showAll ? [...new Set(all.map(e => e.subject))] : [cur];
  const data = subjects.map((s, i) => ({
    name: s, color: SUBJ_COLORS[i % SUBJ_COLORS.length],
    items: all.filter(e => e.subject === s).sort((a, b) => (a.date || '').localeCompare(b.date || ''))
  })).filter(d => d.items.length);

  const allItems = data.flatMap(d => d.items);
  if (!allItems.length) return '<p class="muted center">暂无数据</p>';

  const rs = allItems.map(rateOf);
  let lo = Math.min(...rs), hi = Math.max(...rs);
  lo = Math.max(0, Math.floor((lo - 6) / 5) * 5);
  hi = Math.min(100, Math.ceil((hi + 4) / 5) * 5);
  if (hi - lo < 20) { lo = Math.max(0, hi - 20); }
  const single = !showAll && data[0];
  const fs = single && single.items.every(e => (e.fullScore || 100) == (single.items[0].fullScore || 100)) ? (single.items[0].fullScore || 100) : 0;

  const times = allItems.map(e => new Date((e.date || today()) + 'T00:00:00').getTime());
  const tMin = Math.min(...times), tMax = Math.max(...times);
  const X = t => tMax === tMin ? (L + (W - L - R) / 2) : L + (t - tMin) / (tMax - tMin) * (W - L - R);
  const Y = r => T + (hi - r) / (hi - lo) * (H - T - B);

  let g = '';
  // 网格
  for (let i = 0; i <= 4; i++) {
    const r = lo + (hi - lo) * i / 4, y = Y(r);
    const lab = fs ? Math.round(r / 100 * fs) : Math.round(r) + '%';
    g += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W - R}" y2="${y.toFixed(1)}" stroke="#EDF1F9" stroke-width="1"/>
          <text x="${L - 5}" y="${(y + 3).toFixed(1)}" font-size="8.5" fill="#9AA3BC" text-anchor="end">${lab}</text>`;
  }

  data.forEach(d => {
    const pts = d.items.map(e => ({ x: X(new Date((e.date || today()) + 'T00:00:00').getTime()), y: Y(rateOf(e)), e }));
    if (pts.length > 1) {
      // 平滑折线
      const path = pts.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
      if (data.length === 1) {
        g += `<path d="${path} L${pts[pts.length - 1].x.toFixed(1)},${H - B} L${pts[0].x.toFixed(1)},${H - B} Z" fill="${d.color}" opacity=".09"/>`;
      }
      g += `<path d="${path}" fill="none" stroke="${d.color}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>`;
    }
    pts.forEach((p, i) => {
      const isLast = i === pts.length - 1;
      g += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${isLast ? 4.2 : 3.2}" fill="#fff" stroke="${d.color}" stroke-width="2.2"/>`;
      if (data.length === 1) {
        g += `<text x="${p.x.toFixed(1)}" y="${(p.y - 8).toFixed(1)}" font-size="9" font-weight="700" fill="${d.color}" text-anchor="middle">${p.e.score}</text>`;
      }
    });
    // X 轴标签（单科时显示考试类型 + 日期）
    if (data.length === 1) {
      pts.forEach((p, i) => {
        if (pts.length > 6 && i % 2 === 1 && i !== pts.length - 1) return;
        const d2 = new Date(p.e.date + 'T00:00:00');
        g += `<text x="${p.x.toFixed(1)}" y="${H - B + 13}" font-size="8" fill="#9AA3BC" text-anchor="middle">${esc((p.e.type || '').slice(0, 3))}</text>
              <text x="${p.x.toFixed(1)}" y="${H - B + 23}" font-size="7.5" fill="#C2C9DC" text-anchor="middle">${d2.getMonth() + 1}/${d2.getDate()}</text>`;
      });
    }
  });

  // 班级平均虚线（单科）
  if (data.length === 1 && data[0].items.some(e => e.classAvg)) {
    const ap = data[0].items.filter(e => e.classAvg).map(e => ({
      x: X(new Date((e.date || today()) + 'T00:00:00').getTime()),
      y: Y(Math.round(Number(e.classAvg) / (Number(e.fullScore) || 100) * 1000) / 10)
    }));
    if (ap.length > 1) g += `<path d="${ap.map((p, i) => `${i ? 'L' : 'M'}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ')}" fill="none" stroke="#A55EEA" stroke-width="1.6" stroke-dasharray="5 4" opacity=".75"/>`;
  }

  const legend = data.length > 1
    ? `<div class="legend" style="margin-top:4px">${data.map(d => `<span><i style="background:${d.color};border-radius:50%"></i>${esc(d.name)}</span>`).join('')}</div>`
    : (data[0].items.some(e => e.classAvg) ? `<div class="legend" style="margin-top:4px"><span><i style="background:${data[0].color};border-radius:50%"></i>本人</span><span><i style="background:#A55EEA;border-radius:50%"></i>班级平均</span></div>` : '');

  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${g}</svg>${legend}`;
}

/* ---------- 详情与表单 ---------- */
function examDetail(id) {
  const e = S.data.exams.find(x => x.id === id);
  if (!e) return;
  const planned = !hasScore(e);
  const r = rateOf(e);
  const prev = planned ? null : prevExam(gExams().filter(hasScore).sort((a, b) => (a.date || '').localeCompare(b.date || '')), e);
  const body = `<div class="card" style="margin-bottom:12px">
    <div class="exam-i"><div class="score-ball" style="background:${planned ? 'var(--mu)' : r >= 95 ? 'var(--ok)' : r >= 85 ? 'var(--main)' : r >= 70 ? 'var(--yan)' : 'var(--warn)'};width:60px;height:60px;font-size:${planned ? '14' : '22'}px;flex:0 0 60px">${planned ? '待考' : e.score}</div>
      <div class="col grow"><b style="font-size:16px">${emojiOf(e.subject)} ${esc(e.subject)} ${esc(e.type || '')}</b>
      <span class="muted">${fmtDate(e.date)} · 满分 ${e.fullScore || 100}${planned ? ' · 考试计划' : ' · 得分率 ' + r + '%'}</span>
      ${e.name ? `<span class="muted">${esc(e.name)}</span>` : ''}</div></div>
    <div class="pkg-num" style="margin-top:11px">
      ${e.classAvg ? `<div><b>${e.classAvg}</b>班级平均</div>` : ''}
      ${e.rank ? `<div><b>${e.rank}</b>班级排名</div>` : ''}
      ${prev ? `<div><b style="color:${e.score - prev.score >= 0 ? 'var(--ok)' : 'var(--warn)'}">${e.score - prev.score >= 0 ? '+' : ''}${Math.round((e.score - prev.score) * 10) / 10}</b>较上次</div>` : ''}
    </div>
    ${e.lostPoints ? `<p class="tx2" style="margin-top:10px"><b>失分点：</b>${esc(e.lostPoints)}</p>` : ''}
    ${e.note ? `<p class="tx2" style="margin-top:6px">${esc(e.note)}</p>` : ''}
    ${e.images && e.images.length ? `<div class="hw-imgs">${e.images.map(u => `<img src="${esc(u)}" onclick="window.open('${esc(u)}')">`).join('')}</div>` : ''}
  </div>`;
  openSheet('成绩详情', body,
    `${canEdit('exam') ? `<button class="btn ghost" onclick="examForm('${e.id}')">✏️ 编辑</button>` : ''}${isAdmin() ? `<button class="btn warn" onclick="delExam('${e.id}')">🗑 删除</button>` : ''}`);
}
function delExam(id) {
  if (!isAdmin()) { toast('删除成绩需要管理员权限'); return; }
  confirmBox('删除成绩', '确定删除这条成绩记录吗？', async () => {
    try { await api('/exams/' + id, { method: 'DELETE' }); await refresh(); closeSheet(); toast('已删除'); }
    catch (e) { toast(e.message); }
  });
}

function examForm(id) {
  if (!needRole('exam')) return;
  const e = id ? S.data.exams.find(x => x.id === id) : null;
  const d = Object.assign({ subject: S.examSubject && S.examSubject !== '__all' ? S.examSubject : '语文', type: '单元测', date: today(), fullScore: 100 }, e || {});
  const body = `
    ${fSelect('efSubject', '科目', subjOptions(), d.subject, true)}
    ${fPick('efType', '考试类型', EXAM_TYPES, d.type, 'sm')}
    ${fInput('efName', '考试名称', d.name, '选填，如：第三单元 分数的认识')}
    <div class="f2">${fInput('efScore', '得分', d.score, '未考可留空', 'number')}${fInput('efFull', '满分', d.fullScore, '', 'number')}</div>
    ${fInput('efDate', '考试日期', d.date, '', 'date', true)}
    <p class="muted" style="margin-top:-6px;margin-bottom:12px">💡 日期填将来、分数留空 = 考试计划，会提前提醒复习</p>
    <div class="f2">${fInput('efAvg', '班级平均分', d.classAvg, '选填', 'number')}${fInput('efRank', '班级排名', d.rank, '选填', 'number')}</div>
    ${fInput('efLost', '失分点', d.lostPoints, '选填，如：阅读理解-3、计算粗心-2')}
    ${fArea('efNote', '备注', d.note, '选填')}
    <div class="f"><label>试卷/错题照片</label><div id="efImgs" class="hw-imgs">${(d.images || []).map(u => `<img src="${esc(u)}">`).join('')}</div>
      <button class="btn ghost sm" style="margin-top:7px" onclick="addExamImg()">📷 添加照片</button></div>`;
  openSheet(e ? '编辑成绩' : '记录成绩', body,
    `<button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn" id="efSave">保存</button>`,
    () => {
      window._efImgs = (d.images || []).slice();
      document.getElementById('efSave').onclick = async () => {
        const sv = val('efScore');
        if (!sv && val('efDate') <= today()) return toast('请填写得分（如果是将来的考试计划，请把日期改成未来日期）');
        const body = {
          gradeId: gid(), subject: val('efSubject'), type: pickVal('#efType') || '单元测', name: val('efName'),
          termId: curTerm() || null,
          score: sv === '' ? null : numVal('efScore', 0), fullScore: numVal('efFull', 100) || 100, date: val('efDate'),
          classAvg: numVal('efAvg', 0) || null, rank: numVal('efRank', 0) || null,
          lostPoints: val('efLost'), note: val('efNote'), images: window._efImgs || []
        };
        try {
          if (e) await api('/exams/' + id, { method: 'PUT', body });
          else await api('/exams', { method: 'POST', body });
          S.examSubject = body.subject;
          await refresh(); closeSheet(); toast('成绩已记录 📈');
        } catch (err) { toast(err.message); }
      };
    });
}
async function addExamImg() {
  const urls = await pickImages(4);
  if (!urls.length) return;
  window._efImgs = (window._efImgs || []).concat(urls);
  document.getElementById('efImgs').innerHTML = window._efImgs.map(u => `<img src="${u}">`).join('');
}

<script>
/* ================= 我的：家人 / 年级 / 提醒 / 数据 ================= */

function renderMe() {
  const box = document.getElementById('meBody');
  const f = S.data.family, g = curGrade();
  const r = S.data.settings.reminders;

  const doneRate = hws.length ? Math.round(hws.filter(h => h.status === 'done').length / hws.length * 100) : 0;

  let h = `<div class="card" style="background:linear-gradient(125deg,#FFF2F7,#EEF3FF)">

      <div class="pkg-ic" style="background:#fff;font-size:26px">${esc(f.childAvatar || '🌸')}</div>
      <div class="col grow"><b style="font-size:17px">${esc(f.childName || '宝贝')}</b>
        <span class="muted">${esc(g ? g.name : '')} · ${esc(g && g.schoolYear ? g.schoolYear + ' 学年' : '')}</span></div>
      ${canEdit('settings') ? `<button class="btn xs ghost" onclick="familyForm()">编辑</button>` : ''}

      <div><b>${gCourses().length}</b>门课程</div>

      <div><b>${hws.length}</b>条作业</div>
      <div><b class="ok">${doneRate}%</b>完成率</div>
    </div></div>`;

  // 当前使用者
  h += `<div class="sec-h"><div class="sec-t">👨‍👩‍👧 家庭成员 <small>${S.data.members.length} 人</small></div>
    ${canEdit('settings') ? `<button class="btn xs" onclick="memberForm()">+ 添加</button>` : ''}</div>
    <div class="card">`;
  h += S.data.members.map((m, i) => {
    const o = roleInfo(m.role);
    return `<div class="list-i" style="${i === S.data.members.length - 1 ? 'border-bottom:none' : ''}">
      <div class="list-ic">${esc(m.avatar || '👤')}</div>
      <div class="col grow"><b style="font-size:14px">${esc(m.name)}${S.who === m.name ? ' <span class="tag g">当前使用</span>' : ''}</b>
        <span class="muted">${esc(roleLabel(m.role))}</span></div>
      ${S.who === m.name ? '' : `<button class="btn xs ghost" onclick="setWho('${esc(m.name)}')">设为我</button>`}
      ${canEdit('settings') ? `<button class="btn xs ghost" onclick="memberForm('${m.id}')">✏️</button>` : ''}</div>`;
  }).join('');
  h += `<p class="muted" style="margin-top:9px">💡 把访问链接和访问码发给家人，他们在自己手机上打开就能看到同一份数据</p>
    <button class="btn block ghost sm" style="margin-top:9px" onclick="shareInfo()">📤 分享给家人</button></div>`;

  // 年级分区
  h += `<div class="sec-h"><div class="sec-t">🎓 年级分区 <small>数据独立互不干扰</small></div>
    ${canEdit('settings') ? `<button class="btn xs" onclick="gradeForm()">+ 新建</button>` : ''}</div><div class="card">`;
  h += grades.map((x, i) => `<div class="list-i" style="${i === grades.length - 1 ? 'border-bottom:none' : ''}">
      <div class="list-ic" style="background:${x.current ? 'rgba(91,140,255,.14)' : '#F0F3FC'}">${x.current ? '📗' : '📘'}</div>
      <div class="col grow"><b style="font-size:14px">${esc(x.name)} ${x.current ? '<span class="tag b">当前</span>' : x.archived ? '<span class="tag gy">已归档</span>' : ''}</b>
        <span class="muted">${esc(x.schoolYear || '')} · ${S.data.courses.filter(c => c.gradeId === x.id).length}门课 · ${S.data.exams.filter(e => e.gradeId === x.id).length}次考试</span></div>
      ${x.current ? '' : `<button class="btn xs" onclick="switchGrade('${x.id}')">切换</button>`}
      ${canEdit('settings') ? `<button class="btn xs ghost" onclick="gradeForm('${x.id}')">✏️</button>` : ''}</div>`).join('');
  h += `</div>`;

  // 提醒
  h += `<div class="sec-h"><div class="sec-t">🔔 提醒设置</div>
    ${canEdit('settings') ? `<button class="btn xs ghost" id="notifyBtn" onclick="askNotify()">开启通知</button>` : ''}</div>
    <div class="card">
      ${fSwitch('rmClass', '上课提醒', `上课前 ${r.classBefore} 分钟提醒`, r.enableClass)}
      ${fSwitch('rmHw', '作业打卡提醒', `截止前 ${r.homeworkBefore} 分钟提醒`, r.enableHomework)}
      ${fSwitch('rmPkg', '课包余额提醒', `剩余 ≤ ${r.packageLowHours} 课时时提醒`, r.enablePackage)}
      ${fSwitch('rmExam', '考试提醒', `考试前 ${r.examBefore} 天提醒`, r.enableExam)}
      ${fSwitch('rmPush', '浏览器推送通知', '需要先点右上角「开启通知」授权', r.browserPush)}
      <div class="f2" style="margin-top:12px">
        ${fInput('rmClassMin', '上课前(分钟)', r.classBefore, '', 'number')}
        ${fInput('rmHwMin', '作业前(分钟)', r.homeworkBefore, '', 'number')}
        ${fInput('rmPkgNum', '课时预警', r.packageLowHours, '', 'number')}
      </div>
      ${canEdit('settings') ? `<button class="btn block sm" onclick="saveReminders()">保存提醒设置</button>` : `<p class="muted center" style="padding:6px 0">提醒设置由管理员统一配置</p>`}
    </div>`;

  // 数据（仅管理员可见）
  if (canEdit('settings')) {
  h += `<div class="sec-h"><div class="sec-t">🗄 数据与安全</div></div><div class="card">
    <div class="list-i"><div class="list-ic">🔑</div><div class="col grow"><b style="font-size:14px">家庭访问码</b>
      <span class="muted">当前：${esc(f.accessCode || '未设置')}</span></div>
      <button class="btn xs ghost" onclick="codeForm()">修改</button></div>
    <div class="list-i"><div class="list-ic">💾</div><div class="col grow"><b style="font-size:14px">导出备份</b>
      <span class="muted">下载全部数据为 JSON 文件</span></div>
      <button class="btn xs ghost" onclick="exportData()">导出</button></div>
    <div class="list-i"><div class="list-ic">📥</div><div class="col grow"><b style="font-size:14px">恢复备份</b>
      <span class="muted">从备份文件恢复（会覆盖当前数据）</span></div>
      <button class="btn xs ghost" onclick="importData()">恢复</button></div>
    <div class="list-i"><div class="list-ic">🎁</div><div class="col grow"><b style="font-size:14px">载入示例数据</b>
      <span class="muted">先看看效果，随时可清空</span></div>
      <button class="btn xs ghost" onclick="loadDemo()">载入</button></div>
    <div class="list-i" style="border-bottom:none"><div class="list-ic">🧹</div><div class="col grow"><b style="font-size:14px">清空当前年级</b>
      <span class="muted">删除「${esc(g ? g.name : '')}」的课表/课包/作业/成绩</span></div>
      <button class="btn xs ghost" onclick="clearGradeData()">清空</button></div></div>`;

  // 更新日志（默认全部折叠，点版本号展开）

  h += (S.data.changelog || []).map(c => `<div class="clog" style="padding:7px 0;border-bottom:1px solid var(--bd)">
    <div class="clog-h" style="display:flex;align-items:center;justify-content:space-between;cursor:pointer">
      <b style="font-size:13.5px">v${esc(c.version)} <span class="muted" style="font-weight:400">${esc(c.date)}</span></b>
      <span class="clog-ar" style="transition:transform .15s;color:var(--mu)">▸</span></div>
    <ul class="clog-items" style="margin:5px 0 0 16px;font-size:12.5px;color:var(--tx2);line-height:1.75;display:none">${c.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul></div>`).join('');
  h += `</div>`;

  box.innerHTML = h;
  box.querySelectorAll('.clog-h').forEach(hd => hd.onclick = () => {
    const items = hd.parentElement.querySelector('.clog-items');
    const open = items.style.display === 'none';
    items.style.display = open ? 'block' : 'none';
    hd.querySelector('.clog-ar').textContent = open ? '▾' : '▸';
  });
  bindPicks(box);
  if ('Notification' in window && Notification.permission === 'granted') {
    const b = document.getElementById('notifyBtn');
    if (b) { b.textContent = '✅ 已开启'; b.classList.add('ok'); }
  }
}

function setWho(name) {
  S.who = name;
  localStorage.setItem('sm_who', name);
  syncRole();
  refresh().catch(() => { });
  toast('已切换为「' + name + '」');
}

async function saveReminders() {
  if (!needRole('settings')) return;
  try {
    await api('/settings', {
      method: 'PUT', body: {
        reminders: {
          enableClass: isOn('rmClass'), enableHomework: isOn('rmHw'), enablePackage: isOn('rmPkg'),
          enableExam: isOn('rmExam'), browserPush: isOn('rmPush'),
          classBefore: numVal('rmClassMin', 30), homeworkBefore: numVal('rmHwMin', 60), packageLowHours: numVal('rmPkgNum', 6)
        }
      }
    });
    await refresh(); toast('提醒设置已保存');
  } catch (e) { toast(e.message); }
}

function askNotify() {
  if (!('Notification' in window)) return toast('当前浏览器不支持通知');
  Notification.requestPermission().then(p => {
    if (p === 'granted') { toast('通知已开启 🔔'); renderMe(); new Notification('星光伴学屋', { body: '通知已开启，上课和作业不会再忘啦！', icon: '/icon.png' }); }
    else toast('通知被拒绝，可在浏览器设置中开启');
  });
}

}

function gradeForm(id) {
  if (!needRole('settings')) return;
  const g = id ? S.data.grades.find(x => x.id === id) : null;
  const y = new Date().getFullYear();
  const names = ['一年级', '二年级', '三年级', '四年级', '五年级', '六年级', '初一', '初二', '初三'];
  const termsInit = (g && Array.isArray(g.terms) && g.terms.length) ? g.terms : defaultTermSegments(`${y}-${y + 1}`);
  const curInit = (g && g.currentTermId && termsInit.some(t => t.id === g.currentTermId)) ? g.currentTermId : termsInit[0].id;
  openSheet(g ? '编辑年级' : '新建年级分区',
    `${fInput('gfName', '年级名称', g ? g.name : '', '如：四年级', 'text', true)}
     ${fPick('gfQuick', '快速选择', names, g ? g.name : '', 'sm')}
     ${fInput('gfYear', '学年', g ? g.schoolYear : `${y}-${y + 1}`, '如：2026-2027')}
     ${fInput('gfStart', '开学日期', g ? g.startDate : '', '用于计算第几周/单双周', 'date')}
     ${g ? fSwitch('gfArch', '归档此年级', '归档后仍可切换查看历史数据', g.archived) : ''}
     ${g ? '' : `<p class="muted">💡 新建后可切换过去，课表、课包、作业、成绩都独立记录；成绩曲线可跨年级回看</p>`}
     <div class="f"><label>学期 / 阶段（设置日期区间，正课/延时课按日期自动归属）</label>
       <div id="gfTerms"></div>
       <button type="button" class="btn ghost sm" id="gfAddTerm" style="margin-top:7px">＋ 添加学期/阶段</button>
       <p class="muted" style="margin-top:8px">给每个学期/假期填 开始~结束 日期（如 上学期 2026-09-01~2027-01-20）。系统据此把「今天」自动落到对应学期；课外辅导课包按有效期自动对应。不填日期则仅作手动切换标签</p>
     </div>`,
    `${g && !g.current ? `<button class="btn warn" onclick="delGrade('${g.id}')">删除</button>` : ''}
     <button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn" id="gfSave">保存</button>`,
    () => {
      document.getElementById('gfQuick').addEventListener('click', e => {
        const b = e.target.closest('button');
        if (b) document.getElementById('gfName').value = b.dataset.v;
      });
      // 学期 / 阶段管理
      const state = {
        terms: termsInit.map(t => ({ ...t })),
        currentTermId: curInit
      };
      // 日期拆成 年/月/日 三个「可滚动」下拉：移动端为滚轮选择器，月限定 1-12、日限定 1-31
      const splitDate = (v) => { const m = String(v || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? { y: m[1], m: m[2], d: m[3] } : { y: '', m: '', d: '' }; };
      const opt = (val, sel, label) => `<option value="${esc(val)}" ${Number(val) === Number(sel) ? 'selected' : ''}>${esc(label == null ? val : label)}</option>`;
      const dateTripleHTML = (which, i, v) => {
        const p = splitDate(v);
        const y0 = new Date().getFullYear();
        const sb = 'padding:5px 4px;border:1.4px solid var(--bd);border-radius:9px;font-size:12px;background:#fff';
        const years = []; for (let y = y0 - 8; y <= y0 + 12; y++) years.push(y);
        const months = []; for (let k = 1; k <= 12; k++) months.push(k);
        const days = []; for (let k = 1; k <= 31; k++) days.push(k);
        return `<span class="d3" data-i="${i}" data-which="${which}" style="display:inline-flex;align-items:center;gap:2px">
          <select class="d3y" style="${sb};width:62px">${years.map(y => opt(y, p.y, y + '年')).join('')}</select>
          <select class="d3m" style="${sb};width:48px">${months.map(k => opt(k, p.m, k + '月')).join('')}</select>
          <select class="d3d" style="${sb};width:48px">${days.map(k => opt(k, p.d, k + '日')).join('')}</select>
        </span>`;
      };
      const combineD3 = (row, which) => {
        const span = row.querySelector('.d3[data-which="' + which + '"]');
        if (!span) return '';
        const y = span.querySelector('.d3y').value;
        const m = span.querySelector('.d3m').value;
        const d = span.querySelector('.d3d').value;
        return (y && m && d) ? `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}` : '';
      };
      const renderGfTerms = () => {
        const wrap = document.getElementById('gfTerms');
        if (!wrap) return;
        wrap.innerHTML = state.terms.map((t, i) => `
          <div class="gf-term-row" style="border:1px solid var(--bd);border-radius:10px;padding:8px;margin:7px 0">
            <div style="display:flex;align-items:center;gap:7px">
              <input class="gfTermName" data-i="${i}" value="${esc(t.name)}" placeholder="如：上学期" style="flex:1;padding:7px 9px;border:1.4px solid var(--bd);border-radius:9px;font-size:13px">
              <button type="button" class="btn xs ${state.currentTermId === t.id ? 'ok' : 'ghost'}" data-act="def" data-i="${i}">${state.currentTermId === t.id ? '★ 默认' : '设为默认'}</button>
              <button type="button" class="btn xs warn" data-act="del" data-i="${i}">删除</button>
            </div>
            <div style="display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;color:var(--mu)">
              ${dateTripleHTML('start', i, t.start)}<span>~</span>${dateTripleHTML('end', i, t.end)}
            </div>
          </div>`).join('');
        wrap.querySelectorAll('button[data-act]').forEach(btn => btn.onclick = () => {
          const i = Number(btn.dataset.i);
          if (btn.dataset.act === 'def') { state.currentTermId = state.terms[i].id; renderGfTerms(); }
          else {
            state.terms.splice(i, 1);
            if (!state.terms.some(t => t.id === state.currentTermId)) state.currentTermId = state.terms[0] ? state.terms[0].id : '';
            renderGfTerms();
          }
        });
      };
      renderGfTerms();
      const addBtn = document.getElementById('gfAddTerm');
      if (addBtn) addBtn.onclick = () => {
        state.terms.push({ id: 'kt' + Math.random().toString(36).slice(2, 8), name: '' });
        renderGfTerms();
        const inp = document.querySelector('#gfTerms .gfTermName[data-i="' + (state.terms.length - 1) + '"]');
        if (inp) inp.focus();
      };
      document.getElementById('gfSave').onclick = async () => {
        if (!val('gfName')) return toast('请填写年级名称');
        // 把输入框里的学期名称 / 日期区间同步回 state
        document.querySelectorAll('#gfTerms .gf-term-row').forEach(row => {
          const i = Number(row.querySelector('.gfTermName').dataset.i);
          if (state.terms[i]) {
            state.terms[i].name = row.querySelector('.gfTermName').value.trim() || ('学期' + (i + 1));
            state.terms[i].start = combineD3(row, 'start');
            state.terms[i].end = combineD3(row, 'end');
          }
        });
        const terms = state.terms.map(t => ({ id: t.id, name: t.name, start: t.start || '', end: t.end || '' }));
        const body = {
          name: val('gfName'), schoolYear: val('gfYear'), startDate: val('gfStart'),
          terms, currentTermId: state.currentTermId || (terms[0] ? terms[0].id : '')
        };
        if (g) body.archived = isOn('gfArch');
        try {
          if (g) await api('/grades/' + id, { method: 'PUT', body });
          else {
            const r = await api('/grades', { method: 'POST', body: { ...body, current: false, archived: false } });
            await refresh();
            closeSheet();
            return confirmBox('切换到新年级？', `已创建「${body.name}」，要现在切换过去开始录入吗？`, () => switchGrade(r.data.id), '立即切换');
          }
          await refresh(); closeSheet(); toast('已保存');
        } catch (e) { toast(e.message); }
      };
    });
}
async function switchGrade(id) {
  try {
    await api(`/grades/${id}/activate`, { method: 'POST' });
    await refresh();
    closeSheet();
    toast('已切换到「' + curGrade().name + '」');
  } catch (e) { toast(e.message); }
}
function delGrade(id) {
  const g = S.data.grades.find(x => x.id === id);
  confirmBox('删除年级分区', `「${g.name}」下的所有课表、课包、作业、成绩都会被永久删除，无法恢复。确定吗？`, async () => {
    try { await api('/grades/' + id, { method: 'DELETE' }); await refresh(); closeSheet(); toast('已删除'); }
    catch (e) { toast(e.message); }
  });
}

function gradeSwitcher() {
  const gs = S.data.grades;
  openSheet('切换年级',
    `<div class="card">` + gs.map((x, i) => `<div class="list-i" style="${i === gs.length - 1 ? 'border-bottom:none' : ''}" onclick="switchGrade('${x.id}')">
      <div class="list-ic">${x.current ? '📗' : '📘'}</div>
      <div class="col grow"><b style="font-size:14.5px">${esc(x.name)}</b>
        <span class="muted">${esc(x.schoolYear || '')} · ${S.data.courses.filter(c => c.gradeId === x.id).length}门课</span></div>
      ${x.current ? '<span class="tag b">当前</span>' : '<button class="btn xs">切换</button>'}</div>`).join('') + `</div>`,
    `<button class="btn ghost" onclick="closeSheet()">关闭</button><button class="btn" onclick="closeSheet();gradeForm()">+ 新建年级</button>`);
}

/* ---------- 访问码 / 数据 ---------- */
function codeForm() {
  if (!needRole('settings')) return;
  openSheet('修改家庭访问码',
    `${fInput('cfCode', '新访问码', S.data.family.accessCode, '建议 4-6 位数字', 'text', true)}
     <p class="muted">修改后需要把新访问码告诉家人</p>`,
    `<button class="btn ghost" onclick="closeSheet()">取消</button><button class="btn" id="ccSave">保存</button>`,
    () => {
      document.getElementById('ccSave').onclick = async () => {
        const code = val('cfCode');
        if (!code) return toast('访问码不能为空');
        try {
          await api('/family', { method: 'PUT', body: { accessCode: code } });
          S.token = code; localStorage.setItem('sm_token', code);
          await refresh(); closeSheet(); toast('访问码已更新');
        } catch (e) { toast(e.message); }
      };
    });
}

function shareInfo() {
  const url = location.origin;
  const text = `📚 ${S.data.family.childName || '宝贝'} 的星光伴学屋\n链接：${url}\n访问码：${S.data.family.accessCode}`;
  if (navigator.share) {
    navigator.share({ title: '星光伴学屋', text }).catch(() => { });
  } else {
    navigator.clipboard && navigator.clipboard.writeText(text).then(() => toast('链接和访问码已复制，发给家人吧 📤'), () => { });
    openSheet('分享给家人',
      `<div class="card"><p style="font-size:14px;line-height:1.9;white-space:pre-wrap">${esc(text)}</p></div>
       <p class="muted">把上面的链接和访问码发给家人，他们用手机浏览器打开后，可以「添加到主屏幕」，像 App 一样使用。</p>`,
      `<button class="btn block" onclick="closeSheet()">知道了</button>`);
  }
}

function loadDemo() {
  if (!needRole('settings')) return;
  confirmBox('载入示例数据', '会在当前年级里生成一份示例课表、课包、作业和成绩，方便你先看看效果。可以随时用「清空当前年级」清掉。', async () => {
    try { await api('/demo', { method: 'POST' }); await refresh(); closeSheet(); go('timetable'); toast('示例数据已载入 🎁'); }
    catch (e) { toast(e.message); }
  }, '载入示例');
}
function clearGradeData() {
  if (!needRole('settings')) return;
  confirmBox('清空当前年级', `「${curGrade().name}」下的课表、课包、作业、成绩会被全部删除，家庭成员和设置会保留。建议先导出备份。确定吗？`, async () => {
    try { await api('/clear', { method: 'POST' }); await refresh(); closeSheet(); toast('已清空'); }
    catch (e) { toast(e.message); }
  }, '确认清空');
}

async function exportData() {
  try {
    const j = await api('/export');
    const blob = new Blob([JSON.stringify(j.data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `学习管家备份-${today()}.json`;
    a.click();
    toast('备份已下载');
  } catch (e) { toast(e.message); }
}
function importData() {
  if (!needRole('settings')) return;
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = '.json,application/json';
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const fr = new FileReader();
    fr.onload = async () => {
      try {
        const data = JSON.parse(fr.result);
        confirmBox('确认恢复', '当前数据会被备份文件覆盖（系统会先自动存一份当前数据）。确定继续吗？', async () => {
          await api('/import', { method: 'POST', body: data });
          await refresh(); toast('恢复成功');
        }, '确认恢复');
      } catch (e) { toast('文件格式不正确'); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

</script>
<script>
/* ================= 应用入口：路由 / 刷新 / 提醒 ================= */

const RENDER = {
  timetable: renderTimetable,
  today: renderToday,
  package: renderPackages,
  exam: renderExams,
  me: renderMe
};

function go(p) {
  S.page = p;
  if (p === 'timetable') S.ttWeekOffset = 0; // 进入课表回到当周
  $$('.page').forEach(el => el.classList.toggle('on', el.id === 'page-' + p));
  $$('#nav button').forEach(b => b.classList.toggle('on', b.dataset.p === p));
  window.scrollTo({ top: 0, behavior: 'smooth' });
  const fab = $('#fab');
  fab.style.display = p === 'me' ? 'none' : 'grid';
  RENDER[p] && RENDER[p]();
  applyRoleUI();
}

async function refresh() {
  await loadState();
  renderTop();
  RENDER[S.page] && RENDER[S.page]();
  renderVersion();
  updateBadge();
  applyRoleUI();
}

function renderTop() {
  const f = S.data.family, g = curGrade();
  $('#tbAva').textContent = f.childAvatar || '🌸';
  $('#tbName').textContent = f.childName || '宝贝';
  $('#gradeName').textContent = g ? g.name : '未设置';

  const wp = termWeekOf(today());
  const d = new Date();
  $('#tbSub').textContent = `${d.getMonth() + 1}月${d.getDate()}日 ${WD[d.getDay()]} · ${wp.term ? wp.term.name + ' ' : ''}第${wp.week > 0 && wp.week < 60 ? wp.week : '—'}周 · v${APP_VERSION}`;

  const cs = todayCourses();
  const todo = gHomeworks().filter(h => h.status !== 'done').length;
  const lowPkg = gPackages().filter(p => p.status !== 'done' && !pkgExpired(p) && p.stats.remain <= S.data.settings.reminders.packageLowHours).length;
  const nc = nextCourse();
  const nt = nc ? fmtDur(toMin(nc._t.start) - toMin(nowHM())) : '—';

  $('#tbStats').innerHTML = `
    <div class="tb-stat" onclick="go('today')"><b>${cs.length}</b><span>作业</span></div>
    <div class="tb-stat" onclick="go('today')"><b>${todo}</b><span>待办作业</span></div>
    <div class="tb-stat" onclick="go('today')"><b>${nt}</b><span>距下节课</span></div>
    <div class="tb-stat" onclick="go('package')"><b>${lowPkg || gPackages().filter(p => p.status !== 'done' && !pkgExpired(p)).length}</b><span>${lowPkg ? '课包告急' : '在读课包'}</span></div>`;
}

function renderVersion() {
  const cl = (S.data && S.data.changelog && S.data.changelog[0]) || null;
  const html = `<b>${esc((S.data && S.data.family && S.data.family.name) || '我们家')} · 星光伴学屋</b><br>
    <span>v${APP_VERSION} · 更新于 ${BUILD_TIME}${cl ? '（' + esc(cl.date) + '）' : ''}</span>`;
  ['#ver1', '#ver2', '#ver3', '#ver4', '#ver5'].forEach(s => { const e = $(s); if (e) e.innerHTML = html; });
}

function updateBadge() {
  const n = gHomeworks().filter(h => h.status !== 'done').length;
  const b = $('#navBadge');
  b.style.display = n ? 'grid' : 'none';
  b.textContent = n > 99 ? '99+' : n;
}

/* ---------- 提醒 ---------- */
function notify(key, title, body) {
  if (S.notified.has(key)) return;
  S.notified.add(key);
  sessionStorage.setItem('sm_notified', JSON.stringify([...S.notified]));
  toast('🔔 ' + title, 4000);
  const r = S.data.settings.reminders;
  if (r.browserPush && 'Notification' in window && Notification.permission === 'granted') {
    try {
      new Notification(title, { body, tag: key, icon: '/icon.png', badge: '/icon.png' });
    } catch (_) { }
  }
}

function checkReminders() {
  if (!S.data) return;
  const r = S.data.settings.reminders;
  const now = toMin(nowHM());
  const t = today();

  if (r.enableClass) {
    todayCourses().forEach(c => {
      const diff = toMin(c._t.start) - now;
      if (diff > 0 && diff <= (r.classBefore || 30)) {
        notify(`class_${t}_${c.id}`, `${fmtDur(diff)}后上课：${courseTitle(c)}`,
          `${c._t.start}-${c._t.end}${c.location ? ' · ' + c.location : ''}${c.teacher ? ' · ' + c.teacher + '老师' : ''}`);
      }
    });
  }

  if (r.enableHomework) {
    gHomeworks().filter(h => h.status !== 'done' && h.dueDate === t).forEach(h => {
      const diff = toMin(h.dueTime || '21:00') - now;
      if (diff > 0 && diff <= (r.homeworkBefore || 60)) {
        notify(`hw_${t}_${h.id}`, `作业还没打卡：${h.title}`, `${h.subject} · ${diff}分钟后到截止时间`);
      }
    });
  }

  if (r.enablePackage) {
    gPackages().filter(p => p.status !== 'done' && !pkgExpired(p) && p.stats.remain <= (r.packageLowHours || 6)).forEach(p => {
      notify(`pkg_${t}_${p.id}`, `课包余额不足：${p.name}`, `仅剩 ${p.stats.remain} 课时，记得提前安排续费`);
    });
  }

  if (r.enableExam) {
    gExams().filter(e => e.score == null && e.date >= t).forEach(e => {
      const d = relDays(e.date);
      if (d >= 0 && d <= (r.examBefore || 1)) {
        notify(`exam_${t}_${e.id}`, `${d === 0 ? '今天' : d + '天后'}考试：${e.subject} ${e.type || ''}`, e.name || '记得复习哦');
      }
    });
  }
}

/* ---------- 登录 ---------- */
async function tryEnter(code) {
  const btn = $('#loginBtn');
  btn.disabled = true; btn.textContent = '验证中…';
  try {
    const j = await api('/login', { method: 'POST', body: { code } });
    if (!j.ok) throw new Error(j.error || '访问码不正确');
    S.token = code;
    localStorage.setItem('sm_token', code);
    try { setHashParam('ac', code); } catch (e) {}
    await loadState();
    showWhoSelect();
  } catch (e) {
    toast(e.message);
    $('#codeInput').value = '';
  } finally {
    btn.disabled = false; btn.textContent = '进 入';
  }
}

async function enterApp() {
  $('#login').style.display = 'none';
  $('#whoSelect').style.display = 'none';
  $('#app').style.display = 'flex';
  $('#nav').style.display = 'flex';
  await refresh();
  go(gCourses().length ? 'today' : 'timetable');
  checkReminders();
  connectRealtime();   // 进入应用后建立实时同步（已配置 Worker 时生效，否则自动降级）
}

/* ---------- 选择身份 ---------- */
function showWhoSelect() {
  if (!S.data || !S.data.members.length) { enterApp(); return; }
  const cur = S.who;
  $('#whoList').innerHTML = S.data.members.map(m => {
    const o = roleInfo(m.role);
    return `<div class="who-i ${m.name === cur ? 'who-cur' : ''}" onclick="pickWho('${esc(m.id)}')">
      <div class="who-ava">${esc(m.avatar || '👤')}</div>
      <div class="col"><b>${esc(m.name)}</b><span class="muted">${esc(roleLabel(m.role))}</span></div>
      <span class="who-tag tag ${o.cls}">${o.tier}</span>
    </div>`;
  }).join('');
  $('#login').style.display = 'none';
  $('#app').style.display = 'none';
  $('#nav').style.display = 'none';
  $('#whoSelect').style.display = 'flex';
}
function pickWho(id) {
  const m = S.data.members.find(x => x.id === id);
  if (!m) return;
  S.who = m.name;
  localStorage.setItem('sm_who', m.name);
  syncRole();
  enterApp();
}
function whoBackToLogin() {
  disconnectRealtime();
  localStorage.removeItem('sm_token');
  localStorage.removeItem('sm_who');
  localStorage.removeItem('sm_role');
  S.token = ''; S.who = ''; S.role = '';
  $('#whoSelect').style.display = 'none';
  $('#app').style.display = 'none';
  $('#nav').style.display = 'none';
  $('#login').style.display = 'flex';
  $('#codeInput').value = '';
  setTimeout(() => $('#codeInput').focus(), 300);
}

/* ---------- 角色 UI（按当前身份控制编辑入口的可见性） ---------- */
function applyRoleUI() {
  if (!S.data) return;
  // FAB：按所在页面与角色决定
  const fabScope = { timetable: 'course', today: 'homework', package: 'package', exam: 'exam', me: null };
  const sc = fabScope[S.page];
  $('#fab').style.display = (S.page === 'me' || !sc || !canEdit(sc)) ? 'none' : 'grid';
  // 课表工具（批量录入 / 作息时间）：管理员可见
  const showTools = canEdit('course');
  $('#ttToolsSec').style.display = showTools ? '' : 'none';
  $('#ttToolsCard').style.display = showTools ? '' : 'none';
  // 顶部「切换年级 / 提醒」：所有角色均可使用（仅切换视图，不改数据）
}

/* ---------- 启动 ---------- */
(async function boot() {
  // 事件绑定
  $('#nav').addEventListener('click', e => {
    const b = e.target.closest('button[data-p]');
    if (b) go(b.dataset.p);
  });
  $('#mask').addEventListener('click', e => { if (e.target.id === 'mask') closeSheet(); });
  $('#sheetClose').onclick = closeSheet;
  $('#loginBtn').onclick = () => tryEnter($('#codeInput').value.trim());
  $('#codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(e.target.value.trim()); });
  $('#gradeBtn').onclick = () => gradeSwitcher();
  $('#bellBtn').onclick = () => { go('me'); setTimeout(() => window.scrollTo({ top: 700, behavior: 'smooth' }), 260); };
  $('#batchBtn').onclick = () => batchForm();
  $('#periodBtn').onclick = () => periodForm();

  $('#ttSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('#ttSeg button').forEach(x => x.classList.toggle('on', x === b));
    S.ttView = b.dataset.v; renderTimetable();
  });
  $('#ttWeekSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    $$('#ttWeekSeg button').forEach(x => x.classList.toggle('on', x === b));
    S.ttWeek = b.dataset.v; renderTimetable();
  });

  $('#fab').onclick = () => {
    if (S.page === 'timetable') courseForm();
    else if (S.page === 'today') hwForm();
    else if (S.page === 'package') pkgForm();
    else if (S.page === 'exam') examForm();
  };

  // 定时提醒 + 每分钟刷新倒计时
  setInterval(() => {
    checkReminders();
    if (S.data && (S.page === 'today' || S.page === 'timetable')) renderTop();
  }, 30000);

  // 回到前台时同步最新数据（家人可能改过）
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && S.token && S.data) refresh().catch(() => { });
  });

  // 尝试自动进入
  try {
    const meta = await api('/meta');
    document.title = (meta.childName || '宝贝') + ' 的星光伴学屋';
    $('#loginTitle').textContent = (meta.childName || '宝贝') + ' 的星光伴学屋';
    if (S.token) {
      const res = await api('/state');
      if (res.ok) { await loadState(); return showWhoSelect(); }
    }
  } catch (_) { }
  $('#login').style.display = 'flex';
  setTimeout(() => $('#codeInput').focus(), 300);
})();

</script>

<script>
(function () {
  function setSetupMsg(msg) {
    var el = document.getElementById('setupMsg');
    if (el && msg) { el.textContent = msg; el.style.color = '#ff6b6b'; }
  }
  function bindSetup() {
    var s = document.getElementById('setup');
    var btn = document.getElementById('setupBtn');
    if (btn && !btn._bound) {
      btn._bound = true;
      btn.onclick = function () {
        var sr = document.getElementById('setupRepo');
        var st = document.getElementById('setupToken');
        var rstr = (sr.value || '').trim();
        var t = (st.value || '').trim();
        var branch = 'main', repo = rstr, owner = '';
        var at = rstr.lastIndexOf('@');
        if (at >= 0) { branch = rstr.slice(at + 1); repo = rstr.slice(0, at); }
        var sl = repo.split('/');
        if (sl.length >= 2) { owner = sl[0]; repo = sl.slice(1).join('/'); }
        else if (sl.length === 1) { repo = sl[0]; }
        if (!owner || !repo) { sr.focus(); return; }
        if (!t) { st.focus(); return; }
        var cfg = { owner: owner, repo: repo, branch: branch, dataPath: 'state.json', token: t };
        try { saveGhCfg(cfg); } catch (e) {}
        if (window.__GITHUB) Object.assign(window.__GITHUB, cfg);
        var m = document.getElementById('setupMsg');
        if (m) { m.style.color = ''; m.textContent = '填写仓库与令牌（仅存本机与网址，不写进源码）'; }
        s.style.display = 'none';
      };
    }
  }
  function showSetup(msg) {
    var s = document.getElementById('setup');
    if (!s) return;
    if (window.__GITHUB && window.__GITHUB.token && !msg) { s.style.display = 'none'; return; }
    bindSetup();
    var sr = document.getElementById('setupRepo');
    if (sr && window.__GITHUB) {
      var rv = window.__GITHUB.owner + '/' + window.__GITHUB.repo;
      if (window.__GITHUB.branch && window.__GITHUB.branch !== 'main') rv += '@' + window.__GITHUB.branch;
      sr.value = rv;
    }
    var st = document.getElementById('setupToken'); if (st) st.value = '';
    if (msg) setSetupMsg(msg);
    s.style.display = 'flex';
    if (st) st.focus();
  }
  // 暴露给 GitHub API 层：令牌失效/无权限时自动弹配置层
  window.__smReauth = function (msg) {
    var s = document.getElementById('setup');
    if (!s) return;
    if (s.style.display === 'flex') { if (msg) setSetupMsg(msg); return; }
    showSetup(msg || '令牌已失效或无权限，请重新粘贴有效的 GitHub 令牌');
  };
  // 等 DOM 与其它脚本就绪后再判断
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(function () { showSetup(); }, 50); });
  } else {
    setTimeout(function () { showSetup(); }, 50);
  }
})();
</script>
