<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#6E9BFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>星光伴学屋</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<style>
/* ================= 星光伴学屋 · 活泼卡通风 ================= */
:root{
  --main:#5B8CFF;      /* 学校正课 */
  --main-d:#3D6FE8;
  --yan:#FF9F43;       /* 延时课 */
  --yan-d:#F08721;
  --fu:#A55EEA;        /* 课外辅导 */
  --fu-d:#8B44D6;
  --ok:#25C685;
  --warn:#FF6B6B;
  --star:#FFC531;
  --pink:#FF7EB3;

  --bg:#F4F7FF;
  --card:#FFFFFF;
  --tx:#2B3450;
  --tx2:#6B7590;
  --mu:#9AA3BC;
  --bd:#E9EDF7;
  --sh:0 4px 16px rgba(70,90,160,.08);
  --sh-lg:0 10px 34px rgba(70,90,160,.16);
  --r:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:"PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--tx);font-size:15px;line-height:1.5;
  overscroll-behavior-y:none;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(circle at 8% 4%, rgba(91,140,255,.16), transparent 42%),
    radial-gradient(circle at 94% 12%, rgba(255,126,179,.16), transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(165,94,234,.12), transparent 46%);
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none;border:none;background:none}
button{cursor:pointer}
a{color:var(--main);text-decoration:none}
img{max-width:100%;display:block}

.app{max-width:600px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;position:relative;padding-bottom:calc(74px + var(--safe-b))}

/* ---------- 顶部 ---------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:linear-gradient(135deg,#6E9BFF 0%,#A55EEA 55%,#FF7EB3 120%);
  color:#fff;padding:14px 16px 16px;border-radius:0 0 26px 26px;box-shadow:0 6px 22px rgba(91,110,220,.28);
}
.topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tb-child{display:flex;align-items:center;gap:9px;min-width:0}
.tb-ava{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.26);display:grid;place-items:center;font-size:20px;flex:0 0 38px;backdrop-filter:blur(4px)}
.tb-name{font-size:16px;font-weight:800;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-sub{font-size:11px;opacity:.88;margin-top:1px}
.tb-actions{display:flex;gap:7px;align-items:center;flex:0 0 auto}
.gradepick{background:rgba(255,255,255,.24);border-radius:20px;padding:5px 11px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:4px;white-space:nowrap}
.icon-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:15px}

/* 顶部统计条 */
.tb-stats{display:flex;gap:8px;margin-top:13px}
.tb-stat{flex:1;background:rgba(255,255,255,.2);border-radius:14px;padding:7px 6px;text-align:center;backdrop-filter:blur(6px)}
.tb-stat b{display:block;font-size:17px;font-weight:800;line-height:1.25}
.tb-stat span{font-size:10.5px;opacity:.9}

/* ---------- 内容 ---------- */
.page{padding:14px 14px 8px;display:none;animation:fadeUp .26s ease}
.page.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 9px;gap:8px}
.sec-h:first-child{margin-top:2px}
.sec-t{font-size:15.5px;font-weight:800;display:flex;align-items:center;gap:6px}
.sec-t small{font-size:11.5px;color:var(--mu);font-weight:600}

/* 全部课次：按月折叠手风琴 */
.mo-hd{display:flex;align-items:center;gap:8px;padding:11px 13px;background:var(--card);border:1px solid var(--bd);border-radius:13px;cursor:pointer;box-shadow:var(--sh)}
.mo-hd b{font-size:14.5px;font-weight:800;color:var(--tx)}
.mo-hd .muted{font-size:12px}
.mo-hd .mo-ar{margin-left:auto;color:var(--mu);font-size:12px;transition:transform .2s}
.mo-hd:active{transform:scale(.995)}

.card{background:var(--card);border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh);margin-bottom:11px;position:relative}
.card.flat{box-shadow:none;border:1.5px solid var(--bd)}
.row{display:flex;align-items:center;justify-content:space-between;gap:9px}
.col{display:flex;flex-direction:column;gap:2px;min-width:0}
.muted{color:var(--mu);font-size:12px}
.tx2{color:var(--tx2);font-size:12.5px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{text-align:center}

.btn{background:var(--main);color:#fff;border-radius:22px;padding:8px 17px;font-size:13.5px;font-weight:700;box-shadow:0 3px 10px rgba(91,140,255,.32);transition:transform .12s,box-shadow .12s;display:inline-flex;align-items:center;gap:5px;justify-content:center}
.btn:active{transform:scale(.95)}
.btn.sm{padding:5px 13px;font-size:12.5px;border-radius:16px}
.btn.xs{padding:3px 10px;font-size:11.5px;border-radius:14px;box-shadow:none}
.btn.ghost{background:#fff;color:var(--tx2);border:1.5px solid var(--bd);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:0 3px 10px rgba(37,198,133,.3)}
.btn.warn{background:var(--warn);box-shadow:0 3px 10px rgba(255,107,107,.3)}
.btn.fu{background:var(--fu);box-shadow:0 3px 10px rgba(165,94,234,.3)}
.btn.yan{background:var(--yan);box-shadow:0 3px 10px rgba(255,159,67,.3)}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}

.tag{font-size:11px;padding:2.5px 9px;border-radius:20px;font-weight:700;white-space:nowrap;display:inline-block}
.tag.b{background:rgba(91,140,255,.13);color:var(--main)}
.tag.o{background:rgba(255,159,67,.15);color:var(--yan-d)}
.tag.p{background:rgba(165,94,234,.13);color:var(--fu)}
.tag.g{background:rgba(37,198,133,.14);color:var(--ok)}
.tag.r{background:rgba(255,107,107,.13);color:var(--warn)}
.tag.gy{background:#EFF2F9;color:var(--mu)}

.empty{text-align:center;padding:34px 18px;color:var(--mu)}
.empty .em{font-size:44px;margin-bottom:8px;display:block;filter:saturate(.9)}
.empty p{font-size:13px;line-height:1.7}

/* ---------- 课表 ---------- */
.tt-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:11px}
.seg{display:flex;background:#E8EDFA;border-radius:15px;padding:3px;gap:2px}
.seg button{padding:5px 13px;border-radius:12px;font-size:12.5px;font-weight:700;color:var(--tx2);transition:.16s}
.seg button.on{background:#fff;color:var(--main);box-shadow:0 2px 7px rgba(70,90,160,.14)}

.tt-wrap{background:var(--card);border-radius:var(--r);padding:9px 8px 11px;box-shadow:var(--sh);overflow-x:auto}
.tt{display:grid;gap:4px;min-width:340px}
.tt-hd{font-size:11.5px;font-weight:800;color:var(--tx2);text-align:center;padding:3px 0 5px}
.tt-hd.today{color:var(--main)}
.tt-hd .d{font-size:9.5px;color:var(--mu);font-weight:600;display:block}
.tt-rn{font-size:9.5px;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;font-weight:700}
.tt-rn i{font-style:normal;font-size:8px;color:#C2C9DC;font-weight:500}
.tt-cell{border-radius:10px;min-height:44px;padding:4px 3px;font-size:10.5px;line-height:1.3;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-weight:700;position:relative;overflow:hidden;transition:transform .12s}
.tt-cell:active{transform:scale(.94)}
.tt-cell small{font-weight:500;font-size:8.5px;opacity:.92;display:block;margin-top:1px}
.tt-cell.t-main{background:linear-gradient(150deg,#6E9BFF,#4A80F0)}
.tt-cell.t-extend{background:linear-gradient(150deg,#FFB05C,#F5912B)}
.tt-cell.t-tutor{background:linear-gradient(150deg,#B77BEE,#9450DE)}
.tt-cell.empty-cell{background:#F6F8FE;border:1.5px dashed #DFE5F4;color:#C3CADC;font-size:15px;font-weight:400;box-shadow:none}
.tt-cell.hw-dot::after{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--star);box-shadow:0 0 0 1.5px rgba(255,255,255,.75)}
.tt-sep{grid-column:1/-1;display:flex;align-items:center;gap:7px;margin:5px 0 2px;font-size:10.5px;font-weight:800;color:var(--tx2)}
.tt-sep::after{content:"";flex:1;height:1px;background:var(--bd)}
.legend{display:flex;gap:12px;justify-content:center;margin-top:11px;font-size:11.5px;color:var(--tx2);flex-wrap:wrap}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}

/* 课表周导航条 + 当周高亮 */
.tt-weekbar{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:14px;padding:8px 10px;box-shadow:var(--sh);margin-bottom:9px}
.tt-weekbar .wb-arrow{width:34px;height:34px;flex:0 0 auto;border:none;border-radius:50%;background:#EEF2FB;color:var(--main);font-size:20px;font-weight:800;line-height:1;cursor:pointer;transition:.15s}
.tt-weekbar .wb-arrow:active{transform:scale(.9);background:#E0E7F7}
.tt-weekbar .wb-mid{flex:1;min-width:0;text-align:center;cursor:pointer}
.tt-weekbar .wb-lab{display:block;font-size:14px;font-weight:800;color:var(--tx1)}
.tt-weekbar .wb-sub{display:block;font-size:10.5px;color:var(--mu);margin-top:1px}
.tt-weekbar.off{opacity:.92}
.tt-weekbar.off .wb-lab{color:var(--tx2)}
.tt-weekbar.cur{background:linear-gradient(120deg,#EAF1FF,#F3EEFF)}
.tt-hd.today{color:#fff;background:var(--main);border-radius:9px;padding:3px 0 5px;box-shadow:0 3px 9px rgba(74,128,240,.32)}
.tt-cell.is-today{outline:2.5px solid rgba(74,128,240,.55);outline-offset:-2.5px}
.tt.is-curweek{} /* 当周靠列高亮表现 */

/* 每日评价（态度/方法/努力，每天一次） */
.daily-sec{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:12px 12px 14px;margin-bottom:12px}
.daily-head{font-size:13.5px;color:var(--tx2);margin-bottom:10px}
.daily-head small{display:block;margin-top:3px;font-weight:400;color:var(--mu);font-size:11.5px}
.daily-sec .rate-edit{margin-bottom:10px}
.daily-sec #drSave{width:100%}
.tt-before{padding:14px 16px;margin-bottom:12px;background:linear-gradient(120deg,#FFF3F7,#EEF3FF);border:1px dashed rgba(110,155,255,.5);border-radius:14px;color:var(--tx2);font-size:13.5px;text-align:center;line-height:1.6}

/* 4 维星级评分 */
.rate-edit{background:#F7F9FE;border-radius:12px;padding:10px 12px;margin-bottom:10px}
.rate-line{display:flex;align-items:center;gap:8px;margin:6px 0}
.rate-lab{width:58px;flex:0 0 auto;font-size:13px;color:var(--tx2);font-weight:700}
/* 说明固定占一行：不缩进（用满整行宽度）+ 超出省略，绝不折行 */
.rate-tip{margin:2px 0 8px;font-size:10.5px;color:var(--mu);line-height:1.5;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-row{flex:1;display:flex;align-items:center}
.st-stars{cursor:pointer;font-size:18px;letter-spacing:2px;line-height:1}
.st-stars.ro{cursor:default}
.st{color:#D7DEEC;transition:.12s}
.st.on{color:var(--star)}
.st:active{transform:scale(1.18)}
.rate-box{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.rate-row{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--tx2)}
.rate-row .rate-lab{width:auto;font-weight:700}

/* ---------- 今日时间轴 ---------- */
.tl{position:relative;padding-left:5px}
.tl-item{display:flex;gap:11px;position:relative;padding-bottom:13px}
.tl-item:last-child{padding-bottom:2px}
.tl-time{flex:0 0 44px;font-size:11.5px;font-weight:800;color:var(--tx2);padding-top:12px;text-align:right}
.tl-time span{display:block;font-size:9.5px;color:var(--mu);font-weight:600}
.tl-line{flex:0 0 14px;position:relative;display:flex;justify-content:center}
.tl-line::before{content:"";position:absolute;top:16px;bottom:-14px;width:2px;background:var(--bd)}
.tl-item:last-child .tl-line::before{display:none}
.tl-dot{width:13px;height:13px;border-radius:50%;background:#fff;border:3px solid var(--main);margin-top:11px;z-index:1}
.tl-dot.d-extend{border-color:var(--yan)}
.tl-dot.d-tutor{border-color:var(--fu)}
.tl-dot.done{background:var(--ok);border-color:var(--ok)}
.tl-body{flex:1;background:var(--card);border-radius:15px;padding:10px 12px;box-shadow:var(--sh);min-width:0;border-left:4px solid var(--main)}
.tl-body.b-extend{border-left-color:var(--yan)}
.tl-body.b-tutor{border-left-color:var(--fu)}
.tl-body.past{opacity:.58}
.tl-body.now{box-shadow:0 0 0 2.5px rgba(91,140,255,.32),var(--sh)}
.tl-t{font-size:14px;font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* 下节课提醒条 */
.next-card{background:linear-gradient(120deg,#5B8CFF,#A55EEA);color:#fff;border-radius:var(--r);padding:13px 15px;box-shadow:0 8px 22px rgba(110,110,230,.3);margin-bottom:13px;display:flex;align-items:center;gap:12px}
.next-ic{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.24);display:grid;place-items:center;font-size:22px;flex:0 0 44px}
.next-card b{font-size:15px;font-weight:800;display:block}
.next-card p{font-size:11.5px;opacity:.92;margin-top:2px}
.next-cd{margin-left:auto;text-align:center;background:rgba(255,255,255,.22);border-radius:13px;padding:6px 10px;flex:0 0 auto}
.next-cd b{font-size:15px}
.next-cd span{font-size:9.5px;opacity:.9}

/* 作业条目 */
.hw{background:var(--card);border-radius:15px;padding:11px 13px;box-shadow:var(--sh);margin-bottom:9px;display:flex;gap:11px;align-items:flex-start;position:relative;overflow:hidden}
.hw::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--main)}
.hw.s-extend::before{background:var(--yan)}
.hw.s-tutor::before{background:var(--fu)}
.hw.done{opacity:.66}
.hw.done::before{background:var(--ok)}
.hw.overdue::before{background:var(--warn)}
.hw-ck{width:25px;height:25px;border-radius:9px;border:2.2px solid #D6DDEE;flex:0 0 25px;display:grid;place-items:center;margin-top:1px;font-size:13px;color:transparent;transition:.16s}
.hw-ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.hw-main{flex:1;min-width:0}
.hw-t{font-size:14px;font-weight:700;line-height:1.4}
.hw.done .hw-t{text-decoration:line-through;color:var(--mu)}
.hw-meta{display:flex;gap:7px;align-items:center;margin-top:4px;flex-wrap:wrap;font-size:11px;color:var(--mu)}
.hw-imgs{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.hw-imgs img{width:52px;height:52px;object-fit:cover;border-radius:9px;border:1px solid var(--bd)}

/* ---------- 作业：14天日期条 + 按日期分组 ---------- */
.hw-bar{display:flex;gap:7px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hw-bar::-webkit-scrollbar{display:none}
.hw-day{flex:0 0 auto;width:50px;padding:7px 0 6px;border-radius:13px;background:#fff;border:1.5px solid var(--bd);text-align:center;cursor:pointer;transition:.15s}
.hw-day:active{transform:scale(.94)}
.hw-day .w{display:block;font-size:11px;font-weight:700;color:var(--tx2)}
.hw-day .d{display:block;font-size:13px;font-weight:800;color:var(--tx1);margin-top:1px}
.hw-day .n{display:inline-block;min-width:15px;height:15px;line-height:15px;border-radius:8px;font-size:9.5px;font-weight:800;color:#fff;background:var(--main);margin-top:3px;padding:0 3px}
.hw-day .n.warn{background:var(--warn)}
.hw-day .n.hide{visibility:hidden}
.hw-day.today{background:var(--main);border-color:var(--main);box-shadow:0 3px 10px rgba(91,140,255,.3)}
.hw-day.today .w,.hw-day.today .d{color:#fff}
.hw-day.today .n{background:#fff;color:var(--main)}
.hw-day.today .n.warn{color:var(--warn)}
.hw-day.on{border-color:var(--main);box-shadow:0 0 0 2px rgba(91,140,255,.18)}
.hw-g{margin-bottom:9px}
.hw-g-hd{display:flex;align-items:center;gap:8px;padding:10px 13px;background:var(--card);border:1px solid var(--bd);border-radius:13px;cursor:pointer;box-shadow:var(--sh);min-height:44px}
.hw-g-hd:active{transform:scale(.995)}
.hw-g-hd b{font-size:14px;font-weight:800;color:var(--tx)}
.hw-g-hd .muted{font-size:11.5px}
.hw-g-hd .ar{margin-left:auto;color:var(--mu);font-size:12px;transition:transform .2s}
.hw-g.open .hw-g-hd{border-radius:13px 13px 0 0;border-bottom:none}
.hw-g.open .hw-g-hd .ar{transform:rotate(90deg)}
.hw-g-bd{background:var(--card);border:1px solid var(--bd);border-top:none;border-radius:0 0 13px 13px;padding:7px 7px 0;box-shadow:var(--sh)}
.hw-g:not(.open) .hw-g-bd{display:none}
.hw-g-bd .hw{margin-bottom:7px;padding:9px 11px;border-radius:11px}
.hw-g-bd .hw:last-child{margin-bottom:7px}
.hw-g.ov .hw-g-hd{background:linear-gradient(120deg,#FFF1F3,#FFF8F9);border-color:rgba(255,90,110,.42)}
.hw-g.ov .hw-g-hd b{color:var(--warn)}
.hw-g.tdy .hw-g-hd{background:linear-gradient(120deg,#EAF1FF,#F6F9FF);border-color:rgba(91,140,255,.38)}
.hw-more{display:block;width:100%;padding:11px;border:1px dashed var(--bd);border-radius:13px;background:#fff;color:var(--tx2);font-size:12.5px;font-weight:700;margin-bottom:10px}

/* ---------- 作业记录 K 线图（成绩页） ---------- */
.kl-wrap{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.kl-wrap::-webkit-scrollbar{display:none}
.kl-wrap svg{display:block}
.kl-lg{display:flex;gap:11px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:4px;font-size:10.5px;color:var(--tx2);font-weight:600}
.kl-lg span{display:flex;align-items:center;gap:4px}
.kl-lg i{width:9px;height:9px;border-radius:2px;display:inline-block;flex:0 0 auto}
.kl-lg i.hollow{border:1.2px solid #C9D1E6;background:transparent}
.kl-lg i.line{width:13px;height:2.5px;border-radius:2px;background:#6E9BFF}

/* 进度条 */
.bar{height:8px;border-radius:8px;background:#EEF1F9;overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .5s cubic-bezier(.3,1,.4,1)}
.pkg-hd{display:flex;align-items:center;gap:10px}
.pkg-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:0 0 42px;background:rgba(165,94,234,.12)}
.pkg-num{display:flex;gap:14px;margin-top:9px;font-size:11.5px;color:var(--tx2)}
.pkg-num b{display:block;font-size:15.5px;font-weight:800;color:var(--tx)}
.pkg-num b.warn{color:var(--warn)}
.pkg-num b.ok{color:var(--ok)}

/* ---------- 成绩 ---------- */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}

<script>
// 从部署网址自动推断仓库路径（GitHub Pages: owner.github.io/repo），失败回退已知默认值
function deriveGhCfg() {
  var o = 'viya-c', r = 'banxuewu', b = 'main';
  try {
    var h = location.hostname || '';
    if (h.indexOf('.github.io') > 0) { var sub = h.split('.')[0]; if (sub && sub !== 'github') o = sub; }
    var seg = (location.pathname || '/').split('/').filter(Boolean);
    if (seg.length) r = seg[0];
  } catch (e) {}
  return { owner: o, repo: r, branch: b, dataPath: 'state.json', token: '' };
}
// 同步配置读取：优先网址 #hash 的 cfg（刷新/WebView 不丢），回退 localStorage，再回退网址推断
function readGhCfg() {
  var cfg = deriveGhCfg();
  try { var ls = localStorage.getItem('sm_ghcfg'); if (ls) Object.assign(cfg, JSON.parse(ls)); } catch (e) {}
  try { var raw = getHashParam('cfg'); if (raw) Object.assign(cfg, JSON.parse(decodeURIComponent(raw))); } catch (e) {}
  return cfg;
}
// 同步配置保存：写本机 localStorage + 网址 hash（配置一次，永久跟随链接）
function saveGhCfg(c) {
  try { localStorage.setItem('sm_ghcfg', JSON.stringify(c)); } catch (e) {}
  try { setHashParam('cfg', encodeURIComponent(JSON.stringify(c))); } catch (e) {}
}
// 通用 hash 参数读写（令牌 ght / 访问码 ac 共存于同一片段，互不覆盖）
function getHashParam(key) {
  try {
    var h = (location.hash || '').replace(/^#/, '');
    var parts = h.split('&');
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split('=');
      if (decodeURIComponent(kv[0]) === key) return decodeURIComponent(kv[1] || '');
    }
  } catch (e) {}
  return '';
}
function setHashParam(key, val) {
  try {
    var h = (location.hash || '').replace(/^#/, '');
    var params = {};
    h.split('&').forEach(function (p) { if (p) { var kv = p.split('='); params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || ''); } });
    params[key] = val;
    var s = Object.keys(params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
    history.replaceState(null, '', location.pathname + location.search + '#' + s);
  } catch (e) {}
}
window.__GITHUB = readGhCfg();
</script>
<script>
// 星光伴学屋 · 业务逻辑层（前端版，供 GitHub 后端适配层复用）
// 与 deploy/cloudflare/logic.js 同源，仅去掉 export 以作为普通 <script> 全局加载。
const APP_VERSION = '1.0.33';
const BUILD_NO = '20260830e';
const BUILD_TIME = '2026-08-30';
const HOUSEHOLD_ID = 'default';

/* ---------------------------- 工具 ---------------------------- */
function uid(p = 'id') {
  const b = new Uint8Array(3);
  crypto.getRandomValues(b);
  const hex = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return p + '_' + Date.now().toString(36) + '_' + hex;
}
function hmToMin(hm) { if (!hm) return 0; const [h, m] = String(hm).split(':').map(Number); return (h || 0) * 60 + (m || 0); }
function minToHm(m) { m = ((Math.round(m % 1440) + 1440) % 1440); const h = Math.floor(m / 60), mm = m % 60; return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0'); }
function endFromStart(start, durMin) { return minToHm(hmToMin(start) + (Number(durMin) || 0)); }
/** 本地日期转 YYYY-MM-DD（避免 toISOString 的 UTC 偏移导致跨天错位） */
function ymd(d) { d = d instanceof Date ? d : new Date(d); if (isNaN(d)) return ''; const p = n => String(n).padStart(2, '0'); return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`; }

/* ---------------------------- 常量 ---------------------------- */

/* ---------------------------- 学年 / 学期 ---------------------------- */
function schoolYearRange(sy) {
  const m = String(sy || '').match(/(\d{4})\s*-\s*(\d{4})/);
  if (m) return { y0: +m[1], y1: +m[2] };
  const y = new Date().getFullYear();
  return { y0: y, y1: y + 1 };
}
function schoolYearOf(dateStr) {
  const d = dateStr ? new Date(dateStr + 'T00:00:00') : new Date();
  const y = d.getFullYear();
  const sy = d.getMonth() >= 8 ? y : y - 1;
  return sy + '-' + (sy + 1);
}
function defaultTermSegments(sy) {
  const { y0, y1 } = schoolYearRange(sy);
  return [
    { id: 't1', name: '上学期', start: `${y0}-09-01`, end: `${y1}-01-20` },
    { id: 't2', name: '寒假', start: `${y1}-01-21`, end: `${y1}-02-15` },
    { id: 't3', name: '下学期', start: `${y1}-02-16`, end: `${y1}-07-05` },
    { id: 't4', name: '暑假', start: `${y1}-07-06`, end: `${y1}-08-31` }
  ];
}

/* ---------------------------- 课包计算 ---------------------------- */
function packageStats(pkg) {
  const total = Number(pkg.totalHours) || 0;
  const hoursEach = Number(pkg.hoursEach) || 1;
  const rolledHours = Number(pkg.rolledHours) || 0;   // 结转出去的课时：结转到新年级后，旧包剩余应归零、且记录结转量
  const sessions = pkg.sessions || [];
  if (sessions.length) {
    const consumed = sessions.reduce((s, x) => {
      if (x.status === 'at' || x.status === 'mk') return s + (Number(x.hours) || hoursEach);
      if (x.status === 'lv' && pkg.leaveRule === 'deduct') return s + (Number(x.hours) || hoursEach);
      return s;
    }, 0);
    const attended = sessions.filter(x => x.status === 'at').length;
    const makeup = sessions.filter(x => x.status === 'mk').length;
    const leave = sessions.filter(x => x.status === 'lv').length;
    const cancelled = sessions.filter(x => x.status === 'no').length;
    const remain = Math.max(0, total - consumed - rolledHours);
    return {
      total, consumed, remain, rolledHours, leave, makeup, attended, cancelled,
      scheduled: sessions.filter(x => x.status === 'sc').length,
      percent: total ? Math.round(consumed / total * 100) : 0
    };
  }
  const recs = pkg.records || [];
  const used = recs.filter(r => r.type === 'consume').reduce((s, r) => s + (Number(r.hours) || 1), 0);
  const leave = recs.filter(r => r.type === 'leave').length;
  const makeup = recs.filter(r => r.type === 'makeup').reduce((s, r) => s + (Number(r.hours) || 1), 0);
  const consumed = used;
  const remain = Math.max(0, total - consumed - rolledHours);
  return { total, consumed, remain, rolledHours, leave, makeup, attended: used, cancelled: 0, scheduled: Math.max(0, total - used), percent: total ? Math.round(consumed / total * 100) : 0 };
}
function fixSessionDate(s) {
  if (!s.plannedDate || s.weekday == null) return;
  const wd = Number(s.weekday);
  const cur = new Date(s.plannedDate + 'T00:00:00');
  if (isNaN(cur) || cur.getDay() === wd) return;
  for (let off = 1; off <= 7; off++) {
    const a = new Date(cur); a.setDate(a.getDate() - off);
    const b = new Date(cur); b.setDate(b.getDate() + off);
    if (a.getDay() === wd) { s.plannedDate = ymd(a); return; }
    if (b.getDay() === wd) { s.plannedDate = ymd(b); return; }
  }
}
function migratePackages(DB) {
  if (!DB.packages) return;
  DB.packages.forEach(p => {
    if (!Array.isArray(p.schedule)) p.schedule = [];
    if (p.hoursEach == null) p.hoursEach = 1;
    if (!p.leaveRule) p.leaveRule = 'keep';
    if (p.durationMin == null) {
      const s0 = (p.schedule && p.schedule[0]) || {};
      p.durationMin = (s0.end && s0.start) ? (hmToMin(s0.end) - hmToMin(s0.start)) : 90;
    }
    if (!Array.isArray(p.sessions)) p.sessions = [];
    if (!Array.isArray(p.records)) p.records = [];
    (p.sessions || []).forEach(s => { if (!s.end && s.start) s.end = endFromStart(s.start, p.durationMin); });
    (p.sessions || []).forEach(fixSessionDate);
  });
}
function projectEndDate(pkg) {
  const sched = (pkg.schedule && pkg.schedule.length) ? pkg.schedule : null;
  const target = Math.ceil((Number(pkg.totalHours) || 0) / (Number(pkg.hoursEach) || 1));
  if (!sched || !target) return null;
  const start = pkg.startDate ? new Date(pkg.startDate + 'T00:00:00') : new Date();
  const d = new Date(start);
  let made = 0, guard = 0, last = null;
  while (made < target && guard++ < 3000) {
    d.setDate(d.getDate() + 1);
    const wd = d.getDay();
    if (sched.some(s => Number(s.weekday) === wd)) { made++; last = ymd(d); }
  }
  return last;
}
function ensureSessions(pkg) {
  pkg.sessions = pkg.sessions || [];
  const target = Math.ceil((Number(pkg.totalHours) || 0) / (Number(pkg.hoursEach) || 1));
  if (!target) return pkg.sessions.length;
  const sched = (pkg.schedule && pkg.schedule.length) ? pkg.schedule : null;
  if (!sched) return pkg.sessions.length;
  (pkg.sessions || []).forEach(s => { if (s.start && s.status !== 'at') s.end = endFromStart(s.start, pkg.durationMin); });
  if (pkg.sessions.length >= target) return pkg.sessions.length;
  const today0 = new Date(); today0.setHours(0, 0, 0, 0);
  let start;
  if (pkg.sessions.length) {
    const last = pkg.sessions.reduce((m, s) => (s.plannedDate > m ? s.plannedDate : m), '');
    start = new Date(last + 'T00:00:00');
  } else {
    start = pkg.startDate ? new Date(pkg.startDate + 'T00:00:00') : today0;
  }
  const end = pkg.endDate ? new Date(pkg.endDate + 'T00:00:00') : null;
  let count = pkg.sessions.length;
  const d = new Date(start);
  d.setDate(d.getDate() - 1);   // 从「有效期开始」当天起排（首轮 +1 回到 start，避免漏掉开始日当天）
  let guard = 0;
  while (count < target && guard++ < 1000) {
    d.setDate(d.getDate() + 1);
    if (end && d > end) break;
    const wd = d.getDay();
    const slot = sched.find(s => Number(s.weekday) === wd);
    if (slot) {
      const plannedDate = ymd(d);
      if (pkg.sessions.some(s => s.plannedDate === plannedDate)) continue;
      const past = d < today0;
      pkg.sessions.push({
        id: uid('s'), idx: pkg.sessions.length,
        plannedDate: ymd(d),
        weekday: wd, start: slot.start, end: slot.end || endFromStart(slot.start, pkg.durationMin),
        status: past ? 'at' : 'sc', rescheduled: false, makeupOf: null,
        hours: Number(pkg.hoursEach) || 1, note: past ? '已上课' : '',
        createdAt: new Date().toISOString()
      });
      count++;
    }
  }
  if (!pkg.endDate && pkg.sessions.length) pkg.endDate = pkg.sessions[pkg.sessions.length - 1].plannedDate;
  return count;
}
function nextFreeSlot(pkg, from) {
  const sched = pkg.schedule || [];
  const occupied = new Set((pkg.sessions || []).map(x => x.plannedDate));
  let d = from && from.plannedDate ? new Date(from.plannedDate + 'T00:00:00') : new Date();
  let guard = 0;
  while (guard++ < 400) {
    d.setDate(d.getDate() + 1);
    const wd = d.getDay();
    if (sched.some(s => Number(s.weekday) === wd) && !occupied.has(ymd(d))) return ymd(d);
  }
  const fallback = new Date((from && from.plannedDate ? from.plannedDate : new Date()) + 'T00:00:00');
  fallback.setDate(fallback.getDate() + 7);
  return ymd(fallback);
}

/** 按「新每周固定上课时间」重排未来待上课次：
 *  - 保留历史已上课(at)/请假(lv)/补课(mk)/取消(no) 等记录不动
 *  - 按「剩余课时」从最后已上课(at)日期之后、且最早不早于今天，重新铺设未来 sc 课次
 *  - 因此改星期 / 改时间后，未来课次一定按新排期生成（不再出现“没有需要重排的课次”或排到过去的情况） */
function rescheduleFuture(pkg) {
  const sched = pkg.schedule || [];
  if (!sched.length) return 0;
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const dur = pkg.durationMin || 90;
  const target = Math.ceil((Number(pkg.totalHours) || 0) / (Number(pkg.hoursEach) || 1)) || 0;
  if (!target) return 0;
  const sessions = pkg.sessions || [];
  const keep = sessions.filter(s => s.status !== 'sc');            // 历史 / 特殊课次保留
  const attended = sessions.filter(s => s.status === 'at').length;
  const need = Math.max(0, target - attended);                     // 还需要的未来课次数
  const end = pkg.endDate ? new Date(pkg.endDate + 'T00:00:00') : null;
  // 锚点取「最后已上课(at)日期」与「今天」的较大值：
  //  - 只用 at，避免未来的请假/补课把重排起点推到未来、造成近期间空档
  //  - 不早于今天，保证待上课次不会排到过去
  let anchor = t0;
  const ats = keep.filter(s => s.status === 'at');
  if (ats.length) {
    const lastAt = ats.reduce((m, s) => (s.plannedDate > m ? s.plannedDate : m), '');
    if (lastAt) anchor = new Date(Math.max(new Date(lastAt + 'T00:00:00').getTime(), t0.getTime()));
  }
  // 有效期开始日晚于锚点（如改了有效期开始日）→ 从有效期开始日重铺未来课次
  if (pkg.startDate) {
    const sd = new Date(pkg.startDate + 'T00:00:00');
    if (sd.getTime() > anchor.getTime()) anchor = sd;
  }
  const result = keep.slice();
  let made = 0, exceeded = false;
  const d = new Date(anchor.getTime());
  let guard = 0;
  while (made < need && guard++ < 4000) {
    d.setDate(d.getDate() + 1);
    if (d < t0) continue;                        // 不把待上课次放到过去
    const wd = d.getDay();
    const slot = sched.find(x => Number(x.weekday) === wd);
    if (!slot) continue;
    const pd = ymd(d);
    if (result.some(s => s.plannedDate === pd)) continue;
    if (end && d > end) exceeded = true;         // 已超出原有效期，后续会顺延补足
    result.push({
      id: uid('s'), idx: result.length,
      plannedDate: pd, weekday: wd,
      start: slot.start, end: slot.end || endFromStart(slot.start, dur),
      status: 'sc', rescheduled: true, makeupOf: null,
      hours: Number(pkg.hoursEach) || 1, note: '', createdAt: new Date().toISOString()
    });
    made++;
  }
  pkg.sessions = result;
  // 若改排期后超出原有效期导致没排满，顺延有效期补足，保证已购课时完整排满
  if (exceeded && pkg.endDate) {
    const last = result.reduce((m, s) => (s.plannedDate > m ? s.plannedDate : m), '');
    if (last > pkg.endDate) pkg.endDate = last;
  }
  return made;
}

/** 统一重算课包全部「待上课(sc)」课次：保留历史已上课/请假/补课/取消 及 手动添加/调课 的课次，
 *  其余 sc 按「当前每周固定时间 + 总课时 + 开课/有效期」重新铺满；每次保存/修改课包都会调用，
 *  因此改开课日、有效期、星期、时长、总课时等都会自动反映到课次（不再需要单独「生成/补充」「重排」）。 */
function rebuildPkgSessions(pkg) {
  const sched = pkg.schedule || [];
  if (!sched.length) return 0;
  const dur = pkg.durationMin || 90;
  const target = Math.ceil((Number(pkg.totalHours) || 0) / (Number(pkg.hoursEach) || 1)) || 0;
  if (!target) return 0;
  const sessions = pkg.sessions || [];
  // 受保护（原样保留，不重排）：已处理的历史课次(at/mk/lv/no)，或用户手动添加/调过的课次
  const keep = sessions.filter(s => s.status !== 'sc' || s.manual === true);
  const occupied = new Set(keep.map(s => s.plannedDate));
  const t0 = new Date(); t0.setHours(0, 0, 0, 0);
  const end = pkg.endDate ? new Date(pkg.endDate + 'T00:00:00') : null;
  // 起点 = 课包开课日(startDate)；未设开课日则从今天起。改开课日提前时会从新开课日向前补排（补齐历史缺口）
  const anchor = pkg.startDate ? new Date(pkg.startDate + 'T00:00:00') : new Date(t0.getTime());
  const need = Math.max(0, target - keep.length);   // 还需铺的课次数
  const result = keep.slice();
  let made = 0, exceeded = false;
  const d = new Date(anchor.getTime()); d.setDate(d.getDate() - 1);  // 首轮 +1 回到开课日当天，避免漏掉开课日
  let guard = 0;
  while (made < need && guard++ < 4000) {
    d.setDate(d.getDate() + 1);
    const wd = d.getDay();
    const slot = sched.find(x => Number(x.weekday) === wd);
    if (!slot) continue;
    const pd = ymd(d);
    if (occupied.has(pd)) continue;        // 跳过已存在课次（历史/手动/调课）的日期，不重复
    if (end && d > end) exceeded = true;   // 超出原有效期，后续顺延补足
    // 新生成的都是“正常待上课次”，rescheduled=false（不再误标为「调课」）；过去日期也照常铺（补齐缺口）
    result.push({
      id: uid('s'), idx: result.length,
      plannedDate: pd, weekday: wd,
      start: slot.start, end: slot.end || endFromStart(slot.start, dur),
      status: 'sc', rescheduled: false, origDate: null, makeupOf: null,
      hours: Number(pkg.hoursEach) || 1, note: '', createdAt: new Date().toISOString()
    });
    made++;
  }
  pkg.sessions = result;
  // 改排期后超出原有效期导致没排满，顺延有效期补足，保证已购课时完整排满
  if (exceeded && pkg.endDate) {
    const last = result.reduce((m, s) => (s.plannedDate > m ? s.plannedDate : m), '');
    if (last > pkg.endDate) pkg.endDate = last;
  }
  return made;
}

/* ---------------------------- 年级 / 迁移 ---------------------------- */
function currentGrade(DB) { return DB.grades.find(g => g.current) || DB.grades[0]; }
function migrateGrades(DB) {
  (DB.grades || []).forEach(g => {
    const defs = defaultTermSegments(g.schoolYear);
    if (!Array.isArray(g.terms) || !g.terms.length) {
      g.terms = defs;
    } else {
      const exById = {}, exByName = {};
      g.terms.forEach(t => { exById[t.id] = t; if (t.name) exByName[t.name] = t; });
      g.terms = defs.map(d => {
        const ex = exById[d.id] || exByName[d.name] || null;
        return ex ? { id: ex.id, name: ex.name || d.name, start: ex.start || d.start, end: ex.end || d.end } : d;
      });
    }
    if (!g.currentTermId || !g.terms.some(t => t.id === g.currentTermId)) g.currentTermId = g.terms[0].id;
    const def = g.currentTermId;
    (DB.courses || []).filter(c => c.gradeId === g.id && !c.termId).forEach(c => { c.termId = def; });
  });
}
function dedupeCourses(DB) {
  if (!Array.isArray(DB.courses)) return;
  const seen = new Set();
  const keep = [];
  for (const c of DB.courses) {
    const key = [c.gradeId, c.type, c.subject, c.name, c.weekday, c.periodIdx ?? null, c.startTime || '', c.endTime || ''].join('|');
    if (seen.has(key)) continue;
    seen.add(key);
    keep.push(c);
  }
  if (keep.length !== DB.courses.length) DB.courses = keep;
}

function reconcile(DB) {

  for (const k of Object.keys(def)) if (DB[k] === undefined) DB[k] = def[k];
  for (const k of Object.keys(def.settings)) if (DB.settings[k] === undefined) DB.settings[k] = def.settings[k];

  if (!(DB.changelog || []).some(c => c.version === APP_VERSION)) DB.changelog = [dl.changelog[0], ...(DB.changelog || [])];

<script>

 * 整份应用状态存为仓库内一个 JSON 文件，前端用 GitHub API 读写，
 * 家人多端通过轮询（每 15 秒）实现同步。所有 api() 逻辑与 Worker 版一致。
 */
(function () {
  if (!window.__GITHUB) return;

  let ghSha = null;       // 当前 state.json 的 blob sha
  let syncing = false;

  function headers(extra) {
    const h = { Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
    if (G.token) h.Authorization = 'Bearer ' + G.token;

  }
  function fileUrl() {
    return `https://api.github.com/repos/${encodeURIComponent(G.owner)}/${encodeURIComponent(G.repo)}/contents/${encodeURIComponent(G.dataPath)}?ref=${encodeURIComponent(G.branch)}`;
  }
  function b64enc(str) { return btoa(unescape(encodeURIComponent(str))); }
  function b64dec(b64) { return decodeURIComponent(escape(atob(b64))); }

  async function ghGet() {
    const res = await fetch(fileUrl(), { headers: headers() });

    if (res.status === 401 || res.status === 403) { if (typeof window.__smReauth === 'function') window.__smReauth('令牌已失效或无权限，请重新粘贴有效的 GitHub 令牌'); throw new Error('令牌无效或已失效（HTTP ' + res.status + '）'); }
    if (!res.ok) throw new Error('读取仓库失败（HTTP ' + res.status + '）');
    const j = await res.json();
    ghSha = j.sha;
    return JSON.parse(b64dec(j.content));
  }
  async function ghPut(state) {
    const body = { message: '星光伴学屋 · 更新数据', content: b64enc(JSON.stringify(state)), branch: G.branch };
    if (ghSha) body.sha = ghSha;     // 已存在则带 sha；首次创建不带
    const res = await fetch(fileUrl(), {
      method: 'PUT',
      headers: headers({ 'Content-Type': 'application/json' }),
      body: JSON.stringify(body)

    if (res.status === 409) { ghSha = null; await ghGet(); throw new Error('数据冲突，已自动刷新，请重试'); }
    if (res.status === 429) throw new Error('操作太频繁，GitHub 暂时限流了，请稍后再试');
    if (res.status === 401 || res.status === 403) {
      // 403 有两种截然不同的原因：令牌真的失效/无权限，或 GitHub 的「二级限流」（短时间写入过频）。
      // 旧代码一律当成令牌失效并强制重新授权 —— 批量保存触发限流时，会被误报成「令牌已失效」，
      // 用户莫名其妙被踢出去重贴令牌。这里先读响应体区分开。

      }

    }

    const method = (opt.method || 'GET').toUpperCase();

    if (seg[0] === 'packages' && seg[2] === 'sessions' && seg[4] === 'action' && method === 'POST') {

        if (col === 'packages') {
          rebuildPkgSessions(list[i]);
          syncLinkedCourses(list[i], { subject: body.subject, name: body.name, teacher: body.teacher, org: body.org, teacherContact: body.teacherContact });
        }

      if (method === 'DELETE' && seg[1]) { const i = list.findIndex(x => x.id === seg[1]); if (i < 0) return { ok: false, error: '记录不存在' }; const [removed] = list.splice(i, 1); if (col === 'grades') { state.courses = state.courses.filter(c => c.gradeId !== removed.id); state.packages = state.packages.filter(p => p.gradeId !== removed.id); state.homeworks = state.homeworks.filter(h => h.gradeId !== removed.id); state.exams = state.exams.filter(e => e.gradeId !== removed.id); state.points = (state.points || []).filter(p => p.gradeId !== removed.id); if (removed.current && state.grades[0]) state.grades[0].current = true; } if (col === 'grades' || col === 'homeworks') { state.checkins = state.checkins.filter(c => state.homeworks.some(h => h.id === c.homeworkId)); } if (col === 'courses') state.homeworks.forEach(h => { if (h.courseId === removed.id) h.courseId = null; }); await commit(); return ok(removed); }

  }

  /* 轮询同步（替代 WebSocket 实时通道） */
  async function syncOnce() {

/* ---------- 请求 ---------- */
// API 基地址：本地运行（node server.js）走同源，留空即可；

    if (!j.ok) throw new Error(j.error || '操作失败');

/* ---------- 实时同步（WebSocket） ----------

  if (RT.ws || !API_BASE || !S.token) return;        // 本地 / 未部署 / 未登录 → 不连
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const url = API_BASE.replace(/^https?:/, proto) + '/api/ws?token=' + encodeURIComponent(S.token);
  try {
    const ws = new WebSocket(url);
    RT.ws = ws;
    ws.onopen = () => { RT.retry = 0; console.log('[实时同步] 已连接'); };
    ws.onmessage = ev => {
      try {

          RT.lastSync = now;

const pad2 = n => String(n).padStart(2, '0');

  return { term: null, week, total: null, scope: 'year', before: week < 1 };
}
// 当前查看周的偏移允许范围（基于所显示学期起止的周一），无学期则基本不限
function weekOffsetBounds() {
  const g = curGrade();
  if (!g || !g.terms || !g.terms.length) return { min: -520, max: 520 };
  const termId = curTerm() || (activeTermOf(today()) && activeTermOf(today()).id) || g.terms[0].id;
  const term = g.terms.find(t => t.id === termId) || g.terms[0];
  if (!term || !term.start) return { min: -520, max: 520 };
  const base = new Date(mondayOf(today()) + 'T00:00:00');
  const minOf = new Date(mondayOf(term.start) + 'T00:00:00');
  const maxOf = new Date(mondayOf(term.end) + 'T00:00:00');
  return {
    min: Math.floor((minOf - base) / 604800000),
    max: Math.floor((maxOf - base) / 604800000)
  };
}
// 打开应用时把当前学期落到「今天」所在时段（每个页面会话只同步一次，手动切换后刷新不跳回）
// 同步结果会写回服务端，避免导航/刷新时又被服务端旧值覆盖
let _termSynced = false;
async function syncTodayTerm() {
  if (_termSynced) return;
  const g = curGrade(); if (!g || !g.terms) return;
  const t = activeTermOf(today(), g);
  if (t) {
    if (g.currentTermId !== t.id) {
      g.currentTermId = t.id;
      try { await api('/grades/' + g.id, { method: 'PUT', body: { currentTermId: t.id } }); } catch (_) { }
    }
    _termSynced = true;
  }
}

// 课包按有效期对照年级时段，推导所属学期/假期标签
const pkgTermLabel = (p) => {
  const segs = curGradeTerms().filter(t => t.start && t.end);
  if (!segs.length || !p.startDate || !p.endDate) return p.term ? termLabel(p.term) : '';
  const ov = segs.map(t => {
    const s = p.startDate < t.start ? t.start : p.startDate;
    const e = p.endDate > t.end ? t.end : p.endDate;
    const days = s <= e ? Math.round((new Date(e) - new Date(s)) / 86400000) + 1 : 0;
    return { t, days };
  }).filter(x => x.days > 0).sort((a, b) => b.days - a.days);
  if (!ov.length) return p.term ? termLabel(p.term) : '全年/长线';
  if (ov.length === 1) return ov[0].t.name;
  return '跨 ' + ov.map(x => x.t.name).join('·');
};

// 客户端默认四个时段（新建年级用）
function defaultTermSegments(sy) {

    { id: 't4', name: '暑假', start: `${y1}-07-06`, end: `${y1}-08-31` }
  ];
}

const termSegHTML = () => {

};
const bindTermSeg = () => { const ts = document.getElementById('termSeg'); if (ts) ts.onclick = e => { const b = e.target.closest('button'); if (b) switchTerm(b.dataset.v); }; };
async function switchTerm(id) {

/** 课程时间（返回 {start,end}） */
function courseTime(c) {
  if (c.type === 'tutor' || c.customTime) return { start: c.startTime || '', end: c.endTime || '' };
  const arr = c.type === 'extend' ? S.data.settings.extendPeriods : S.data.settings.periods;
  const p = arr[c.periodIdx];
  return p ? { start: p.start, end: p.end } : { start: c.startTime || '', end: c.endTime || '' };
}
function courseTitle(c) {
  return c.name || c.subject || '未命名';
}

/** 课外辅导课程是否应在某日期显示：关联了课包时，需落在课包「开课~有效期」区间内；无课包关联的常驻显示 */
function courseInPkgRange(c, iso) {
  if (!c.packageId) return true;
  const p = S.data.packages.find(x => x.id === c.packageId);
  if (!p) return true;
  if (p.startDate && iso < p.startDate) return false;
  if (p.endDate && iso > p.endDate) return false;
  return true;
}
/** 某节课当天是否生效（单双周） */
function courseActive(c, parity) {
  if (!c.weekType || c.weekType === 'all') return true;
  return c.weekType === parity;
}

// 点击星星设置评分（再点同一颗可清零），同步隐藏输入与高亮

/* ---------- 每日评价（态度/方法/努力，每天一次）---------- */

/** 选择器按钮组交互 */
function bindPicks(root) {

/* ---------- 表单片段 ---------- */
function fSelect(id, label, options, cur, required) {

}
function fPick(id, label, options, cur, extraClass = '') {
  return `<div class="f"><label>${label}</label><div class="pick ${extraClass}" id="${id}">${
    options.map(o => {
      const v = typeof o === 'string' ? o : o.v, t = typeof o === 'string' ? o : o.t;
      return `<button type="button" data-v="${esc(v)}" class="${String(cur) === String(v) ? 'on' : ''}">${esc(t)}</button>`;
    }).join('')}</div></div>`;

function fSwitch(id, title, sub, on) {

    <div class="toggle ${on ? 'on' : ''}" id="${id}"></div></div>`;

const subjOptions = () => S.data.settings.subjects;

/* ---------- 图片上传 ---------- */
async function pickImages(max = 3) {
  return new Promise(resolve => {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true;
    inp.onchange = async () => {
      const files = Array.from(inp.files || []).slice(0, max);
      const urls = [];
      for (const f of files) {
        try {
          const dataUrl = await compressImage(f);
          const r = await api('/upload', { method: 'POST', body: { dataUrl } });
          urls.push(r.url);
        } catch (e) { toast('图片上传失败：' + e.message); }
      }
      resolve(urls);
    };
    inp.click();
  });
}
function compressImage(file, maxW = 1080, q = 0.72) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', q));
      };
      img.onerror = reject;
      img.src = fr.result;
    };
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}
