        '<div class="dbtns"><button class="mini" onclick="speak(this.dataset.x,this)" data-x="'+esc(d.en)+'">'+svg(I.vol,'s')+'朗读</button>'+
        '<button class="mini g" onclick="speakSlow(this)" data-x="'+esc(d.en)+'">0.6x 精听</button>'+
        '<button class="mini g" onclick="parseSentence(\''+escJs(d.en)+'\',\''+escJs(d.zh)+'\',curUnit.voc,null)">🔍 解析</button></div></div></div>';
    });
    h+='<button class="btn full" style="margin-top:6px" onclick="markStudied()">'+svg(I.check,'s')+'学完了，去读拓展阅读</button>';
  }
  else if(curTab==='voc'){
    h+='<div class="hint" style="margin-bottom:11px">点 <b>☆ 收藏</b> 把词收进「我的词库」；点 <b>标不认识</b> 安排今天复习。系统按 <b>1/2/4/7/15 天</b> 艾宾浩斯间隔提醒。对话和长难句里的词也可直接点。</div>';
    u.voc.forEach(function(v,i){
      var inb=!!S.words[v.w],unk=inb&&S.words[v.w].unk;
      h+='<div class="vc"><div class="vtop"><span class="vw">'+esc(v.w)+'</span><span class="vp">'+esc(v.p)+'</span>'+
        '<button class="mini" style="margin-left:auto" onclick="speak(this.dataset.x,this)" data-x="'+esc(v.w)+'">'+svg(I.vol,'s')+'</button></div>'+
        '<div class="vzh">'+esc(v.zh)+'</div>'+
        '<div class="vex">'+esc(v.ex)+'<i>'+esc(v.exzh)+'</i></div>'+
        '<div class="vacts">'+
        '<button class="mini '+(inb?'':'g')+'" onclick="toggleFav(\''+escJs(v.w)+'\')">'+(inb?'✓ 已收藏':'☆ 收藏')+'</button>'+
        '<button class="mini '+(unk?'dan':'g')+'" onclick="toggleUnk(\''+escJs(v.w)+'\')">'+(unk?'🔴 不认识':'标不认识')+'</button>'+
        '<button class="mini" onclick="speak(this.dataset.x,this)" data-x="'+esc(v.ex)+'">'+svg(I.play,'s')+'读例句</button>'+
        '</div>'+
        (inb?'<textarea class="vnote" placeholder="写点笔记…（自动保存）" onblur="saveNote(\''+escJs(v.w)+'\',this.value)">'+esc(S.words[v.w].note||'')+'</textarea>':'')+
        '</div>';
    });
    h+='<button class="btn full" onclick="switchTab(\'sen\')">下一步：长难句解析</button>';
  }
  else if(curTab==='sen'){
    h+='<div class="hint" style="margin-bottom:11px">这里拆的是<b>你听得懂单词却听不懂整句</b>的那类句子——把主干、从句、修饰成分分开看，长句就不再可怕。</div>';
    u.sen.forEach(function(s,si){
      h+='<div class="sc"><div class="sen hl-target" data-cid="sen-'+si+'">'+linkVoc(s.en,u.voc)+'</div><div class="szh">'+esc(s.zh)+'</div>'+
        '<div class="row" style="margin-top:9px"><button class="mini" onclick="speak(this.dataset.x,this)" data-x="'+esc(s.en)+'">'+svg(I.vol,'s')+'朗读</button>'+
        '<button class="mini g" onclick="speakSlow(this)" data-x="'+esc(s.en)+'">0.6x 逐词</button>'+
        '<button class="mini g" onclick="parseSentence(\''+escJs(s.en)+'\',\''+escJs(s.zh)+'\',curUnit.voc,curUnit.sen['+si+'])">🔍 解析</button></div>'+
        '<div class="sparts">'+s.parts.map(function(p,i){
          var c=['','g','o','p'][i%4];
          return '<div class="sp"><span class="spt '+c+'">'+esc(p.t)+'</span><span>'+p.c+'</span></div>'}).join('')+
        '<div class="stip"><b>易错提醒</b>'+s.tip+'</div></div></div>';

    h+='<button class="btn full" onclick="switchTab(\'qz\')">下一步：成果测试</button>';

  else if(curTab==='qz'){
    var p=S.prog[u.id]||{};
    if(vtUnit!==u.id){
      var pp=S.prog[u.id]||{};
      if(pp.quizDone&&pp.vtDone&&pp.vtQs){
        vtQs=pp.vtQs.map(function(q){return {k:q.k,q:q.q,o:q.o.slice(),a:q.a,e:q.e,w:q.w}});
        vtAns=pp.vtAns?Object.assign({},pp.vtAns):{};vtDone=true;
      }else{vtQs=genVocTest(u);vtAns={};vtDone=false;}
      vtUnit=u.id;
    }
    // 以「作答是否真正完整」决定显示答题界面还是结果面板，而非依赖 quizDone 标志
    var qzN=Object.keys(quizAns).length, vtN=Object.keys(vtAns).length;
    var qzAll=qzN===u.qz.length, vtAll=(vtQs.length===0||vtN===vtQs.length);
    var allAns=quizDone&&qzAll&&vtAll;
    var totalQ=u.qz.length+vtQs.length;
    var body='<div class="hint" style="margin-bottom:11px">本测试含两部分：<b>'+u.qz.length+' 道单元理解题</b> + <b>'+vtQs.length+' 道自动生成的词汇/语言题</b>（核心词汇中英互译 + 句子填空）。'+(p.quizDone?'历史最佳成果测试 <b>'+p.quizBest+'</b> 分。':'首次测试。')+'答错的词自动进词库复习。<b>按总题量 80 分及格</b>。</div>';
    u.qz.forEach(function(q,i){
      body+='<div class="q"><div class="qn">理解题 '+(i+1)+'</div><div class="qq">'+esc(q.q)+'</div>';
      q.o.forEach(function(o,j){
        var cls='';
        if(allAns){if(j===q.a)cls=' ok';else if(quizAns[i]===j)cls=' no';}
        else if(quizAns[i]===j)cls=' sel';
        body+='<button class="opt'+cls+'" onclick="pick('+i+','+j+')"><span class="ol">'+'ABCD'[j]+'</span><span>'+esc(o)+'</span></button>';
      });
      if(allAns)body+='<div class="qexp on"><b>解析：</b>'+esc(q.e)+'</div>';
      body+='</div>';
    });
    if(vtQs.length){
      body+='<div class="vtsep"><span>词汇与语言测验（自动生成）</span></div>';
      vtQs.forEach(function(q,i){
        body+='<div class="q"><div class="qn">词汇题 '+(i+1)+' · '+(q.k==='cz'?'句子填空':q.k==='ze'?'中文→英文':'英文→中文')+'</div><div class="qq">'+esc(q.q)+'</div>';
        q.o.forEach(function(o,j){
          var cls='';
          if(allAns){if(j===q.a)cls=' ok';else if(vtAns[i]===j)cls=' no';}
          else if(vtAns[i]===j)cls=' sel';
          body+='<button class="opt'+cls+'" onclick="vtPick('+i+','+j+')"><span class="ol">'+'ABCD'[j]+'</span><span>'+esc(o)+'</span></button>';
        });
        if(allAns&&q.e)body+='<div class="qexp on"><b>解析：</b>'+esc(q.e)+'</div>';
        body+='</div>';
      });
    }
    if(!allAns){
      var ansN=qzN+vtN;
      h=body+'<button class="btn full" onclick="submitComboQuiz()">'+(quizDone?'重新提交答卷':'提交答卷')+'（已答 '+ansN+'/'+totalQ+'）</button>';
    }
    else{
      var qzS=qzN?calcScore():(p.quizBest||0),vtS=(vtQs.length&&vtN)?Math.round(vtRight()/vtQs.length*100):(p.vtBest||0);
      var comb=Math.round((qzS*u.qz.length+(vtS*vtQs.length))/(totalQ||1));
      h='<div class="result"><div class="rbig">'+comb+'<small> 分</small></div>'+
        '<div style="margin-top:8px;font-size:14px;color:var(--sub)">成果测试 '+qzS+' 分 · 词汇测验 '+(vtQs.length?vtS+' 分':'—')+'<br>'+
          (comb>=80?'达标！可以进入下一单元了':comb>=60?'基本掌握，建议重看长难句后重测':'先回看对话和词汇，再来一次')+'</div>'+
        '<div class="row" style="margin-top:14px"><button class="btn out" style="flex:1" onclick="quizAns={};quizDone=false;vtQs=genVocTest(curUnit);vtAns={};vtDone=false;renderUnit()">重新测试</button>'+
        '<button class="btn" style="flex:1" onclick="submitComboQuiz()">'+svg(I.refresh,'s')+'重新提交</button>'+
        '<button class="btn g" style="flex:1" onclick="openSpk(\''+u.id+'\')">'+svg(I.mic,'s')+'口语跟读</button></div></div>'+body;
    }
  }
  else if(curTab==='read'){
    var mod=COURSE.find(function(m){return m.id===curUnit.modId})||{};
    var rd=(mod.rd||[]);
    if(!rd.length){h+='<div class="empty">本主题暂未配置阅读素材。</div>';}
    else{
      rd.forEach(function(r,ri){
        var rdDone=S.read[r.id]&&S.read[r.id].done;
        h+='<div class="reading"><div class="rhead"><span class="rbadge '+(r.kind==='email'?'em':'ar')+'">'+(r.kind==='email'?'应用邮件':'职场短文')+'</span><b>'+esc(r.title)+'</b>'+(rdDone?'<span class="pill suc">已读完</span>':'')+'</div>';
        if(r.kind==='email'&&r.head){
          h+='<div class="remail"><div class="re"><span>收件</span>'+esc(r.head.to)+'</div><div class="re"><span>发件</span>'+esc(r.head.from)+'</div><div class="re"><span>主题</span>'+esc(r.head.subject)+'</div></div>';
        }
        h+='<div class="rbody hl-target" id="rbody'+ri+'" data-cid="read-'+ri+'">'+linkVoc(r.en,r.voc)+'</div>';
        h+='<div class="row" style="margin-top:8px">'+
          '<button class="mini" onclick="playSentences(document.getElementById(\'rbody'+ri+'\').innerText,this)">'+svg(I.play,'s')+'分句朗读</button>'+
          '<button class="mini g" onclick="playSentences(document.getElementById(\'rbody'+ri+'\').innerText,this,true)">0.6x 精听</button>'+
          '<button class="mini g" onclick="parsePassage('+ri+')">🔍 解析</button></div>';
        h+='<button class="rzh-toggle" onclick="toggleRzh('+ri+')">'+svg(I.eye,'s')+'中文译文 ▾</button>';
        h+='<div class="rzh-body" id="rzh'+ri+'" style="display:none">'+esc(r.zh||'（本篇暂无中文译文）')+'</div>';
        h+='<div class="rhint">读完后做下面 '+(r.q?r.q.length:0)+' 道理解题检测理解：</div>';
        (r.q||[]).forEach(function(q,qi){
          h+='<div class="rq"><div class="rqn">理解题 '+(qi+1)+'</div><div class="rqq">'+esc(q.q)+'</div>';
          q.o.forEach(function(o,j){
            var ans=readAns[ri]&&readAns[ri][qi];
            var cls='';
            if(ans!==undefined){if(j===q.a)cls=' ok';else if(ans===j)cls=' no';}
            else if(ans===j)cls=' sel';
            h+='<button class="opt'+cls+'" onclick="pickRead('+ri+','+qi+','+j+')"><span class="ol">'+'ABCD'[j]+'</span><span>'+esc(o)+'</span></button>';
          });
          if(readAns[ri]&&readAns[ri][qi]!==undefined)h+='<div class="qexp on"><b>解析：</b>'+esc(q.e)+'</div>';
          h+='</div>';
        });
        h+='</div>';
      });
      var allAns=true;
      rd.forEach(function(r,ri){(r.q||[]).forEach(function(q,qi){if(!(readAns[ri]&&readAns[ri][qi]!==undefined))allAns=false;});});
      if(allAns&&rd.length){
        h+='<button class="btn full" onclick="markRead()">'+svg(I.check,'s')+'标记本主题阅读完成</button>';
        h+='<button class="btn out full" style="margin-top:8px" onclick="switchTab(\'voc\')">下一步：核心词汇</button>';
      }
      else h+='<div class="hint">提示：答完所有理解题后可标记阅读完成，进度会计入「听说读写」评估。</div>';
    }
  }
  document.getElementById('upBody').innerHTML=h;
  applyHl();
}
function switchTab(t){
  if(t==='read')readAns={};
  curTab=t;document.querySelectorAll('#upTabs button').forEach(function(x){x.classList.toggle('on',x.dataset.t===t)});
  renderUnit();document.getElementById('upBody').scrollTop=0;
}
function pickRead(ri,qi,ji){
  if(!readAns[ri])readAns[ri]={};
  readAns[ri][qi]=ji;
  renderUnit();
}
function markRead(){
  var mod=COURSE.find(function(m){return m.id===curUnit.modId})||{};
  (mod.rd||[]).forEach(function(r){S.read[r.id]={done:true}});
  save();renderUnit();renderMe();
}
function toggleZh(btn){
  S.set.showZh=!S.set.showZh;save();
  document.querySelectorAll('.dzh').forEach(function(e){e.classList.toggle('hide',!S.set.showZh)});
  btn.innerHTML=svg(I.eye,'s')+(S.set.showZh?'隐藏中文':'显示中文');
}
function speakSlow(btn){var r=S.set.rate;S.set.rate=0.6;speak(btn.dataset.x,btn);S.set.rate=r}
var _pi=0;
function playAll(btn){
  _pi=0;var d=curUnit.dlg;
  (function next(){
    if(_pi>=d.length){if(btn)btn.classList.remove('playing');return}
    if(btn)btn.classList.add('playing');
    var el=document.getElementById('den'+_pi);
    if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
    var txt=d[_pi].en;_pi++;
    speak(txt,null,next);
  })();
}
function playSentences(text,btn,slow){
  if(!synth){toast('当前浏览器不支持朗读');return}
  var sents=splitSent(text),i=0;
  if(btn)btn.classList.add('playing');
  (function next(){
    if(i>=sents.length){if(btn)btn.classList.remove('playing');return}
    var txt=sents[i++];
    speak(txt,null,function(){setTimeout(next,300);},slow?0.6:undefined);
  })();
}
/* 整篇阅读逐句解析（详细版：主干 + 时态语态 + 成分 + 关键词汇角色） */
function parsePassage(ri){
  var mod=COURSE.find(function(m){return m.id===curUnit.modId})||{};
  var r=(mod.rd||[])[ri]||{};
  var en=r.en||'', voc=r.voc||[], zh=r.zh||'';
  var aligned=alignSents(en,zh);
  var h='<div class="pm-en">全文共 '+aligned.length+' 句，逐句解析（含中文译文对齐）</div>';
  aligned.forEach(function(pair,si){
    h+=renderSentenceAnalysis(pair.en,pair.zh,voc);
  });
  document.getElementById('parseBody').innerHTML=h;
  document.getElementById('parseModal').classList.add('on');

    para=para.replace(/^\s*[-*]\s*/,'').trim();

    var ss=para.match(/[^.!?]+[.!?]*/g);
    if(ss){ss.forEach(function(x){var y=x.trim();if(y)out.push(y);});}
    else{var y=para.trim();if(y)out.push(y);}
  });

}

/* 时态识别 */
function detectTense(en){

  if(/\b(had)\s+\w+ed\b/i.test(en))return '过去完成时：表示过去某一时间之前已完成的动作。';
  if(/\b(was|were)\s+\w+ing\b/i.test(en))return '过去进行时：描述过去某一时刻正在进行的动作。';
  if(/\b(am|is|are)\s+\w+ing\b/i.test(en))return '现在进行时：表示此刻或现阶段正在进行的动作。';
  if(/\b(was|were)\s+\w+ed\b/i.test(en))return '一般过去时的被动语态。';
  if(/\b(am|is|are)\s+\w+ed\b/i.test(en))return '一般现在时的被动语态。';
  if(/\b\w+ed\b/i.test(en))return '一般过去时：描述过去发生的动作或状态。';

/* 情态识别 */
function detectModality(en){

function vocabRole(sent,w,pos){

function detectGrammar(en){

  if(/—|;/.test(s))tags.push('并列/补充说明：破折号或分号用于补充、举例或并列，书面与口语中都常见。');
  if(/\b(not only|either|neither|both|as well as|not just|but also|rather than|instead of)\b/i.test(s))tags.push('并列/对比结构：注意主谓一致与结构对称。');

function genVocTest(u){
  var voc=u.voc||[],qs=[];
  function sh(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  sh(voc).slice(0,Math.min(4,voc.length)).forEach(function(v){
    var others=sh(voc.filter(function(x){return x.w!==v.w})).slice(0,3).map(function(x){return x.zh;});
    var o=sh([v.zh].concat(others));
    qs.push({k:'ew',q:'“'+v.w+'” 的意思是？',o:o,a:o.indexOf(v.zh),e:'正确答案：'+v.zh+'（'+v.p+'）',w:v.w});
  });
  sh(voc).slice(0,Math.min(3,voc.length)).forEach(function(v){
    var others=sh(voc.filter(function(x){return x.w!==v.w})).slice(0,3).map(function(x){return x.w;});
    var o=sh([v.w].concat(others));
    qs.push({k:'ze',q:'“'+v.zh+'” 对应的英文是？',o:o,a:o.indexOf(v.w),e:'正确答案：'+v.w,w:v.w});
  });
  (u.sen||[]).slice(0,Math.min(2,(u.sen||[]).length)).forEach(function(s){
    var inVoc=voc.filter(function(v){return s.en.indexOf(v.w)>=0;});
    if(!inVoc.length)return;
    var v=inVoc[Math.floor(Math.random()*inVoc.length)];
    var blank=s.en.replace(new RegExp('\\b'+v.w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b'),'______');
    var others=sh(voc.filter(function(x){return x.w!==v.w})).slice(0,3).map(function(x){return x.w;});
    var o=sh([v.w].concat(others));
    qs.push({k:'cz',q:'填空：'+blank,e:'应填：'+v.w,w:v.w,o:o,a:o.indexOf(v.w)});
  });
  return sh(qs);
}

function submitComboQuiz(){
  if(Object.keys(quizAns).length<curUnit.qz.length){toast('还有理解题没答完');return;}
  if(vtQs.length&&Object.keys(vtAns).length<vtQs.length){toast('还有词汇题没答完');return;}
  quizDone=true;vtDone=true;
  var qzS=calcScore(),vtS=vtQs.length?Math.round(vtRight()/vtQs.length*100):0;
  var totalQ=curUnit.qz.length+vtQs.length;
  var comb=Math.round((qzS*curUnit.qz.length+(vtS*vtQs.length))/(totalQ||1));
  var p=S.prog[curUnit.id];
  p.quizDone=1;p.quizBest=Math.max(p.quizBest||0,qzS);p.studied=1;p.last=today();
  p.quizAns=Object.assign({},quizAns);
  p.vtDone=1;p.vtBest=vtS;p.vtAns=Object.assign({},vtAns);
  p.vtQs=vtQs.map(function(q){return {k:q.k,q:q.q,o:q.o.slice(),a:q.a,e:q.e,w:q.w}});
  S.quizLog.push({u:curUnit.id,s:qzS,d:today()});

  curUnit.qz.forEach(function(q,i){

        if(lower.indexOf(v.w.toLowerCase())>=0&&!S.words[v.w])S.words[v.w]={w:v.w,zh:v.zh,u:curUnit.id,box:0,next:today(),wrong:1};
      });

  vtQs.forEach(function(q,i){

    renderSpk({score:r2.score,heard:finalTxt,hit:r2.hit,total:r2.total,html:html});
  };

  var sAvg=spked.length?Math.round(spked.reduce(function(a,u){return a+S.prog[u.id].spkBest},0)/spked.length):0;
  var cover=Math.round(studied.length/us.length*100);
  // 听说读写四维（阅读用真实阅读完成度）
  var allRd=COURSE.reduce(function(a,m){return a+(m.rd?m.rd.length:0)},0);
  var rdDone=allRd?Object.keys(S.read).filter(function(k){return S.read[k]&&S.read[k].done}).length:0;
  var listen=Math.min(100,Math.round(cover*0.5+sAvg*0.5));
  var speaking=sAvg;
  var reading=allRd?Math.round(rdDone/allRd*100):0;
  var writing=Math.min(100,Math.round(qAvg*0.5+cover*0.3+Object.keys(S.words).length*0.5));
  var abil=[['听力',listen],['口语',speaking],['阅读',reading],['表达',writing]];

  var h='<div class="card"><div class="ch"><h2>'+svg(I.target)+'学习效果评估</h2></div>'+
   '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">'+radar(abil)+
   '<div style="flex:1;min-width:180px">'+abil.map(function(a){
     var c=a[1]>=75?'var(--suc)':a[1]>=50?'var(--wrn)':'var(--dan)';
     return '<div class="abil"><span class="an">'+a[0]+'</span><div class="progline"><i style="width:'+a[1]+'%;background:'+c+'"></i></div><span class="av" style="color:'+c+'">'+a[1]+'</span></div>'
   }).join('')+'</div></div>'+
   '<div class="hint" style="margin-top:10px">'+advice(abil,cover)+'</div></div>';

  h+='<div class="grid2" style="margin-bottom:12px">'+
   '<div class="stat"><b>'+studied.length+'<span style="font-size:13px;color:var(--sub);font-weight:600">/'+us.length+'</span></b><span>单元已学</span></div>'+
   '<div class="stat"><b>'+qAvg+'</b><span>测试平均分</span></div>'+
   '<div class="stat"><b>'+sAvg+'</b><span>口语平均分</span></div>'+
   '<div class="stat"><b>'+calcStreak()+'</b><span>连续打卡天</span></div></div>';

  // 成绩趋势
  var logs=S.quizLog.slice(-10);
  if(logs.length>1){
    h+='<div class="card"><div class="ch"><h2>'+svg(I.star)+'测试成绩趋势</h2></div>'+line(logs)+
      '<div class="hint" style="margin-top:6px">最近 '+logs.length+' 次测试，横轴为测试顺序，虚线为 80 分及格线。</div></div>';
  }

  // 错词本
  var t=today(),ws=Object.keys(S.words).map(function(k){return S.words[k]});
  ws.sort(function(a,b){return diffD(b.next,t)-diffD(a.next,t)});
  var dueN=ws.filter(function(w){return diffD(w.next,t)>=0}).length;
  var favN=ws.filter(function(w){return w.fav}).length;
  h+='<div class="card" id="wordsCard"><div class="ch"><h2>'+svg(I.refresh)+'我的词库 · 收藏与复习</h2>'+
     '<span class="pill '+(dueN?'red':'gray')+'">'+dueN+' 个到期复习</span></div>';
  if(!ws.length)h+='<div class="empty">'+svg(I.check,'xl')+'词库是空的。在对话/词汇/长难句里点词即可收藏，或点「标不认识」安排复习。</div>';
  else{
    ws.slice(0,50).forEach(function(w){
      var od=diffD(w.next,t),due=od>=0;
      h+='<div class="wordrow"><span class="box">Box'+(w.box||0)+'</span>'+
        '<div class="wi"><b>'+esc(w.w)+'</b><span>'+esc(w.zh||'')+(w.unk?' · <b style="color:var(--dan)">不认识</b>':'')+(due?(od>0?' · 逾期'+od+'天':' · 今天该复习'):' · '+(-od)+'天后复习')+'</span></div>'+
        '<button class="mini" onclick="speak(this.dataset.x,this)" data-x="'+esc(w.w)+'">'+svg(I.vol,'s')+'</button>';
      if(due)h+='<button class="btn xs suc" onclick="reviewWord(\''+escJs(w.w)+'\',1)">记得</button>'+
               '<button class="btn xs dan" onclick="reviewWord(\''+escJs(w.w)+'\',0)">忘了</button>';
      h+='<button class="mini g" onclick="toggleFav(\''+escJs(w.w)+'\')">✕</button></div>';
      if(w.fav)h+='<textarea class="vnote" placeholder="笔记…（失焦自动保存）" onblur="saveNote(\''+escJs(w.w)+'\',this.value)">'+esc(w.note||'')+'</textarea>';
    });
    h+='<div class="hint" style="margin-top:9px">点词即收藏进词库；「记得/忘了」按 1/2/4/7/15 天艾宾浩斯间隔安排复习，答「忘了」退回 Box0。已收藏 '+favN+' 个词。</div>';
  }
  h+='</div>';

  // 我的划线 · 经典句收藏
  var hlUnits=Object.keys(S.hl||{}).filter(function(u){return S.hl[u]&&S.hl[u].length});
  var hlCount=hlUnits.reduce(function(s,u){return s+S.hl[u].length;},0);
  h+='<div class="card"><div class="ch"><h2>✎ 我的划线</h2>'+
     '<span class="pill '+(hlCount?'blue':'gray')+'">'+hlCount+' 句</span></div>';
  if(!hlCount)h+='<div class="empty">在对话、长难句或阅读里<b>选中</b>想记的词或句子，浮出的「✎ 划线」会把它收进这里（仅作划线笔记，不进收藏）；点「🔍 解析」还能看语法拆解。</div>';
  else{
    hlUnits.forEach(function(uid){
      var um=allUnits().find(function(x){return x.id===uid;});
      h+='<div class="hint" style="margin:7px 0 4px"><b>'+(um?um.t:'')+'</b></div>';
      S.hl[uid].forEach(function(x){
        var tab=(x.cid||'').indexOf('read-')===0?'read':(x.cid||'').indexOf('sen-')===0?'sen':'dlg';
        h+='<div class="hlline" onclick="jumpHl(\''+uid+'\',\''+(x.cid||'')+'\',\''+tab+'\')">'+
          '<b>'+esc(x.sub||'')+'</b>'+(x.zh?('<span class="hlzh">'+esc(x.zh)+'</span>'):'')+(x.sent?('<div class="hlsub">'+esc(x.sent)+'</div>'):'')+'</div>';
      });
    });
  }
  h+='</div>';

  // 数据管理
  h+='<div class="card"><div class="ch"><h2>'+svg(I.down)+'数据备份与管理</h2></div>'+
   '<div class="row" style="margin-bottom:8px"><button class="btn out sm" style="flex:1" onclick="exportJSON()">导出 JSON 备份</button>'+
   '<button class="btn out sm" style="flex:1" onclick="document.getElementById(\'fileIn\').click()">导入恢复</button></div>'+
   '<div class="row"><button class="btn out sm" style="flex:1" onclick="openSheet(\'demo\')">清空示例数据</button>'+
   '<button class="btn dan sm" style="flex:1" onclick="openSheet(\'clear\')">清空全部数据</button></div>'+
   '<div class="hint" style="margin-top:10px">数据全部存在本机浏览器（localStorage），换设备、清缓存、换浏览器都会丢失，请定期导出。导入不限条数。</div></div>';

  h+='<div class="card"><div class="ch"><h2>'+svg(I.book)+'怎么用最有效</h2></div>'+
   '<div class="hint">'+
   '<b>1. 每天一单元，25 分钟：</b>对话精听 2 遍（先 0.6x 后正常）→ 背 8 个词 → 看长难句拆解 → 做 5 题 → 跟读 4 句；模块另配的 2 篇阅读（短文+邮件）可放在周末或碎片时间。<br>'+
   '<b>2. 六级 500 分起步路线：</b>先把各模块的 L1 全过一遍（约 1 周）建立场景语感；再走 L2（约 2 周）；L3 留到最后攻坚。课程库已按 L1→L2→L3 排成学习路径，跟着「继续」标记打即可。<br>'+
   '<b>3. 口语是短板就加倍练：</b>同一句练到 85 分以上再走下一句，别贪多。<br>'+
   '<b>4. 复习优先于新课：</b>「今天要处理」里红色的永远先做；错词本按艾宾浩斯间隔自动提醒。'+
   '</div></div>';

  document.getElementById('v-me').innerHTML=h;
}
function advice(abil,cover){
  var min=abil.slice().sort(function(a,b){return a[1]-b[1]})[0];
  if(cover<15)return '刚起步。建议先按 L1 把六个模块各过一遍，建立场景框架，再谈提分。';
  if(min[1]<50)return '当前最短板是<b>'+min[0]+'（'+min[1]+' 分）</b>。'+(min[0]==='口语'?'口语只能靠开口练——每天在「口语」页固定练 4 句，坚持两周会有明显变化。':min[0]==='听力'?'多用 0.6x 精听功能，先听懂再看文本。':'把长难句解析页反复看，重点是从句语序和被动语态。');
  return '四项发展比较均衡（最低 '+min[0]+' '+min[1]+' 分）。可以开始挑战 L3 高阶单元，并把已学单元的口语分刷到 85+。';
}
function radar(abil){
  var cx=68,cy=68,R=52,n=abil.length,pts=[],grid='';
  for(var g=1;g<=4;g++){
    var gp=[];
    for(var i=0;i<n;i++){
      var a=-Math.PI/2+i*2*Math.PI/n,r=R*g/4;
      gp.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1));
    }
    grid+='<polygon points="'+gp.join(' ')+'" fill="none" stroke="#e6eaf1" stroke-width="1"/>';
  }
  var axes='',labels='';
  for(var i2=0;i2<n;i2++){
    var a2=-Math.PI/2+i2*2*Math.PI/n;
    axes+='<line x1="'+cx+'" y1="'+cy+'" x2="'+(cx+R*Math.cos(a2)).toFixed(1)+'" y2="'+(cy+R*Math.sin(a2)).toFixed(1)+'" stroke="#e6eaf1"/>';
    var lr=R+13;
    labels+='<text x="'+(cx+lr*Math.cos(a2)).toFixed(1)+'" y="'+(cy+lr*Math.sin(a2)+4).toFixed(1)+'" font-size="10.5" fill="#6b7787" text-anchor="middle" font-weight="600">'+abil[i2][0]+'</text>';
    var rr=R*Math.max(4,abil[i2][1])/100;
    pts.push((cx+rr*Math.cos(a2)).toFixed(1)+','+(cy+rr*Math.sin(a2)).toFixed(1));
  }
  return '<svg width="150" height="140" viewBox="0 0 136 136" style="flex:none">'+grid+axes+
   '<polygon points="'+pts.join(' ')+'" fill="rgba(29,78,216,.22)" stroke="#1d4ed8" stroke-width="2" stroke-linejoin="round"/>'+
   pts.map(function(p){var xy=p.split(',');return '<circle cx="'+xy[0]+'" cy="'+xy[1]+'" r="2.8" fill="#1d4ed8"/>'}).join('')+
   labels+'</svg>';
}
function line(logs){
  var W=300,H=110,pl=26,pb=18,pt=8,pr=8;
  var iw=W-pl-pr,ih=H-pt-pb;
  var pts=logs.map(function(l,i){
    var x=pl+(logs.length===1?iw/2:iw*i/(logs.length-1));
    var y=pt+ih*(1-l.s/100);
    return {x:x,y:y,s:l.s};
  });
  var d=pts.map(function(p,i){return (i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)}).join(' ');
  var area=d+' L'+pts[pts.length-1].x.toFixed(1)+' '+(pt+ih)+' L'+pts[0].x.toFixed(1)+' '+(pt+ih)+' Z';
  var y80=pt+ih*0.2;
  var g='';
  [0,50,100].forEach(function(v){
    var y=pt+ih*(1-v/100);
    g+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="#eef1f6"/>'+
       '<text x="'+(pl-5)+'" y="'+(y+3.5)+'" font-size="9" fill="#9aa5b4" text-anchor="end">'+v+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+g+
   '<line x1="'+pl+'" y1="'+y80+'" x2="'+(W-pr)+'" y2="'+y80+'" stroke="#17994f" stroke-dasharray="4 3" stroke-width="1"/>'+
   '<path d="'+area+'" fill="rgba(29,78,216,.1)"/>'+
   '<path d="'+d+'" fill="none" stroke="#1d4ed8" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'+
   pts.map(function(p){return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="3.2" fill="#fff" stroke="#1d4ed8" stroke-width="2"/>'+
     '<text x="'+p.x.toFixed(1)+'" y="'+(p.y-7).toFixed(1)+'" font-size="9" fill="#1d4ed8" text-anchor="middle" font-weight="700">'+p.s+'</text>'}).join('')+
   '</svg>';
}
function reviewWord(w,ok){
  var x=S.words[w];if(!x)return;
  var iv=[1,2,4,7,15];
  if(ok){x.box=Math.min(4,(x.box||0)+1)}else{x.box=0;x.wrong=(x.wrong||0)+1}
  x.next=addD(today(),iv[x.box]);
  if(ok&&x.box>=4){delete S.words[w];toast('“'+w+'”已掌握，移出错词本')}
  else toast(ok?'很好，'+iv[x.box]+' 天后再见':'没关系，明天再来');
  var t=today();S.checkin[t]=(S.checkin[t]||0)+1;
  save();renderMe();
}

/* ---------------- 路由 ---------------- */
var view='today';
function go(v){
  view=v;
  document.querySelectorAll('.view').forEach(function(e){e.classList.toggle('on',e.id==='v-'+v)});
  document.querySelectorAll('#tabbar button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)});
  render();window.scrollTo(0,0);
}
document.getElementById('tabbar').addEventListener('click',function(e){
  var b=e.target.closest('button');if(b)go(b.dataset.v);
});
function render(){
  if(view==='today')renderToday();
  else if(view==='course')renderCourse();
  else if(view==='speak')renderSpeak();
  else renderMe();
  checkBanner();
}
function checkBanner(){
  var n=Object.keys(S.prog).length+Object.keys(S.words).length+S.quizLog.length+S.spkLog.length;
  var b=document.getElementById('banner');
  if(n>=30&&S.lastBackup!==today()){
    document.getElementById('bannerTxt').innerHTML='数据已积累 '+n+' 条记录，建议导出一份备份，换设备就不怕丢了。';
    b.classList.add('on');
  }else b.classList.remove('on');
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(document.getElementById('mask').classList.contains('on'))closeSheet();
    else if(document.getElementById('spkPage').classList.contains('on'))closeSpk();
    else if(document.getElementById('unitPage').classList.contains('on'))closeUnit();
  }
});
if(synth)synth.onvoiceschanged=function(){};
load();
setTimeout(function(){render();},0);
</script>
