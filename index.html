<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1d4ed8">
<title>职场英语学习台 · HR 场景</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
--bg:#f4f6fa;--card:#fff;--pri:#1d4ed8;--pri2:#3b6ef5;--pril:#eef4ff;
--txt:#151b26;--sub:#6b7787;--bd:#e6eaf1;--bd2:#f0f3f8;
--dan:#e5484d;--danl:#fdeeee;--suc:#17994f;--sucl:#eaf7f0;--wrn:#e08600;--wrnl:#fff5e6;
--l1:#17994f;--l2:#e08600;--l3:#7c3aed;--r:14px;--sh:0 1px 3px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.05)}
html,body{max-width:100%;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
background:var(--bg);color:var(--txt);line-height:1.55;-webkit-text-size-adjust:100%;font-size:15px}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;background:none;color:inherit;line-height:1.4}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--txt)}
svg{display:block;flex:none}
.ic{width:18px;height:18px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ic.s{width:15px;height:15px}.ic.l{width:22px;height:22px}.ic.xl{width:26px;height:26px}

/* ---------- layout ---------- */
.topbar{position:sticky;top:0;z-index:60;background:linear-gradient(135deg,#1d4ed8,#3b6ef5);color:#fff;
padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
.topbar h1{font-size:17px;font-weight:700;letter-spacing:.3px;flex:1}
.topbar .sub{font-size:11.5px;opacity:.85;font-weight:400;display:block;margin-top:1px}
.logo{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none}
main{padding:12px 12px 96px;max-width:820px;margin:0 auto}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:110;background:rgba(255,255,255,.96);
backdrop-filter:blur(10px);border-top:1px solid var(--bd);display:flex;
padding-bottom:env(safe-area-inset-bottom)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;
color:var(--sub);font-size:11px;min-height:52px;font-weight:500}
.tabbar button.on{color:var(--pri);font-weight:700}
.tabbar button.on .ic{stroke-width:2.4}

/* ---------- cards ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.card.tight{padding:12px}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:11px}
.ch h2{font-size:15.5px;font-weight:700;flex:1;display:flex;align-items:center;gap:7px}
.ch .act{font-size:13px;color:var(--pri);font-weight:700;min-height:40px;padding:9px 8px;margin:-9px -8px -9px 0;border-radius:9px}
.ch .act:active{background:var(--pril)}
.hint{font-size:12.5px;color:var(--sub);line-height:1.6}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:#fff;
border-radius:11px;padding:11px 16px;font-weight:600;font-size:15px;min-height:44px}
.btn:active{opacity:.82;transform:scale(.985)}
.btn.gh{background:var(--pril);color:var(--pri)}
.btn.out{background:#fff;color:var(--txt);border:1.5px solid var(--bd)}
.btn.dan{background:var(--danl);color:var(--dan)}
.btn.suc{background:var(--suc);color:#fff}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13.5px;border-radius:9px}
.btn.xs{padding:9px 12px;min-height:38px;font-size:12.5px;border-radius:9px;font-weight:600}
.btn.full{width:100%}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px}.row.wrap{flex-wrap:wrap}

/* ---------- backup banner ---------- */
.banner{margin:12px 12px 0;max-width:820px;background:var(--wrnl);border:1px solid #f6dfb4;color:#8a5a00;
border-radius:12px;padding:10px 12px;display:none;align-items:center;gap:9px;font-size:13px}
.banner.on{display:flex}
.banner button{margin-left:auto;color:#8a5a00;font-weight:700;font-size:13px;min-height:40px;padding:8px 12px;
border-radius:9px;background:rgba(255,255,255,.6);flex:none}

/* ---------- today ---------- */
.goalbox{background:linear-gradient(135deg,#1d4ed8,#4f7ef7);color:#fff;border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:0 6px 20px rgba(29,78,216,.22)}
.goalbox .gt{font-size:13px;opacity:.9;display:flex;align-items:center;gap:6px;min-height:40px}
.gedit{color:#fff;font-size:12.5px;font-weight:700;min-height:40px;padding:10px 14px;margin:-4px -6px -4px auto;
border-radius:10px;background:rgba(255,255,255,.18);flex:none}
.goalbox .gn{font-size:17px;font-weight:700;margin:5px 0 12px}
.gstats{display:flex;gap:8px}
.gstat{flex:1;background:rgba(255,255,255,.16);border-radius:11px;padding:9px 6px;text-align:center}
.gstat b{display:block;font-size:20px;font-weight:800;line-height:1.25}
.gstat span{font-size:11px;opacity:.9}
.gbar{height:6px;background:rgba(255,255,255,.25);border-radius:4px;margin-top:11px;overflow:hidden}
.gbar i{display:block;height:100%;background:#fff;border-radius:4px;transition:width .5s}
.gmeta{display:flex;justify-content:space-between;font-size:11.5px;opacity:.9;margin-top:6px}

.task{display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid var(--bd);border-radius:12px;margin-bottom:8px;background:#fff}
.task:last-child{margin-bottom:0}
.task.over{border-color:#f6c9cb;background:var(--danl)}
.task.done{opacity:.5}
.task.done .tt{text-decoration:line-through}
.tick{width:26px;height:26px;border-radius:8px;border:2px solid var(--bd);flex:none;display:grid;place-items:center;margin-top:1px;background:#fff;min-height:26px;position:relative}
/* 视觉 26px，实际点击热区扩到 44px（铁律4） */
button.tick::after{content:'';position:absolute;left:-9px;right:-9px;top:-9px;bottom:-9px}
button.tick:active{border-color:var(--suc)}
.tick.on{background:var(--suc);border-color:var(--suc);color:#fff}
.tinfo{flex:1;min-width:0}
.tt{font-size:14.5px;font-weight:600;line-height:1.4}
.tm{font-size:12px;color:var(--sub);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.task.over .tm{color:var(--dan);font-weight:600}
.tgo{flex:none;align-self:center}
/* 今天要处理：按学习主题（模块）分组 */
.thgroup{margin-top:10px}
.thgroup:first-child{margin-top:2px}
.thhead{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;color:var(--l1);padding:6px 2px;margin-bottom:7px}
.thhead svg{color:var(--l2)}
.thhead .thcnt{margin-left:auto;font-size:11px;font-weight:700;color:var(--sub);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:1px 8px}
.thgroup .task{margin-bottom:7px}
.empty{text-align:center;padding:22px 12px;color:var(--sub);font-size:13.5px}
.empty svg{margin:0 auto 8px;stroke:#c3ccd9}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;line-height:1.6}
.pill.l1{background:var(--sucl);color:var(--l1)}
.pill.l2{background:var(--wrnl);color:var(--l2)}
.pill.l3{background:#f3edff;color:var(--l3)}
.pill.red{background:var(--danl);color:var(--dan)}
.pill.blue{background:var(--pril);color:var(--pri)}
.pill.gray{background:#f0f3f8;color:var(--sub)}

/* streak calendar */
.streak{display:flex;gap:4px;margin-top:10px}
.sd{flex:1;text-align:center}
.sd i{display:block;height:30px;border-radius:8px;background:#f0f3f8;margin-bottom:4px;position:relative}
.sd i.on{background:var(--suc)}
.sd i.half{background:#a8e0c1}
.sd i.today{box-shadow:0 0 0 2px var(--pri) inset}
.sd span{font-size:10.5px;color:var(--sub)}

/* ---------- course ---------- */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;margin-bottom:11px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:20px;background:#fff;border:1px solid var(--bd);font-size:13px;
font-weight:600;color:var(--sub);min-height:40px;white-space:nowrap}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}

.mod{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:11px;overflow:hidden}
.modh{display:flex;align-items:center;gap:11px;padding:13px 14px;flex-wrap:wrap}
.modi{width:38px;height:38px;border-radius:11px;background:var(--pril);color:var(--pri);display:grid;place-items:center;flex:none}
.modt{flex:1;min-width:0}
.modt b{font-size:15px;display:block}
.modt span{font-size:11.5px;color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modp{font-size:12px;color:var(--sub);font-weight:700;flex:none}
.mpill{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:20px;border:none;flex:none;cursor:pointer;white-space:nowrap}
.mpill.start{background:var(--pril);color:var(--pri)}
.mpill.doing{background:#fff3c4;color:#a06a00}
.mpill.end{background:var(--suc);color:#fff}
.revbanner{background:linear-gradient(90deg,#e9f7ee,#d8f0e2);border:1px solid #b6e3c8;color:#1f7a48;border-radius:10px;padding:9px 12px;font-size:13px;font-weight:700;margin-bottom:11px}
.units{border-top:1px solid var(--bd2)}
.unit{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--bd2);width:100%;text-align:left;min-height:56px}
.unit:last-child{border-bottom:none}
.unit:active{background:var(--bd2)}
.ulv{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.ulv.v1{background:var(--l1)}.ulv.v2{background:var(--l2)}.ulv.v3{background:var(--l3)}
.uinfo{flex:1;min-width:0}
.uinfo b{font-size:14.5px;font-weight:600;display:block}
.uinfo span{font-size:11.5px;color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.uscore{font-size:11px;font-weight:700;flex:none;text-align:right;color:var(--sub)}
.uscore b{display:block;font-size:14px;color:var(--suc)}

/* learning path */
.rdlink{display:flex;align-items:center;gap:5px;width:100%;text-align:left;padding:10px 14px;font-size:13px;font-weight:700;color:var(--pri);background:var(--pril);border-top:1px solid var(--bd2)}
.rdlink svg{width:16px;height:16px;flex:none}
.path{padding:8px 14px 14px}
.punit{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 0;min-height:54px;position:relative}
.pdot{width:12px;height:12px;border-radius:50%;flex:none;background:var(--bd);margin-left:6px;z-index:1;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--bd)}
.punit.done .pdot{background:var(--suc);box-shadow:0 0 0 1.5px var(--suc)}
.punit.studied .pdot{background:var(--l1);box-shadow:0 0 0 1.5px var(--l1)}
.punit.next .pdot{background:var(--pri);box-shadow:0 0 0 1.5px var(--pri)}
.punit.next{background:linear-gradient(90deg,var(--pril),transparent 70%);border-radius:10px}
.plv{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;flex:none}
.plv.v1{background:var(--l1)}.plv.v2{background:var(--l2)}.plv.v3{background:var(--l3)}
.pinfo{flex:1;min-width:0}
.pinfo b{font-size:14.5px;font-weight:600;display:block}
.pinfo span{font-size:11.5px;color:var(--sub);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pscore{font-size:11px;font-weight:700;flex:none;text-align:right;color:var(--sub)}
.pscore b{font-size:14px;color:var(--suc)}
.pscore small{font-size:11px}
.pline{height:15px;width:2px;background:var(--bd);margin-left:11px}

/* reading (拓展阅读 tab) */
.reading{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:13px;margin-bottom:12px}
.rhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.rhead b{font-size:15px;flex:1;min-width:120px}
.rbadge{flex:none;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px}
.rbadge.ar{background:var(--pril);color:var(--pri)}
.rbadge.em{background:var(--wrnl);color:var(--l2)}
.pill.suc{background:var(--sucl);color:var(--suc)}
.remail{background:var(--bd2);border-radius:10px;padding:9px 11px;margin-bottom:11px;font-size:12.5px;color:#3d4757;line-height:1.7}
.remail .re{display:flex;gap:8px}
.remail .re span{flex:none;width:30px;color:var(--sub);font-weight:700}
.rbody{font-size:14.5px;line-height:1.85;color:#243042;white-space:pre-line;margin:4px 0 8px;background:#fff;border-radius:10px;box-shadow:var(--sh);padding:12px 13px;letter-spacing:.2px}
.rhint{font-size:12.5px;color:var(--sub);margin:8px 0 4px}
.rq{margin-top:11px;border-top:1px solid var(--bd2);padding-top:11px}
.rqn{font-size:11.5px;color:var(--pri);font-weight:800;margin-bottom:5px}
.rqq{font-size:14px;font-weight:600;line-height:1.6;margin-bottom:9px}

/* ---------- unit page ---------- */
.page{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column}
.page.on{display:flex}
.ph{background:#fff;border-bottom:1px solid var(--bd);padding:calc(env(safe-area-inset-top) + 10px) 12px 0;flex:none}
.ph .pt{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.ph .pt b{flex:1;font-size:15.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:44px;height:44px;border-radius:11px;display:grid;place-items:center;background:var(--bd2);color:var(--txt);flex:none;min-height:44px}
.ptabs{display:flex;gap:2px}
.ptabs button{flex:1;padding:9px 2px 10px;font-size:13.5px;font-weight:600;color:var(--sub);border-bottom:2.5px solid transparent;min-height:42px}
.ptabs button.on{color:var(--pri);border-color:var(--pri)}
.pbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(env(safe-area-inset-bottom) + 66px)}
.ptab{display:none}.ptab.on{display:block}

.scene{background:var(--pril);border-radius:12px;padding:11px 13px;font-size:13px;color:#24457f;margin-bottom:12px;line-height:1.65}
.scene b{display:block;margin-bottom:3px;font-size:12.5px}

.dlg{margin-bottom:9px}
.dspk{font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:3px;padding-left:2px}
.dbub{background:#fff;border-radius:13px;padding:11px 12px;box-shadow:var(--sh);position:relative}
.dlg.b .dbub{background:var(--pril)}
.den{font-size:15px;line-height:1.65;letter-spacing:.1px}
.dzh{font-size:13px;color:var(--sub);margin-top:6px;padding-top:6px;border-top:1px dashed var(--bd);line-height:1.6}
.dzh.hide{display:none}
.dbtns{display:flex;gap:6px;margin-top:8px}
.mini{display:inline-flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;color:var(--pri);
background:var(--pril);padding:9px 12px;border-radius:9px;font-weight:600;min-height:40px;min-width:40px}
.mini.g{background:#f0f3f8;color:var(--sub)}
.mini.playing{background:var(--pri);color:#fff}
.toolbar{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}

/* vocab */
.vc{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:12px;margin-bottom:9px}
.vtop{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.vw{font-size:17px;font-weight:700;letter-spacing:.2px}
.vp{font-size:11.5px;color:var(--l2);background:var(--wrnl);padding:1px 6px;border-radius:5px;font-weight:700}
.vzh{font-size:14px;color:var(--txt);margin-top:5px}
.vex{font-size:13px;color:#3d4757;margin-top:7px;padding:8px 10px;background:var(--bd2);border-radius:9px;line-height:1.6}
.vex i{display:block;color:var(--sub);font-style:normal;font-size:12px;margin-top:3px}
.vacts{display:flex;gap:6px;margin-top:9px}

/* sentence */
.sc{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:13px;margin-bottom:11px}
.sen{font-size:15.5px;line-height:1.7;font-weight:500}
.szh{font-size:13.5px;color:var(--sub);margin-top:7px}
.sparts{margin-top:11px;border-top:1px solid var(--bd2);padding-top:10px}
.sp{display:flex;gap:9px;margin-bottom:8px;font-size:13px;line-height:1.6}
.spt{flex:none;width:62px;font-size:11px;font-weight:700;color:#fff;background:var(--pri2);border-radius:6px;
padding:2px 0;text-align:center;height:fit-content;margin-top:2px}
.spt.g{background:#8b98ab}.spt.o{background:var(--l2)}.spt.p{background:var(--l3)}
.stip{background:var(--sucl);border-radius:9px;padding:9px 11px;font-size:12.5px;color:#0f6b39;line-height:1.65;margin-top:4px}
.stip b{display:block;margin-bottom:2px}

/* 可点词汇 / 划线 / 词汇测验 / 词库笔记 */
.tw{color:var(--pri);font-weight:600;cursor:pointer;border-bottom:1.5px dotted var(--pri);padding:0 1px;border-radius:3px}
.tw.on{background:var(--pril)}
.den.hl,.sen.hl{background:linear-gradient(180deg,#fffbe6,#fff7cc);box-shadow:inset 0 0 0 2px #f4d97a;border-radius:8px;padding:3px 5px;margin:-3px -5px}
.hlbtn{font-size:11.5px;color:var(--sub)}
.hlbtn.on{color:#b8860b;font-weight:800}
.vt{background:#fff;border-radius:12px;box-shadow:var(--sh);padding:13px;margin-bottom:11px}
.vtk{font-size:11px;font-weight:800;color:var(--l2);margin-bottom:4px}
.vnote{width:100%;margin-top:8px;border:1px solid var(--bd);border-radius:8px;padding:7px 9px;font-size:13px;background:var(--bg);color:var(--ink);resize:vertical;min-height:42px;font-family:inherit;box-sizing:border-box}
.hlline{background:linear-gradient(180deg,#fffbe6,#fff7cc);border-left:3px solid #f4d97a;border-radius:8px;padding:9px 11px;font-size:14px;line-height:1.65;margin-bottom:8px;cursor:pointer}
.hlline b{color:#b8860b}
.hlsub{font-size:12px;color:var(--sub);margin-top:3px;line-height:1.5}
/* 自由划线：选中文本后浮出的工具条 */
.hlfloat{position:fixed;z-index:150;background:#b8860b;color:#fff;border-radius:14px;padding:4px;font-size:13px;font-weight:700;box-shadow:0 4px 14px rgba(184,134,11,.45);cursor:default;display:none;align-items:center;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.hlfloat:active{transform:scale(.98)}
.hlf{color:#fff;padding:6px 13px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.hlf:active{background:rgba(0,0,0,.18)}
.hlf-sep{width:1px;height:18px;background:rgba(255,255,255,.45)}
/* 用户自由划线的标记 */
.ufhl{background:linear-gradient(180deg,#fff3b0,#ffe98a);border-radius:3px;box-shadow:inset 0 0 0 1px #f0c93d;padding:0 1px;color:inherit;cursor:pointer}
.ufhl:active{background:linear-gradient(180deg,#ffe07a,#ffd95a)}
/* 划线二次点击的释义气泡 */
.dsheet{background:#fff;border-radius:16px;padding:18px 18px 14px;max-width:300px;width:86%;box-shadow:var(--sh);text-align:center}
.dword{font-size:19px;font-weight:800;color:var(--ink)}
.dzh{font-size:15px;color:var(--sub);margin-top:7px;line-height:1.6}
.dclose{margin-top:14px;font-size:13px;font-weight:700;color:var(--pri);background:var(--pril);border-radius:10px;padding:9px}
/* 划线收藏列表里附带的中文释义 */

.opt{display:flex;gap:9px;align-items:flex-start;width:100%;text-align:left;padding:10px 11px;border:1.5px solid var(--bd);
border-radius:11px;margin-bottom:7px;font-size:14px;line-height:1.55;background:#fff;min-height:44px;overflow-wrap:anywhere}
.opt .ol{flex:none;width:21px;height:21px;border-radius:50%;background:var(--bd2);color:var(--sub);
font-size:11.5px;font-weight:800;display:grid;place-items:center;margin-top:1px}
.opt.sel{border-color:var(--pri);background:var(--pril)}

.opt.ok{border-color:var(--suc);background:var(--sucl)}
.opt.ok .ol{background:var(--suc);color:#fff}
.opt.no{border-color:var(--dan);background:var(--danl)}

.rbig{font-size:44px;font-weight:800;line-height:1.1;color:var(--pri)}
.rbig small{font-size:16px;color:var(--sub);font-weight:600}

.spksent .w.hit{color:var(--suc)}

.micbtn{width:76px;height:76px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;
margin:16px auto 8px;box-shadow:0 6px 22px rgba(29,78,216,.35);min-height:76px}

.progline{flex:1;height:9px;background:var(--bd2);border-radius:5px;overflow:hidden}

.abil .an{width:34px;font-size:13px;font-weight:600;flex:none}
.abil .av{width:36px;text-align:right;font-size:13px;font-weight:700;flex:none}

/* misc form */
.field{margin-bottom:11px}

.field input,.field select{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:11px;
background:#fff;min-height:44px}
.field input:focus,.field select:focus{outline:none;border-color:var(--pri)}
.mask{position:fixed;inset:0;background:rgba(15,22,38,.5);z-index:200;display:none;align-items:flex-end;justify-content:center;padding:0}
.mask.on{display:flex}
.sheet{background:#fff;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);
width:100%;max-width:520px;max-height:86vh;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet h3{font-size:17px;font-weight:700;margin-bottom:4px}
.sheet .sd2{font-size:13px;color:var(--sub);margin-bottom:14px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 78px);transform:translateX(-50%) translateY(14px);
background:rgba(21,27,38,.94);color:#fff;padding:11px 18px;border-radius:12px;font-size:13.5px;z-index:300;
opacity:0;pointer-events:none;transition:.25s;max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.wordrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd2)}
.wordrow:last-child{border:none}
.wordrow .wi{flex:1;min-width:0}
.wordrow .wi b{font-size:14.5px}
.wordrow .wi span{display:block;font-size:12.5px;color:var(--sub)}
.box{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:5px;background:var(--bd2);color:var(--sub);flex:none}

 .mask{align-items:center;padding:20px}
}

{id:'hrp',name:'人力资源规划',en:'HR Planning',
 icon:'<svg class="ic l" viewBox="0 0 24 24"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg>',
 rd:[
  {id:'hrp_r1',kind:'article',title:'Why Workforce Planning Starts with Strategy',
   en:'Workforce planning is not about counting heads — it is about connecting people to business strategy. Before HR proposes any headcount, the first question should be: what outcomes does the business need next year? A sales team entering a new region needs client-facing staff, while a company automating its operations may need fewer generalists and more data analysts. The best HR teams build a simple model: business goal, to required capabilities, to skills gap, to a hiring or reskilling plan. When the plan is tied to clear outcomes, budget talks get easier, because every role is explained in terms of value, not headcount for its own sake.',
   zh:'人力规划不是数人头，而是把人和业务战略连接起来。在 HR 提出任何编制需求之前，第一个问题应该是：明年业务需要达成什么成果？进入新区域的销售团队需要面向客户的员工，而正在推动运营自动化的公司可能减少通用岗、增加数据分析师。最优秀的 HR 团队会搭建一个简单的模型：业务目标 → 所需能力 → 技能差距 → 招聘或再培训计划。当规划与清晰的业务成果挂钩，预算沟通就会更容易，因为每个岗位都是用"价值"而非"编制本身"来解释的。',

  {id:'hrp_r2',kind:'email',title:'Re: Q3 Headcount Request — Sales',

   en:'Hi Karen,\nThanks for the quick turnaround. We are good to approve one additional account manager for Q3, as discussed.\nA few points:\n- Route the req through the ATS by this Friday so onboarding can start in early July.\n- The second role will be revisited after Q3 numbers; I will flag it in the September review.\n- Please share the regional ramp-up plan with Finance so they can model the cost.\nThe clear analysis made the decision straightforward. Best, David',

 ],
 units:[

   {s:'Emma (HRBP)',en:"That makes sense. Could you send me a short note on why the role is needed? I'll put it into the manpower plan.",zh:'有道理。你能发我一份简短说明，讲清楚为什么需要这个岗位吗？我会写进人力规划里。'},
   {s:'David (Manager)',b:1,en:"No problem. When do you need it by?",zh:'没问题。你什么时候要？'},
   {s:'Emma (HRBP)',en:"By this Friday if possible. We're closing the plan next Monday.",zh:'可以的话这周五之前。我们下周一定稿。'},
   {s:'David (Manager)',b:1,en:"Friday works. I should also flag one person who may leave — she's been interviewing outside.",zh:'周五可以。我还得提一个可能会走的人——她一直在外面面试。'},
   {s:'Emma (HRBP)',en:"Thanks for the heads-up. I'll factor that into the attrition number.",zh:'谢谢提醒。我会把这个算进流失率里。'}],
  voc:[
   {w:'headcount',p:'n.',zh:'编制人数、在职人数',ex:'We need approval before we increase headcount.',exzh:'增加编制前我们需要先获批。'},
   {w:'on probation',p:'phr.',zh:'在试用期',ex:'She is still on probation until the end of March.',exzh:'她到三月底之前都还在试用期。'},
   {w:'workload',p:'n.',zh:'工作量',ex:'His workload doubled after the reorganization.',exzh:'重组之后他的工作量翻倍了。'},
   {w:'manpower plan',p:'n.',zh:'人力规划',ex:'The manpower plan is reviewed every quarter.',exzh:'人力规划每季度复核一次。'},
   {w:'attrition',p:'n.',zh:'（自然）流失率',ex:'Our attrition rate dropped to 8% last year.',exzh:'我们去年的流失率降到了 8%。'},
   {w:'flag',p:'v.',zh:'（提前）标记、指出问题',ex:'Please flag any risk early so we can plan ahead.',exzh:'请尽早指出风险，好让我们提前规划。'},
   {w:'heads-up',p:'n.',zh:'提前告知、提醒',ex:'Thanks for the heads-up about the schedule change.',exzh:'谢谢你提前告知日程变动。'},
   {w:'factor in',p:'phr.v.',zh:'把…计入考虑',ex:"We didn't factor in the training cost.",exzh:'我们没有把培训成本计算在内。'}],
  sen:[
   {en:"Could you send me a short note on why the role is needed?",zh:'你能给我发一份简短说明，讲讲为什么需要这个岗位吗？',
    parts:[{t:'礼貌请求',c:'Could you + 动词原形 —— 职场最安全的请求句式，比 Can you 更客气'},{t:'双宾语',c:'send me a short note = send a short note to me（send 后接「人 + 物」）'},{t:'宾语从句',c:'on why the role is needed —— 介词 on 后接 why 从句，作介词宾语'}],
    tip:'从句必须用<b>陈述语序</b>：why the role is needed ✔ ／ why is the role needed ✘。这是中国学习者最高频的错误之一，一说就露怯。'},
   {en:"I should also flag one person who may leave — she's been interviewing outside.",zh:'我还得提一下一个可能会走的人——她一直在外面面试。',
    parts:[{t:'主句',c:'I should also flag one person（should 表「有必要、应该」，语气比 must 缓和）'},{t:'定语从句',c:'who may leave 修饰 one person，who 作从句主语不可省略'},{t:'补充说明',c:'破折号后补充细节，口语中非常自然，相当于「——她其实一直在外面面试」'}],
    tip:'<b>has been interviewing</b> 是现在完成进行时，强调「从过去持续到现在、还在继续」。对比：she interviewed（面试过，已结束）／ she has been interviewing（一直在面，还没停）。'}],
  qz:[
   {q:'"Are you planning to add anyone before June?" 中 add 在此语境下最准确的意思是？',o:['增加预算','增加人手／招人','增加会议','增加业绩指标'],a:1,e:'在 headcount 语境下 add someone = 增加编制/招人，是 HR 高频表达。'},
   {q:'同事说 "Thanks for the heads-up."，他的意思是？',o:['谢谢你抬头看我','谢谢你提前告诉我','谢谢你的建议','谢谢你带头做'],a:1,e:'heads-up 是名词，指「预警、提前告知」，是非常地道的职场用语。'},
   {q:'下列哪句语法正确？',o:['Please tell me why is the role needed.','Please tell me why the role is needed.','Please tell me why need the role.','Please tell me the role why needed.'],a:1,e:'宾语从句必须用陈述语序（主语 + 谓语），不能倒装。'},
   {q:'"We didn\'t factor in the training cost." 最接近的中文是？',o:['我们没有付培训费','我们没把培训成本考虑进去','我们没做培训','我们高估了培训成本'],a:1,e:'factor in = 把…纳入考量/计算。'},
   {q:'想表达「她还在试用期」，最地道的说法是？',o:['She is still in try period.','She is still on probation.','She is still testing.','She is still on trial job.'],a:1,e:'固定搭配 on probation，注意介词是 on 不是 in。'}],
  spk:[0,3,4,8]},

 {id:'hrp2',lv:2,t:'编制申请与人力预算',en:'Headcount Request & Budget',
  scene:'部门经理向 HR 负责人正式提报增编申请，需要给出业务理由、成本测算和替代方案。这是从「日常对话」升级到「有理有据说服人」的关键一步。',
  dlg:[
   {s:'David (Manager)',en:"I'd like to walk you through the business case for two additional headcount in Q3.",zh:'我想跟你详细讲一下第三季度增加两个编制的业务论证。'},
   {s:'Karen (HR Director)',b:1,en:"Go ahead. Before we get into numbers, what's driving the request?",zh:'请讲。在进入数字之前，是什么驱动了这个需求？'},
   {s:'David (Manager)',en:"Our order volume is up 40% year over year, but the team size hasn't changed since last April.",zh:'我们的订单量同比上涨了 40%，但团队规模从去年四月起就没变过。'},
   {s:'Karen (HR Director)',b:1,en:"Have you looked at whether the workload could be absorbed through process improvement or outsourcing?",zh:'你有没有评估过，这些工作量能否通过流程优化或外包来消化？'},
   {s:'David (Manager)',en:"We did. Automation covers about 15% of it, but the rest requires client-facing judgment that we can't outsource.",zh:'我们评估过。自动化能覆盖约 15%，但剩下的需要面向客户的判断力，没法外包。'},
   {s:'Karen (HR Director)',b:1,en:"Fair enough. What's the fully loaded cost per head, including benefits and equipment?",zh:'有道理。每人的全成本是多少，包含福利和设备？'},
   {s:'David (Manager)',en:"Roughly 280K per year per person. Against that, each account manager brings in about 2 million in revenue.",zh:'每人每年大约 28 万。相对地，每个客户经理能带来约 200 万的收入。'},
   {s:'Karen (HR Director)',b:1,en:"That's a solid return. I'd suggest we approve one now and revisit the second one after Q3 results.",zh:'这个回报不错。我建议我们先批一个，等三季度业绩出来再重新评估第二个。'},
   {s:'David (Manager)',en:"I can live with that, as long as we agree on the trigger for the second approval.",zh:'我可以接受，前提是我们对第二个岗位的触发条件达成一致。'}],
  voc:[
   {w:'business case',p:'n.',zh:'业务论证、立项理由',ex:'Build a business case before asking for budget.',exzh:'要预算之前先做好业务论证。'},
   {w:'walk someone through',p:'phr.v.',zh:'带某人逐步了解、详细讲解',ex:'Let me walk you through the process step by step.',exzh:'我来带你一步步过一遍流程。'},
   {w:'year over year (YoY)',p:'phr.',zh:'同比（与去年同期相比）',ex:'Revenue grew 12% year over year.',exzh:'收入同比增长 12%。'},
   {w:'absorb',p:'v.',zh:'消化、吸收（工作量）',ex:'The team absorbed the extra work without complaints.',exzh:'团队消化了额外的工作，没有抱怨。'},
   {w:'fully loaded cost',p:'n.',zh:'全成本（含福利等所有支出）',ex:'The fully loaded cost is 1.4 times the base salary.',exzh:'全成本约为基本工资的 1.4 倍。'},
   {w:'client-facing',p:'adj.',zh:'直接面向客户的',ex:'This is a client-facing role, so communication matters.',exzh:'这是面向客户的岗位，所以沟通很重要。'},
   {w:'revisit',p:'v.',zh:'重新审视、再议',ex:"Let's revisit this topic after the audit.",exzh:'审计之后我们再来讨论这个话题。'},
   {w:'trigger',p:'n.',zh:'触发条件、启动点',ex:'What is the trigger for releasing the second batch?',exzh:'释放第二批的触发条件是什么？'}],
  sen:[
   {en:"Have you looked at whether the workload could be absorbed through process improvement or outsourcing?",zh:'你有没有评估过，这些工作量能否通过流程优化或外包来消化？',
    parts:[{t:'现在完成',c:'Have you looked at… 询问「到目前为止是否做过」，比 Did you look 更关注当下影响'},{t:'宾语从句',c:'whether… 引导，意为「是否」，此处不能替换成 if 后接 or（whether…or 是固定搭配）'},{t:'被动+情态',c:'could be absorbed = 情态动词 could + be + 过去分词，表「有没有可能被消化」'},{t:'方式状语',c:'through A or B —— 通过 A 或 B 的方式'}],
    tip:'职场里<b>被动语态</b>用得极多，因为它把焦点放在「事情」而非「人」，更委婉。对比：Can your team absorb it?（质问你）／ Could the workload be absorbed?（讨论事情）。'},
   {en:"I can live with that, as long as we agree on the trigger for the second approval.",zh:'我可以接受，只要我们对第二个岗位的触发条件达成一致。',
    parts:[{t:'习语',c:'I can live with that = 我能接受（虽然不是最理想，但可以）'},{t:'条件从句',c:'as long as = 只要…（引导条件），从句用一般现在时表将来'},{t:'搭配',c:'agree on + 事情（就某事达成一致）／ agree with + 人（同意某人）'}],
    tip:'<b>as long as 从句里不能用 will</b>：as long as we agree ✔ ／ as long as we will agree ✘。这是「主将从现」规则。'}],
  qz:[
   {q:'"Let me walk you through the numbers." 意思是？',o:['让我带你走过去看数字','让我给你详细讲解这些数字','让我们一起散步聊数字','让我跳过这些数字'],a:1,e:'walk sb through sth = 逐步、详细地为某人讲解。'},
   {q:'"fully loaded cost" 指的是？',o:['满负荷工作的成本','含福利、设备等全部支出的人力总成本','已经付清的成本','超载的成本'],a:1,e:'HR 与财务高频词，指一个员工的总雇佣成本，通常是基本工资的 1.3–1.6 倍。'},
   {q:'选出正确的搭配：我们需要就时间表达成一致。',o:['We need to agree with the timeline.','We need to agree on the timeline.','We need to agree to the timeline person.','We need to agree at the timeline.'],a:1,e:'agree on + 事项；agree with + 人/观点。'},
   {q:'"as long as we ___ on the criteria" 应填？',o:['will agree','agree','agreed','agreeing'],a:1,e:'as long as 引导条件状语从句，主将从现，用一般现在时。'},
   {q:'对方说 "I can live with that."，说明他？',o:['非常满意','勉强能接受','完全反对','需要更多时间'],a:1,e:'表示「可以接受、不至于反对」，是一种有保留的同意。'}],
  spk:[0,3,5,8]},

 {id:'hrp3',lv:3,t:'组织调整与继任计划',en:'Restructuring & Succession',
  scene:'高管层讨论组织架构调整、关键岗位继任梯队与人才盘点九宫格。语速快、抽象名词多、含大量委婉表达，这是 HR 英语的最高难度层级。',
  dlg:[
   {s:'Karen (HR Director)',en:"The restructuring will flatten the org from six layers to four, which means roughly fifteen roles will be redefined.",zh:'这次重组会把组织从六层压缩到四层，也就是说大约十五个岗位会被重新定义。'},
   {s:'Michael (VP)',b:1,en:"Redefined, or eliminated? I'd rather we be straight with people from day one.",zh:'是重新定义，还是被裁撤？我宁愿我们从第一天起就对员工坦诚。'},
   {s:'Karen (HR Director)',en:"Eight will be redefined with expanded scope; four will be redeployed internally; three will unfortunately be redundant.",zh:'八个会重新定义并扩大职责范围；四个会内部转岗；三个很遗憾会被裁撤。'},
   {s:'Michael (VP)',b:1,en:"What does the succession bench look like for the four new director roles?",zh:'那四个新的总监岗位，继任梯队的情况如何？'},
   {s:'Karen (HR Director)',en:"Two are ready now, one is ready in one to two years, and for the fourth we have no internal successor identified.",zh:'两个已经具备就任条件，一个需要一到两年，第四个我们目前没有识别出内部继任者。'},
   {s:'Michael (VP)',b:1,en:"Then we should start an external search in parallel, rather than waiting until the gap becomes urgent.",zh:'那我们应该同步启动外部搜寻，而不是等到缺口变紧急才动手。'},
   {s:'Karen (HR Director)',en:"Agreed. I'd also propose we place the high-potential in a stretch assignment so we can assess readiness objectively.",zh:'同意。我还建议把那位高潜人才放到一个挑战性任务中，这样我们能客观评估其成熟度。'},
   {s:'Michael (VP)',b:1,en:"Make sure that's framed as a development opportunity, not as a probation in disguise.",zh:'务必把它包装成发展机会，而不是变相的考察期。'},
   {s:'Karen (HR Director)',en:"Understood. I'll bring the nine-box talent review to the next leadership meeting for calibration.",zh:'明白。我会把人才盘点九宫格带到下次管理层会议上做校准。'}],
  voc:[
   {w:'flatten the org',p:'phr.',zh:'扁平化组织（减少层级）',ex:'Flattening the org speeds up decision-making.',exzh:'组织扁平化能加快决策速度。'},
   {w:'redeploy',p:'v.',zh:'（内部）重新调配、转岗',ex:'Four staff will be redeployed to the service team.',exzh:'四名员工将被转岗到服务团队。'},
   {w:'redundant',p:'adj.',zh:'（岗位）被裁撤的、冗余的',ex:'Three positions were made redundant last month.',exzh:'上个月有三个岗位被裁撤。'},
   {w:'succession bench',p:'n.',zh:'继任梯队、后备人才库',ex:'Our succession bench for key roles is still thin.',exzh:'我们关键岗位的继任梯队仍然薄弱。'},
   {w:'in parallel',p:'phr.',zh:'并行地、同步地',ex:'We will run both workstreams in parallel.',exzh:'我们会并行推进这两条工作线。'},
   {w:'high-potential (HiPo)',p:'n.',zh:'高潜人才',ex:'She was identified as a high-potential last cycle.',exzh:'她在上一轮盘点中被识别为高潜。'},
   {w:'stretch assignment',p:'n.',zh:'挑战性/拉伸型任务',ex:'A stretch assignment accelerates leadership growth.',exzh:'挑战性任务能加速领导力成长。'},
   {w:'calibration',p:'n.',zh:'（评价）校准、拉通',ex:'Ratings must go through calibration across departments.',exzh:'评级必须经过跨部门校准。'}],
  sen:[
   {en:"The restructuring will flatten the org from six layers to four, which means roughly fifteen roles will be redefined.",zh:'这次重组会把组织从六层压缩到四层，这意味着大约十五个岗位将被重新定义。',
    parts:[{t:'主句',c:'The restructuring will flatten the org —— 抽象名词 restructuring 作主语，是书面/高层口语的典型特征'},{t:'范围状语',c:'from six layers to four —— from A to B 表变化区间'},{t:'非限定',c:'which means… 中 which 指代<b>整个前面这件事</b>，不是某个名词（这是难点）'},{t:'被动',c:'will be redefined —— 将来时被动，回避「谁来定义」，弱化责任主体'}],
    tip:'中国学习者常把 which 误解成指代 four 或 layers。记住：<b>逗号 + which 可以指代整句话</b>，译成「这意味着…」。这个结构在会议里几乎每五分钟出现一次。'},
   {en:"Make sure that's framed as a development opportunity, not as a probation in disguise.",zh:'务必把它包装成发展机会，而不是变相的考察期。',
    parts:[{t:'祈使句',c:'Make sure (that)… —— 用于叮嘱、确认，语气坚定但不失礼'},{t:'被动',c:"that's framed as… —— frame A as B「把 A 定位/包装成 B」，此处用被动"},{t:'否定并列',c:'not as… —— 与前面的 as… 并列，形成「是 A，而不是 B」的对比'},{t:'固定',c:'in disguise = 伪装的、变相的（后置修饰 probation）'}],
    tip:'<b>frame</b> 是英语高层沟通的高价值动词：how you frame it matters（怎么表述很关键）。学会 frame something as… 能瞬间提升表达档次。'}],
  qz:[
   {q:'"Three positions were made redundant." 意思是？',o:['三个岗位重复了','三个岗位被裁撤了','三个岗位很多余没人做','三个岗位被合并了'],a:1,e:'be made redundant 是英式职场对「裁员」的标准委婉说法。'},
   {q:'"…from six layers to four, which means fifteen roles will be redefined." 中 which 指代？',o:['four','six layers','整个前半句所描述的事','fifteen roles'],a:2,e:'逗号 + which 引导非限定性定语从句时，可指代整个主句内容。'},
   {q:'"stretch assignment" 在人才发展中指？',o:['加班任务','超出当前能力边界的挑战性任务','伸展运动','外派任务'],a:1,e:'刻意让高潜承担略超能力的任务，以加速成长并评估潜力。'},
   {q:'"Let\'s run the two projects ___." 表示「并行推进」应填？',o:['in parallel','in line','in turn','in row'],a:0,e:'in parallel = 并行；in turn = 依次轮流。'},
   {q:'"Make sure that\'s framed as a development opportunity." 中 frame 的意思是？',o:['给…装框','把…表述/定位成','冤枉某人','固定住'],a:1,e:'frame A as B = 把 A 表述、定位、包装成 B，是沟通策略类高频动词。'}],
  spk:[0,5,6,7]},
 {id:'hrp4',lv:2,t:'人力成本与编制效能',en:'Cost & Span of Control',
  scene:'HR 向 CFO 解释人力成本结构与编制效能指标（人均产出、管理幅度），用数据支撑增编而非堆人头。',
  dlg:[
   {s:'Tom (CFO)',en:"Before we approve more heads, walk me through the cost structure. What does each new hire actually cost us?",zh:'在批更多人之前，跟我过一下成本结构。每个新人到底要花我们多少？'},
   {s:'Karen (HRD)',b:1,en:"Beyond salary, plan for benefits at about thirty percent, plus recruitment, equipment, and a six-month ramp-up where output is low.",zh:'除了工资，还要准备约 30% 的福利，加上招聘、设备，以及产出偏低的前六个月爬坡期。'},
   {s:'Tom (CFO)',en:"So fully loaded, a hire is roughly one point four times base in year one?",zh:'所以全成本算下来，第一年一个人大概是底薪的 1.4 倍？'},
   {s:'Karen (HRD)',b:1,en:"About that, yes. But look at span of control — managers here average six reports, while peers run ten. We are over-managed, not over-staffed.",zh:'差不多。但看管理幅度——我们这里经理平均管 6 个人，同行能管 10 个。我们是管理层级过多，不是人手过多。'},
   {s:'Tom (CFO)',en:"That's a fair point. If we widen spans, we free budget without cutting delivery.",zh:'说得对。如果拉大管理幅度，就能在不削减交付的前提下腾出预算。'},
   {s:'Karen (HRD)',b:1,en:"Exactly. I'd recommend a ratio target of eight to nine, reviewed each half year against productivity per head.",zh:'正是。我建议把目标定在 8–9，每半年对照人均产出复核一次。'},
   {s:'Tom (CFO)',en:"And how do we measure productivity per head without gaming the number?",zh:'那我们怎么衡量人均产出，又不让人钻空子？'},
   {s:'Karen (HRD)',b:1,en:"Tie it to outcome metrics the business already trusts — revenue per FTE for sales, cycle time for ops — not raw activity.",zh:'把它挂到业务本来就信的产出指标上——销售看人均营收，运营看周期，而不是原始活动量。'},
   {s:'Tom (CFO)',en:"Agreed. Bring me the model and we'll pressure-test it with Finance.",zh:'同意。把模型给我，我们和财务一起做压力测试。'}],
  voc:[
   {w:'cost structure',p:'n.',zh:'成本结构',ex:'Understand the cost structure before pricing.',exzh:'定价前先搞清成本结构。'},
   {w:'fully loaded',p:'adj.',zh:'含全部成本的',ex:'Fully loaded, the role costs 1.4x base.',exzh:'全成本算下来该岗位是底薪的1.4倍。'},
   {w:'span of control',p:'n.',zh:'管理幅度',ex:'A wider span of control reduces layers.',exzh:'更大的管理幅度能减少层级。'},
   {w:'over-managed',p:'adj.',zh:'管理层级过多的',ex:'We are over-managed, not over-staffed.',exzh:'我们是管理层级过多，不是人手过多。'},
   {w:'ramp-up',p:'n.',zh:'爬坡/上手期',ex:'The ramp-up period lasts about six months.',exzh:'上手期大约六个月。'},
   {w:'productivity per head',p:'n.',zh:'人均产出',ex:'Track productivity per head by outcome.',exzh:'用人均产出（按结果）衡量。'},
   {w:'ratio target',p:'n.',zh:'比例目标',ex:'Set a span-of-control ratio target.',exzh:'设定管理幅度比例目标。'},
   {w:'FTE',p:'n.',zh:'全职等效人力',ex:'Revenue per FTE is a clean metric.',exzh:'人均营收是个干净的指标。'}],
  sen:[
   {en:"We are over-managed, not over-staffed.",zh:'我们是管理层级过多，不是人手过多。',
    parts:[{t:'对照结构',c:'A, not B —— 用否定后项突出真正问题，是澄清误判的高频结构'},{t:'复合形容词',c:'over-managed / over-staffed 由 over- + 过去分词构成，表「过度…的」'},{t:'语境',c:'此处点明成本高的根因在层级而非人头，为改革铺垫'}],
    tip:'<b>over-</b> 前缀：over-managed（管理层级冗余）、over-staffed（人手过多）、over-budget（超预算）。区分二者是 HR 诊断基本功。'},
   {en:"Bring me the model and we'll pressure-test it with Finance.",zh:'把模型给我，我们和财务一起做压力测试。',
    parts:[{t:'祈使开头',c:'Bring me the model —— 直接下达动作，会议收尾常用'},{t:'并列句',c:'and 连接两个动作：给模型 + 做压力测试'},{t:'复合动词',c:'pressure-test = 压力测试，名词作动词，商务英语常见'}],
    tip:'<b>pressure-test</b> 是咨询/财务高频词，指用极端情形检验方案是否经得起推敲。类似：stress-test（银行更常用）。'}],
  qz:[
   {q:'A new hire in year one costs roughly?',o:['Equal to base salary','1.4x base with benefits and ramp-up','Half of base','Unknown'],a:1,e:'含福利约30%及爬坡期，约底薪1.4倍。'},
   {q:'Karen says the real problem is?',o:['Too few staff','Over-management / narrow spans','Low salary','Bad hires'],a:1,e:'管理幅度仅6，同行10，是层级过多。'},
   {q:'"span of control" means?',o:['Total headcount','Direct reports a manager has','Office size','Budget'],a:1,e:'管理幅度 = 直接下属数量。'},
   {q:'To avoid gaming productivity, Karen ties it to?',o:['Raw activity counts','Outcome metrics the business trusts','Hours worked','Number of meetings'],a:1,e:'挂到业务信任的产出指标，而非原始活动量。'},
   {q:'"pressure-test" the model means?',o:['Print it','Test it under tough scenarios with Finance','Delete it','Approve it'],a:1,e:'用严苛情形检验方案稳健性。'}],
  spk:[0,3,5,8]}
]},
{id:'rec',name:'招聘与配置',en:'Recruitment & Staffing',
 icon:'<svg class="ic l" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>',
 rd:[
  {id:'rec_r1',kind:'article',title:'Structured Interviewing Beats Gut Feel',
   en:'Hiring on instinct is often unfair and inaccurate. Structured interviewing fixes this by asking every candidate the same job-related questions, scored against a shared rubric. Research shows it predicts on-the-job performance far better than unstructured chats. A good loop also separates the ask from the score: the interviewer takes notes during the talk, then rates each skill right after, before a strong first impression causes bias. Finally, diverse panels reduce groupthink. The goal is not to trick candidates but to give every applicant a fair, comparable shot at the role.',
   zh:'凭直觉招人往往既不公平也不准确。结构化面试通过向每位候选人提出相同的岗位相关问题、并依据统一的评分标准打分来纠正这一点。研究表明，它预测在岗表现的效果远好于非结构化闲聊。好的面试流程还会把"提问"和"打分"分开：面试官在交谈时记录，随后在强烈的先入印象造成偏见之前立即为每项能力评分。最后，多元的面试官小组能减少群体思维。目标不是为难候选人，而是给每位应聘者一个公平、可比较的争取岗位的机会。',
   voc:[{w:'instinct',p:'n.',zh:'直觉'},{w:'structured interviewing',p:'n.',zh:'结构化面试'},{w:'rubric',p:'n.',zh:'评分标准、量规'},{w:'on-the-job',p:'adj.',zh:'在岗的'},{w:'bias',p:'n.',zh:'偏见'},{w:'groupthink',p:'n.',zh:'群体思维'}],
   q:[{q:'What is the main advantage of structured interviewing?',o:['It is faster','It predicts performance better and is fairer','It impresses candidates','It needs no prep'],a:1,e:'结构化面试用统一问题和评分标准，预测效度更高且更公平。'},
      {q:'Why score right after the interview?',o:['To finish early','To avoid bias from first impressions','System requires it','To share with candidates'],a:1,e:'在首因效应造成的偏见形成前打分，减少偏差。'}]},
  {id:'rec_r2',kind:'email',title:'Your Interview Schedule — HR Generalist',
   head:{to:'candidate.li@email.com',from:'talent@acme.com',subject:'Your interview schedule for the HR Generalist role'},
   en:'Dear Li,\nThank you for your interest in the HR Generalist position. We would like to invite you to a three-round interview next week:\n- Round 1 (Mon 10:00): recruiter screen, 30 min\n- Round 2 (Wed 14:00): hiring manager, 45 min\n- Round 3 (Fri 11:00): panel with the HR team, 60 min\nAll sessions are virtual. Please confirm your availability and share an updated CV. Let us know if you need any accessibility adjustment.\nWe look forward to speaking with you. Best, Acme Talent Acquisition',
   zh:'尊敬的 Li，\n感谢你对 HR 通用岗的兴趣。我们诚邀你参加下周的共三轮面试：\n- 第一轮（周一 10:00）：招聘筛选，30 分钟\n- 第二轮（周三 14:00）：用人经理，45 分钟\n- 第三轮（周五 11:00）：HR 团队小组面试，60 分钟\n全部为线上。请确认你的可参加时间，并发送更新后的简历。如需任何无障碍便利，请告知我们。\n期待与你交流。祝好，Acme 人才招聘部',
   voc:[{w:'three-round',p:'adj.',zh:'三轮的'},{w:'recruiter screen',p:'n.',zh:'招聘筛选（初筛）'},{w:'hiring manager',p:'n.',zh:'用人经理'},{w:'panel',p:'n.',zh:'小组面试（考官组）'},{w:'virtual',p:'adj.',zh:'线上的、虚拟的'},{w:'accessibility',p:'n.',zh:'无障碍（便利）'}],
   q:[{q:'How many interview rounds are there?',o:['One','Two','Three','Four'],a:2,e:'Round 1/2/3 三轮。'},
      {q:'Where will the interviews take place?',o:['At the office only','Virtually / online','By phone only','In a hotel'],a:1,e:'All sessions are virtual。'}]}
 ],
 units:[
 {id:'rec1',lv:1,t:'电话初筛与约面试',en:'Phone Screening',
  scene:'HR 给候选人打电话做初步筛选：确认求职意向、目前状态、期望薪资，然后约面试时间。这是最容易「照着说」的一段，句型固定，先把它练成条件反射。',
  dlg:[
   {s:'Recruiter',en:"Hi, is this Mr. Chen? This is Amy calling from Nova Tech. Is now a good time to talk?",zh:'您好，是陈先生吗？我是 Nova Tech 的 Amy。现在方便讲话吗？'},
   {s:'Candidate',b:1,en:"Yes, speaking. Now works fine.",zh:'是我，现在方便。'},
   {s:'Recruiter',en:"Great. We received your application for the Data Analyst role. I'd like to ask a few quick questions, about ten minutes.",zh:'太好了。我们收到了您应聘数据分析师岗位的申请。我想问几个简短的问题，大约十分钟。'},
   {s:'Candidate',b:1,en:"Sure, go ahead.",zh:'好的，您请说。'},
   {s:'Recruiter',en:"Could you walk me through your current role and what you're looking for in your next move?",zh:'您能介绍一下目前的工作，以及您希望下一份工作是什么样的吗？'},
   {s:'Candidate',b:1,en:"I've been with my current company for three years, mainly handling sales reporting. I'm looking for a role with more exposure to business decisions.",zh:'我在现在的公司待了三年，主要负责销售报表。我希望找一个能更多接触业务决策的岗位。'},
   {s:'Recruiter',en:"Understood. May I ask about your current package and your expectation?",zh:'明白。方便问一下您目前的薪酬和期望吗？'},
   {s:'Candidate',b:1,en:"My current package is around 300K annually. I'd expect somewhere between 350K and 400K, but I'm open to discussion.",zh:'我目前年薪大约 30 万。期望在 35 万到 40 万之间，不过可以谈。'},
   {s:'Recruiter',en:"That's within our range. Would you be available for an onsite interview next Wednesday afternoon?",zh:'这在我们的范围内。您下周三下午方便来现场面试吗？'},
   {s:'Candidate',b:1,en:"Wednesday afternoon works. Could you send me the details by email?",zh:'周三下午可以。您能把详细信息邮件发给我吗？'}],
  voc:[
   {w:'Is now a good time?',p:'phr.',zh:'现在方便说话吗？',ex:'Is now a good time, or should I call back later?',exzh:'现在方便吗，还是我稍后再打？'},
   {w:'application',p:'n.',zh:'申请、投递',ex:'We received over 200 applications for this role.',exzh:'这个岗位我们收到了 200 多份申请。'},
   {w:'walk me through',p:'phr.',zh:'详细说说、带我了解一下',ex:'Walk me through a typical day in your current job.',exzh:'讲讲你现在工作中典型的一天是怎样的。'},
   {w:'next move',p:'n.',zh:'下一步职业选择',ex:'What are you looking for in your next move?',exzh:'你希望下一份工作能带来什么？'},
   {w:'exposure to',p:'n.',zh:'接触（某领域的）机会',ex:'I want more exposure to international projects.',exzh:'我想有更多接触国际项目的机会。'},
   {w:'package',p:'n.',zh:'薪酬包（含工资奖金福利）',ex:'The package includes base, bonus and stock.',exzh:'薪酬包包含基本工资、奖金和股票。'},
   {w:'open to discussion',p:'phr.',zh:'可以商量、有谈的余地',ex:"The start date is open to discussion.",exzh:'入职时间可以商量。'},
   {w:'onsite interview',p:'n.',zh:'现场面试',ex:'The onsite interview will take about two hours.',exzh:'现场面试大约需要两小时。'}],
  sen:[
   {en:"Could you walk me through your current role and what you're looking for in your next move?",zh:'您能介绍一下目前的工作，以及您希望下一份工作是什么样的吗？',
    parts:[{t:'礼貌请求',c:'Could you walk me through… —— 比 Tell me about 更专业、更显尊重'},{t:'并列宾语',c:'your current role <b>and</b> what you\'re looking for —— 名词短语与从句并列，都作 through 的宾语'},{t:'名词从句',c:'what you\'re looking for = 你在找的东西（what 作 for 的宾语，从句用陈述语序）'}],
    tip:'很多人会说成 <b>what are you looking for</b>（错，那是疑问句）。嵌在句子里就必须变成 what you are looking for。这是听起来「地不地道」的分水岭。'},
   {en:"I've been with my current company for three years, mainly handling sales reporting.",zh:'我在现在的公司待了三年，主要负责销售报表。',
    parts:[{t:'现在完成',c:"I've been with… for three years —— 「至今已经三年，现在还在」，不能用 I was with"},{t:'搭配',c:'be with + 公司 = 在某公司任职（比 work in 更自然）'},{t:'现在分词',c:'mainly handling… 作伴随状语，等于 and I mainly handle…，让句子更紧凑'}],
    tip:'时态错误是自我介绍中最刺耳的错：<b>I work here for 3 years ✘ / I have worked here for 3 years ✔</b>。凡是「持续到现在」，一律用现在完成（进行）时。'}],
  qz:[
   {q:'电话开头 "Is now a good time to talk?" 的功能是？',o:['确认对方身份','询问对方此刻是否方便通话','问现在几点','确认时间安排'],a:1,e:'职场电话礼貌开场白，直接问「现在方便吗」。'},
   {q:'"What are you looking for in your next move?" 中 next move 指？',o:['下一步棋','下次搬家','下一份职业选择','下个动作'],a:2,e:'move 在职业语境中指职业变动，next move = 下一份工作/下一步发展。'},
   {q:'嵌入句中正确的说法是？',o:['Tell me what are you looking for.','Tell me what you are looking for.','Tell me what do you look for.','Tell me you are looking what.'],a:1,e:'名词性从句用陈述语序，不倒装、不加助动词。'},
   {q:'"I\'ve been with my current company for three years." 说明？',o:['他三年前离职了','他现在仍在这家公司','他要待满三年','他换过三家公司'],a:1,e:'现在完成时强调从过去持续到现在且仍在继续。'},
   {q:'"My expectation is 400K, but I\'m open to discussion." 传达的态度是？',o:['坚决不让步','有谈判空间','拒绝谈薪','已经接受了'],a:1,e:'open to discussion 是谈薪时保留余地的标准表达。'}],
  spk:[0,4,7,9]},

 {id:'rec2',lv:2,t:'行为面试与候选人评估',en:'Behavioral Interview',
  scene:'用 STAR 法则追问候选人的真实经历，并在面试后与用人经理对齐评估结论。这一级要求你能听懂追问、也能追问别人。',
  dlg:[
   {s:'Interviewer',en:"Tell me about a time when you had to deliver a project under a very tight deadline.",zh:'请讲一次你必须在非常紧的期限内交付项目的经历。'},
   {s:'Candidate',b:1,en:"Last October, our client moved the launch date up by three weeks, which left us with almost no buffer.",zh:'去年十月，客户把上线日期提前了三周，几乎没给我们留任何缓冲。'},
   {s:'Interviewer',en:"What specifically was your responsibility in that situation?",zh:'在那种情况下，具体哪部分是你负责的？'},
   {s:'Candidate',b:1,en:"I owned the data pipeline. I re-prioritized the backlog and cut two nice-to-have features so we could protect the core flow.",zh:'我负责数据管道。我重新排了需求优先级，砍掉两个非必要功能，以保住核心流程。'},
   {s:'Interviewer',en:"How did you get buy-in from the stakeholders for cutting those features?",zh:'你是怎么让相关方接受砍掉这些功能的？'},
   {s:'Candidate',b:1,en:"I showed them the trade-off in numbers — keeping them would have pushed the launch back by ten days.",zh:'我用数字展示了取舍——保留它们会让上线推迟十天。'},
   {s:'Interviewer',en:"And what was the outcome?",zh:'结果如何？'},
   {s:'Candidate',b:1,en:"We shipped on time with zero critical bugs, and the two features went out in the following release.",zh:'我们按时交付，零严重缺陷，那两个功能在下个版本上线了。'},
   {s:'Interviewer',en:"Looking back, is there anything you would do differently?",zh:'回过头看，有什么你会换个做法的吗？'},
   {s:'Candidate',b:1,en:"I'd escalate the resource gap earlier instead of trying to absorb it within the team.",zh:'我会更早把资源缺口上报，而不是试图在团队内部消化。'}],
  voc:[
   {w:'tight deadline',p:'n.',zh:'紧迫的截止期限',ex:'We are working against a tight deadline.',exzh:'我们在赶一个很紧的期限。'},
   {w:'move up',p:'phr.v.',zh:'提前（日期）',ex:'The client moved up the launch by two weeks.',exzh:'客户把上线提前了两周。'},
   {w:'own',p:'v.',zh:'负责、主导（某事）',ex:'Who owns this deliverable?',exzh:'这个交付物由谁负责？'},
   {w:'backlog',p:'n.',zh:'待办事项池、积压需求',ex:'We groom the backlog every sprint.',exzh:'我们每个迭代都会梳理需求池。'},
   {w:'nice-to-have',p:'adj./n.',zh:'锦上添花的（非必需）',ex:'That is a nice-to-have, not a must-have.',exzh:'那是加分项，不是必须项。'},
   {w:'buy-in',p:'n.',zh:'认同、支持',ex:'We need buy-in from finance before we proceed.',exzh:'推进之前我们需要财务的认可。'},
   {w:'trade-off',p:'n.',zh:'权衡、取舍',ex:'Every decision involves a trade-off.',exzh:'每个决定都涉及取舍。'},
   {w:'escalate',p:'v.',zh:'上报、升级（问题）',ex:'Escalate the issue if it is not resolved in 24 hours.',exzh:'如果 24 小时内没解决就上报。'}],
  sen:[
   {en:"Last October, our client moved the launch date up by three weeks, which left us with almost no buffer.",zh:'去年十月，客户把上线日期提前了三周，这让我们几乎没有任何缓冲。',
    parts:[{t:'时间状语',c:'Last October 置于句首，STAR 回答里先交代 Situation'},{t:'主句',c:'moved the launch date up by three weeks —— move up 中间可插入宾语；by + 时间量表「提前/延后的幅度」'},{t:'非限定',c:'which left us with… —— which 指代「客户提前三周」这整件事'},{t:'搭配',c:'leave sb with sth = 使某人处于…的状态'}],
    tip:'注意区分 <b>by</b> 和 <b>to</b>：moved it up <b>by</b> three weeks（提前了三周，幅度）／ moved it up <b>to</b> March 1（提前到 3 月 1 日，终点）。用错会让对方完全听错日期。'},
   {en:"I'd escalate the resource gap earlier instead of trying to absorb it within the team.",zh:'我会更早把资源缺口上报，而不是试图在团队内部消化。',
    parts:[{t:'虚拟语气',c:"I'd (= I would) escalate —— 对「如果重来」的假设性回答，不能用 I will"},{t:'比较级',c:'earlier 作状语，暗含 than I actually did（比我当时更早）'},{t:'介词短语',c:'instead of + 动名词 trying —— instead of 后必须接 -ing 或名词'}],
    tip:'面试官问 "Is there anything you would do differently?" 时，<b>必须用 would + 动词原形</b>回答。答成 I will… 会显得你没听懂这是个假设句。'}],
  qz:[
   {q:'"Who owns this deliverable?" 中 own 的意思是？',o:['拥有所有权','负责、主导','购买','承认'],a:1,e:'职场里 own something = 对某事负全责、是第一责任人。'},
   {q:'"We need buy-in from the leadership team." 意思是？',o:['需要领导层出钱','需要领导层的认可与支持','需要领导层买单吃饭','需要领导层签合同'],a:1,e:'buy-in = 心理上的接受与支持，不是花钱。'},
   {q:'"The client moved the launch up by two weeks." 表示？',o:['推迟两周','提前两周','延长两周','取消两周'],a:1,e:'move up = 提前；by + 时长表示变动幅度。'},
   {q:'"Is there anything you would do differently?" 正确的回答开头是？',o:['I will escalate it earlier.','I would escalate it earlier.','I escalate it earlier.','I am escalating it earlier.'],a:1,e:'假设性问题需用 would + 动词原形回答。'},
   {q:'"instead of ___ it within the team" 应填？',o:['absorb','to absorb','absorbing','absorbed'],a:2,e:'instead of 是介词短语，后接动名词。'}],
  spk:[0,3,5,9]},

 {id:'rec3',lv:3,t:'Offer 谈判与背景调查',en:'Offer Negotiation & Reference Check',
  scene:'候选人对 offer 提出异议，HR 在预算刚性约束下寻找灵活空间；同时进行背景调查。这是最考验措辞分寸感的场景——既要守住底线，又不能把人谈跑。',
  dlg:[
   {s:'Candidate',en:"I appreciate the offer, but the base is about eight percent below what I had in mind. Is there any flexibility?",zh:'我很感谢这个 offer，但基本工资比我预期的低约 8%。有调整空间吗？'},
   {s:'HR',b:1,en:"I hear you. Let me be transparent: the base is benchmarked against our internal band, so I have limited room there.",zh:'我理解。我坦白说：基本工资是对标我们内部薪酬带宽的，所以那部分我空间有限。'},
   {s:'Candidate',en:"I understand there are constraints. Could we look at the total package rather than base alone?",zh:'我理解有限制。我们能不能看整体薪酬包，而不只是基本工资？'},
   {s:'HR',b:1,en:"That's exactly where I was heading. I could push for a sign-on bonus to bridge the gap in your first year.",zh:'我正想说这个。我可以争取一笔签约奖金，来弥补你第一年的差额。'},
   {s:'Candidate',en:"A sign-on helps, though it's one-off. Would an accelerated review at six months be on the table?",zh:'签约奖金有帮助，不过是一次性的。六个月做一次提前调薪评估，有可能吗？'},
   {s:'HR',b:1,en:"I can commit to a six-month performance review, but I can't guarantee the outcome — that would depend on your rating.",zh:'我可以承诺六个月做一次绩效评估，但我不能保证结果——那取决于你的评级。'},
   {s:'Candidate',en:"That's fair. Let me think it over and get back to you by Thursday.",zh:'这很合理。让我考虑一下，周四之前答复您。'},
   {s:'HR',b:1,en:"Take your time. Meanwhile, would you be comfortable if we started the reference check with your previous manager?",zh:'不着急。同时，我们可以开始联系您上一任经理做背景调查吗，您方便吗？'},
   {s:'Candidate',en:"Please hold off on my current employer until I've formally resigned.",zh:'请在我正式离职之前，先不要联系我现在的雇主。'}],
  voc:[
   {w:'flexibility',p:'n.',zh:'弹性、调整空间',ex:'Is there any flexibility on the start date?',exzh:'入职日期有调整空间吗？'},
   {w:'benchmark against',p:'v.',zh:'对标、以…为基准',ex:'Salaries are benchmarked against the market median.',exzh:'薪资以市场中位数为基准。'},
   {w:'salary band',p:'n.',zh:'薪酬带宽/职级薪资区间',ex:'This role sits in band 4.',exzh:'这个岗位处于第 4 薪酬带。'},
   {w:'sign-on bonus',p:'n.',zh:'签约奖金',ex:'A sign-on bonus is usually paid once.',exzh:'签约奖金通常一次性支付。'},
   {w:'one-off',p:'adj.',zh:'一次性的',ex:'This is a one-off payment, not recurring.',exzh:'这是一次性支付，不会重复发生。'},
   {w:'on the table',p:'phr.',zh:'可以商议的、在考虑范围内',ex:'Remote work is not on the table for this role.',exzh:'这个岗位不考虑远程办公。'},
   {w:'reference check',p:'n.',zh:'背景调查（联系推荐人）',ex:'We conduct a reference check before the final offer.',exzh:'最终发 offer 前我们会做背景调查。'},
   {w:'hold off on',p:'phr.v.',zh:'暂缓、先别做',ex:'Please hold off on the announcement until Monday.',exzh:'请把公告推迟到周一。'}],
  sen:[
   {en:"Let me be transparent: the base is benchmarked against our internal band, so I have limited room there.",zh:'我坦白讲：基本工资是对标我们内部薪酬带宽的，所以那部分我空间有限。',
    parts:[{t:'铺垫句',c:'Let me be transparent / honest with you —— 谈判中「亮底牌」的软化开场，降低对抗感'},{t:'被动',c:'is benchmarked against… —— 把限制归于「制度」而非「我」，避免个人对立'},{t:'结果',c:'so I have limited room —— room 在此为不可数名词，指「余地」，不加 a'}],
    tip:'谈判高手会把「我不同意」转译成「制度不允许」。<b>被动语态 + 制度性主语</b>是英文职场化解冲突的核心技巧，值得整句背下来。'},
   {en:"I can commit to a six-month performance review, but I can't guarantee the outcome — that would depend on your rating.",zh:'我可以承诺六个月做一次绩效评估，但不能保证结果——那取决于你的评级。',
    parts:[{t:'让步结构',c:'I can commit to A, but I can\'t guarantee B —— 「能给什么 / 不能给什么」一次说清，是可信度的来源'},{t:'搭配',c:'commit to + 名词/动名词（承诺做某事）；注意不是 commit to do'},{t:'虚拟',c:'that would depend on… —— would 表示「（如果真发生的话）会取决于」，比 depends 更留有余地'}],
    tip:'常见错误：<b>commit to do it ✘ / commit to doing it ✔</b>。同类还有 look forward to doing、be used to doing——to 是介词不是不定式符号。'}],
  qz:[
   {q:'"Is remote work on the table?" 意思是？',o:['远程办公在桌子上','远程办公可以商量吗','远程办公被否决了','远程办公需要审批'],a:1,e:'on the table = 在可讨论/可考虑的范围内。'},
   {q:'"Salaries are benchmarked against the market." 意思是？',o:['工资被市场淘汰','工资以市场水平为基准','工资高于市场','工资被冻结'],a:1,e:'benchmark against = 以…为对标基准。'},
   {q:'"Please hold off on the announcement." 是让对方？',o:['坚持公告','暂缓公告','抓紧公告','取消公告'],a:1,e:'hold off on = 暂缓、先别做（不是永久取消）。'},
   {q:'"I can commit to ___ the review in six months." 应填？',o:['do','doing','done','did'],a:1,e:'commit to 的 to 是介词，后接动名词。'},
   {q:'HR 说 "I have limited room there."，真实含义是？',o:['办公室空间不够','那部分几乎没有让步余地','需要更多房间','愿意大幅加薪'],a:1,e:'room 指谈判余地，limited room 是委婉的「基本谈不动」。'}],
  spk:[0,1,4,5]},
 {id:'rec4',lv:2,t:'面试反馈与婉拒',en:'Feedback & Rejection',
  scene:'招聘向落选候选人发送礼貌、专业、带具体反馈的拒信，并把评估同步给用人经理。',
  dlg:[
   {s:'Recruiter',en:"Hi Mark, thanks again for interviewing for the account manager role last week.",zh:'嗨 Mark，再次感谢你上周来面客户经理岗位。'},
   {s:'Mark',b:1,en:"Of course — I enjoyed the conversations. Any update?",zh:'当然，我聊得很开心。有消息吗？'},
   {s:'Recruiter',en:"We've made an offer to another candidate whose experience mapped more closely to the role's first-year priorities.",zh:'我们已经向另一位经验与该岗位首年重点更贴合的候选人发了 offer。'},
   {s:'Mark',b:1,en:"I see. Is there anything I could have done differently?",zh:'我明白了。有没有什么是我可以做得不一样的？'},
   {s:'Recruiter',en:"Your story-telling was strong. If anything, sharpen the data behind your results — quantify the impact you drove.",zh:'你的叙事很强。如果要说，就是把成果背后的数据打磨得更硬——把你的影响量化出来。'},
   {s:'Mark',b:1,en:"That's fair feedback, thank you. I'll keep that in mind.",zh:'这个反馈很中肯，谢谢。我会记在心里。'},
   {s:'Recruiter',en:"We'll keep your profile on file for future fits. Would it be okay to stay in touch?",zh:'我们会把你的资料留档，留意更匹配的将来机会。方便保持联系吗？'},
   {s:'Mark',b:1,en:"Absolutely — please do. I'm still very interested in the team.",zh:'当然，麻烦了。我对这个团队还是很有兴趣。'}],
  voc:[
   {w:'make an offer',p:'phr.',zh:'发录用意向',ex:'We made an offer to the top candidate.',exzh:'我们给最合适的人发了 offer。'},
   {w:'map to',p:'phr.v.',zh:'与…契合',ex:'Her background maps to our priorities.',exzh:'她的背景和我们的重点契合。'},
   {w:'first-year priorities',p:'n.',zh:'首年重点',ex:"The role's first-year priorities are clear.",exzh:'这个岗位首年的重点很清晰。'},
   {w:'story-telling',p:'n.',zh:'叙事能力',ex:'Strong story-telling wins interviews.',exzh:'出色的叙事能力能赢得面试。'},
   {w:'quantify',p:'v.',zh:'量化',ex:'Quantify the impact you drove.',exzh:'把你带来的影响量化出来。'},
   {w:'keep on file',p:'phr.',zh:'留档',ex:'We will keep your profile on file.',exzh:'我们会把你的资料留档。'},
   {w:'fit',p:'n.',zh:'匹配度',ex:'A strong culture fit matters.',exzh:'文化匹配度很重要。'},
   {w:'stay in touch',p:'phr.',zh:'保持联系',ex:'Let us stay in touch for future roles.',exzh:'为将来的机会咱们保持联系。'}],
  sen:[
   {en:"We've made an offer to another candidate whose experience mapped more closely to the role's first-year priorities.",zh:'我们已经向另一位经验与该岗位首年重点更贴合的候选人发了 offer。',
    parts:[{t:'主句',c:'We have made an offer to… 现在完成时，强调对现在的影响（名额已定）'},{t:'定语从句',c:'whose experience… 修饰 candidate，whose 指「候选人的」'},{t:'谓语',c:'mapped more closely to… = 与…更贴合'},{t:'名词短语',c:"the role's first-year priorities = 该岗位首年的优先事项"}],
    tip:'拒绝时<b>给原因但不给希望错觉</b>：用 mapped more closely to… 客观说明差距，比「你很优秀但我们选了别人」更专业、更少争议。'},
   {en:"If anything, sharpen the data behind your results — quantify the impact you drove.",zh:'如果要说，就是把成果背后的数据打磨得更硬——把你的影响量化出来。',
    parts:[{t:'让步',c:'If anything = 如果要挑不足的话，语气委婉'},{t:'祈使',c:'sharpen the data = 把数据磨利'},{t:'破折号',c:'quantify the impact you drove = 量化你驱动的影响，you drove 是省略 that 的定语从句'}],
    tip:'<b>If anything</b> 是给负面反馈时的缓冲词，相当于「要说不足的话」。配合具体动作（quantify）而非笼统批评，候选人更容易接受。'}],
  qz:[
   {q:'The recruiter rejected Mark because?',o:['He was late','Another candidate fit the role priorities better','He lacked a degree','Budget was cut'],a:1,e:'用 mapped more closely to first-year priorities 客观说明。'},
   {q:'"mapped more closely to" means?',o:['Closer in distance','More aligned with','On the map','Earlier'],a:1,e:'map to = 与…对应/契合。'},
   {q:'The recruiter suggested Mark should?',o:['Speak less','Quantify his impact with data','Apply again','Change career'],a:1,e:'把成果数据量化。'},
   {q:'"keep your profile on file" means?',o:['Delete it','Save it for future roles','Publish it','Forget it'],a:1,e:'留档以备将来匹配机会。'},
   {q:'"If anything" softens feedback by meaning?',o:['Definitely','If there is a weakness, it is…','Never','Always'],a:1,e:'If anything = 要说不足的话，委婉引出。'}],
  spk:[0,2,4,7]},
 {id:'rec5',lv:2,t:'Offer 发放与入职沟通',en:'Offer & Onboarding Talk',
  scene:'招聘向候选人宣读 offer 要点，并沟通入职前流程（背景调查、材料、报到时间、试用期）。',
  dlg:[
   {s:'Recruiter',en:"Great news — we'd like to offer you the HR Generalist role, starting August 4.",zh:'好消息——我们想录用你做 HR 专员，8 月 4 号入职。'},
   {s:'Candidate',b:1,en:"That's wonderful, thank you! Can you walk me through the package?",zh:'太好了，谢谢！你能帮我过一下薪酬包吗？'},
   {s:'Recruiter',en:"Base is 16K a month, plus a 13th-month bonus and standard benefits. The offer is contingent on a clean background check.",zh:'月薪 16K，外加第 13 薪和标准福利。这个 offer 以背景调查合格为前提。'},
   {s:'Candidate',b:1,en:"Understood. What documents do I need to prepare before day one?",zh:'明白。报到前我需要准备哪些材料？'},
   {s:'Recruiter',en:"Your ID, degree certificate, last company's proof of employment, and a health check from an approved clinic.",zh:'身份证、学历证、上家公司的在职证明，以及指定体检机构的体检报告。'},

   {s:'Candidate',b:1,en:"Perfect. I'll review the written offer and get back to you by Friday.",zh:'完美。我会看书面 offer，周五前回复你。'}],
  voc:[
   {w:'offer',p:'n.',zh:'录用意向',ex:'We are pleased to offer you the role.',exzh:'我们很高兴录用你。'},
   {w:'13th-month bonus',p:'n.',zh:'第 13 薪',ex:'The 13th-month bonus is paid in January.',exzh:'第 13 薪在一月发放。'},
   {w:'contingent on',p:'phr.',zh:'以…为前提',ex:'The offer is contingent on a background check.',exzh:'offer 以背调合格为前提。'},
   {w:'background check',p:'n.',zh:'背景调查',ex:'A clean background check is required.',exzh:'需要合格（干净）的背景调查。'},
   {w:'proof of employment',p:'n.',zh:'在职证明',ex:"Provide your last employer's proof of employment.",exzh:'提供上家的在职证明。'},
   {w:'probation period',p:'n.',zh:'试用期',ex:'The probation period is two months.',exzh:'试用期两个月。'},
   {w:'onboard',p:'v.',zh:'使入职',ex:'We help new hires onboard fast.',exzh:'我们帮新人快速入职。'},
   {w:'get back to',p:'phr.',zh:'回复',ex:"I'll get back to you by Friday.",exzh:'我周五前回复你。'}],
  sen:[
   {en:"The offer is contingent on a clean background check.",zh:'这个 offer 以背景调查合格为前提。',
    parts:[{t:'主系表',c:'The offer is contingent on… = offer 取决于…'},{t:'介词短语',c:'contingent on = 以…为条件（ contingent 后固定接 on）'},{t:'定语',c:'a clean background check = 合格的无犯罪与履历核查'}],
    tip:'<b>contingent on</b> 是录用与合同英语的核心词：contingent on approval / on references / on medical clearance。发口头 offer 时一定要带上它。'},

    tip:'<b>reach out</b> 是职场最常用「主动联系」，比 contact 更亲切；<b>onboard</b> 由名词转作动词「入职」，新人体验设计里高频。'}],

{id:'trn',name:'培训与开发',en:'Training & Development',
 icon:'<svg class="ic l" viewBox="0 0 24 24"><path d="M22 10 12 5 2 10l10 5 10-5Z"/><path d="M6 12v5c0 1.7 2.7 3 6 3s6-1.3 6-3v-5"/></svg>',
 rd:[
  {id:'trn_r1',kind:'article',title:'The 70-20-10 Rule of Learning',
   en:'Most professional learning does not happen in a classroom. The 70-20-10 model says we learn roughly 70% from challenging work, 20% from feedback and coaching by others, and only 10% from formal training. For HR, this changes program design. Instead of a full day of slides, a smart plan pairs a short workshop with a stretch assignment and a monthly check-in with a mentor. The stretch assignment is where real growth occurs — doing something slightly beyond current ability, with support. Measure not how many attended? but what changed in how people work?',
   zh:'大部分职场学习并不发生在课堂里。70-20-10 模型认为，我们大约 70% 的学习来自有挑战的工作，20% 来自他人的反馈与辅导，只有 10% 来自正式培训。对 HR 而言，这改变了项目设计。与其搞一整天的幻灯片，聪明的方案是把一次简短工作坊、一项拉伸性任务，以及每月一次与导师的复盘结合起来。真正的成长发生在拉伸性任务上——在支持下做略超当前能力的事。衡量标准不是有多少人参加，而是人们的工作方式发生了什么改变。',
   voc:[{w:'70-20-10 model',p:'n.',zh:'70-20-10 学习模型'},{w:'coaching',p:'n.',zh:'辅导、教练'},{w:'stretch assignment',p:'n.',zh:'拉伸性任务（略超能力的任务）'},{w:'check-in',p:'n.',zh:'复盘、碰头会'},{w:'mentor',p:'n.',zh:'导师'},{w:'formal training',p:'n.',zh:'正式培训'}],
   q:[{q:'According to 70-20-10, where does most learning come from?',o:['Formal courses','Real work challenges','Reading books','Watching videos'],a:1,e:'70% 来自具有挑战性的工作实际。'},
      {q:'A "stretch assignment" means?',o:['An easy task','A task slightly beyond current ability','A vacation','A written test'],a:1,e:'拉伸性任务 = 略超当前能力的任务，在支持下完成。'}]},
  {id:'trn_r2',kind:'email',title:'Invitation: New Manager Essentials',
   head:{to:'team@acme.com',from:'ld@acme.com',subject:'Invitation: New Manager Essentials — starts May 12'},
   en:'Hi team,\nWe are launching a four-week New Manager Essentials program for anyone who moved into a people-leadership role in the last six months.\nFormat: one 90-minute live workshop every Tuesday, plus a peer coaching circle every other week. Topics include giving feedback, running one-on-ones, and handling underperformance.\nPlease register by May 5 via the LMS. Protect this time in your calendar — we will not record sessions, as discussion is confidential.\nQuestions? Reply to this email. L&D Team',
   zh:'各位好，\n我们为新走上人员管理岗位不到半年的同事，推出为期四周的"新经理必修课"项目。\n形式：每周二一场 90 分钟直播工作坊，外加隔周一次的同侪辅导圈。主题包括给予反馈、开展一对一沟通，以及处理绩效不佳。\n请于 5 月 5 日前通过 LMS 报名。请在日历中留出这段时间——课程不录像，因为讨论内容保密。\n有问题？直接回复本邮件。L&D 团队',
   voc:[{w:'essentials',p:'n.',zh:'必修课、要点'},{w:'peer coaching',p:'n.',zh:'同侪辅导'},{w:'one-on-ones',p:'n.',zh:'一对一沟通'},{w:'underperformance',p:'n.',zh:'绩效不佳'},{w:'LMS',p:'n.',zh:'学习管理系统'},{w:'confidential',p:'adj.',zh:'保密的'}],
   q:[{q:'Who is the program for?',o:['All employees','New people managers in the last 6 months','External candidates','Retirees'],a:1,e:'面向近半年内新走上管理岗位的人。'},
      {q:'Why are sessions not recorded?',o:['No budget','Discussion is confidential','Technical issue','Low interest'],a:1,e:'讨论内容保密，不录像。'}]}
 ],
 units:[
 {id:'trn1',lv:1,t:'新员工入职引导',en:'Onboarding Orientation',
  scene:'HR 带新同事熟悉公司：介绍流程、系统账号、导师制度和试用期安排。全是短句和常用指令，是你「敢开口」的最佳起点。',
  dlg:[
   {s:'HR',en:"Welcome aboard! Let me show you around and get you set up.",zh:'欢迎加入！我带你转一圈，把该配置的都弄好。'},
   {s:'New Hire',b:1,en:"Thank you. Where should I start?",zh:'谢谢。我该从哪开始？'},
   {s:'HR',en:"First, IT will set up your laptop and email account. It usually takes about an hour.",zh:'首先，IT 会给你配电脑和邮箱账号，通常要一个小时左右。'},
   {s:'New Hire',b:1,en:"Got it. Do I need to sign anything today?",zh:'明白。我今天需要签什么文件吗？'},
   {s:'HR',en:"Yes, the employment contract and the confidentiality agreement. Please read them carefully before signing.",zh:'是的，劳动合同和保密协议。签之前请仔细阅读。'},
   {s:'New Hire',b:1,en:"Sure. Who should I go to if I have questions about the system?",zh:'好的。如果我对系统有疑问，该找谁？'},
   {s:'HR',en:"You'll be assigned a buddy — that's David from your team. He'll help you settle in during your first month.",zh:'我们会给你安排一位「伙伴」——是你团队的 David。他会在第一个月帮你适应。'},
   {s:'New Hire',b:1,en:"That's helpful. And when is my probation review?",zh:'那很有帮助。我的试用期评估是什么时候？'},
   {s:'HR',en:"Your probation lasts three months, with a check-in at the end of month one and a formal review at month three.",zh:'你的试用期是三个月，第一个月末有一次沟通，第三个月做正式评估。'},
   {s:'New Hire',b:1,en:"Understood. Thanks for walking me through everything.",zh:'明白了。谢谢您给我详细介绍这一切。'}],
  voc:[
   {w:'Welcome aboard',p:'phr.',zh:'欢迎加入（团队）',ex:'Welcome aboard — we are glad to have you.',exzh:'欢迎加入——很高兴你能来。'},
   {w:'show someone around',p:'phr.v.',zh:'带某人参观熟悉环境',ex:'Let me show you around the office.',exzh:'我带你参观一下办公室。'},
   {w:'set up',p:'phr.v.',zh:'配置、开通、搭建',ex:'IT will set up your account today.',exzh:'IT 今天会给你开通账号。'},
   {w:'confidentiality agreement',p:'n.',zh:'保密协议（NDA）',ex:'Everyone signs a confidentiality agreement on day one.',exzh:'每个人入职第一天都要签保密协议。'},
   {w:'buddy',p:'n.',zh:'入职伙伴/带教搭档',ex:'Your buddy will answer your day-to-day questions.',exzh:'你的入职伙伴会解答你日常的问题。'},
   {w:'settle in',p:'phr.v.',zh:'适应新环境',ex:'It takes a few weeks to settle in.',exzh:'适应新环境需要几周时间。'},
   {w:'probation review',p:'n.',zh:'试用期评估',ex:'Your probation review is scheduled for June 30.',exzh:'你的试用期评估定在 6 月 30 日。'},
   {w:'check-in',p:'n.',zh:'（进度）沟通、碰头',ex:"Let's have a quick check-in every Friday.",exzh:'我们每周五做一次简短沟通吧。'}],
  sen:[
   {en:"You'll be assigned a buddy — that's David from your team.",zh:'我们会给你安排一位入职伙伴——是你团队的 David。',
    parts:[{t:'被动',c:"You'll be assigned a buddy = We'll assign you a buddy。双宾动词变被动时，人作主语更自然"},{t:'破折号',c:'—— 用于口语补充说明，等于「也就是」'},{t:'后置定语',c:'from your team 修饰 David，介词短语后置'}],
    tip:"assign 的两种用法都要会：assign <b>sb</b> sth / assign sth <b>to</b> sb。被动时中国学习者常说成 A buddy will be assigned to you（也对，但没有 You'll be assigned… 自然）。"},
   {en:"Who should I go to if I have questions about the system?",zh:'如果我对系统有疑问，该找谁？',
    parts:[{t:'疑问句',c:'Who should I go to —— go to sb 表「找某人（求助）」，介词 to 留在句尾'},{t:'条件句',c:'if I have questions —— 「主将从现」：主句用 should，从句用一般现在时'},{t:'搭配',c:'have questions <b>about</b> sth（对…有疑问）'}],
    tip:'口语里介词<b>结尾</b>完全正确且更自然：Who should I go to? ✔ 比 To whom should I go? 亲切得多，后者过于书面。'}],
  qz:[
   {q:'"Welcome aboard!" 用在什么场合？',o:['上船时','欢迎新同事加入','送别同事','登机时'],a:1,e:'源自航海，现广泛用于欢迎新成员加入组织。'},
   {q:'"It takes a few weeks to settle in." 中 settle in 意思是？',o:['结账','安顿并适应下来','坐下','定居国外'],a:1,e:'settle in = 适应新环境、进入状态。'},
   {q:'"Who should I go to if I ___ questions?" 应填？',o:['will have','have','had','having'],a:1,e:'if 引导条件状语从句，主将从现，用一般现在时。'},
   {q:'"You will be assigned a buddy." 中 buddy 指？',o:['朋友聚会','入职带教搭档','客户','上级领导'],a:1,e:'buddy system 是常见的入职陪伴机制，由老员工带新员工。'},
   {q:'表示「带你参观办公室」，最地道的是？',o:['Let me look you the office.','Let me show you around the office.','Let me visit you the office.','Let me watch the office with you.'],a:1,e:'show sb around (a place) 是固定表达。'}],
