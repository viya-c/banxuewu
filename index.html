 {id:'trn2',lv:2,t:'培训需求调研与课程设计',en:'Training Needs Analysis',
  scene:'HR 与业务部门讨论培训需求：定位能力短板、设计课程形式、评估投入产出。开始出现抽象概念和数据表达。',
  dlg:[
   {s:'L&D Manager',en:"Based on the skills assessment, the biggest gap in your team is data storytelling rather than technical skills.",zh:'根据技能评估，你团队最大的短板是数据表达能力，而不是技术能力。'},
   {s:'Dept Head',b:1,en:"That matches what I see. They can pull the numbers, but they struggle to make a recommendation.",zh:'和我观察到的一致。他们能把数拉出来，但很难给出建议。'},
   {s:'L&D Manager',en:"Then a one-off lecture won't move the needle. I'd propose a blended program: two half-day workshops plus four weeks of practice with feedback.",zh:'那么一次性讲座起不了什么作用。我建议做混合式项目：两个半天的工作坊，加四周带反馈的练习。'},
   {s:'Dept Head',b:1,en:"How much time would that take away from their day jobs?",zh:'这会占用他们多少本职工作时间？'},
   {s:'L&D Manager',en:"Roughly eight hours of classroom time and two hours a week of practice, spread over six weeks.",zh:'大约八小时课堂时间，加每周两小时练习，分摊在六周内。'},
   {s:'Dept Head',b:1,en:"That's manageable. How will we know whether it actually works?",zh:'这个可以承受。我们怎么知道它真的有效？'},
   {s:'L&D Manager',en:"We'll measure at three levels: reaction right after the class, skill demonstration in a live presentation, and manager-rated improvement after eight weeks.",zh:'我们会从三个层面衡量：课后即时反馈、在真实汇报中的技能展示、以及八周后由主管评分的改进情况。'},
   {s:'Dept Head',b:1,en:"I like that the last one is tied to real work rather than a survey.",zh:'我喜欢最后一项是跟真实工作挂钩的，而不是一份问卷。'},
   {s:'L&D Manager',en:"Exactly. Surveys tell us if people enjoyed it; behavior change tells us if it paid off.",zh:'正是。问卷只能说明大家喜不喜欢；行为改变才说明这钱花得值不值。'}],
  voc:[
   {w:'skills gap',p:'n.',zh:'技能差距、能力短板',ex:'We identified a clear skills gap in negotiation.',exzh:'我们发现谈判方面有明显的能力短板。'},
   {w:'move the needle',p:'phr.',zh:'产生实质性影响',ex:'Small tweaks will not move the needle.',exzh:'小修小补起不到实质作用。'},
   {w:'blended learning',p:'n.',zh:'混合式学习（线上+线下）',ex:'Blended learning improves retention.',exzh:'混合式学习能提升知识留存。'},
   {w:'day job',p:'n.',zh:'本职工作',ex:'Training should not disrupt their day jobs.',exzh:'培训不应打乱他们的本职工作。'},
   {w:'manageable',p:'adj.',zh:'可承受的、可控的',ex:'The workload is manageable this month.',exzh:'这个月的工作量是可承受的。'},
   {w:'spread over',p:'phr.v.',zh:'分摊于（一段时间）',ex:'The cost is spread over three years.',exzh:'成本分摊在三年内。'},
   {w:'tied to',p:'adj.',zh:'与…挂钩的',ex:'The bonus is tied to team performance.',exzh:'奖金与团队绩效挂钩。'},
   {w:'pay off',p:'phr.v.',zh:'产生回报、见效',ex:'The investment in training paid off.',exzh:'在培训上的投入见到了回报。'}],
  sen:[
   {en:"We'll measure at three levels: reaction right after the class, skill demonstration in a live presentation, and manager-rated improvement after eight weeks.",zh:'我们会从三个层面衡量：课后即时反馈、真实汇报中的技能展示、以及八周后主管评分的改进情况。',
    parts:[{t:'主干',c:"We'll measure at three levels —— 冒号后是对 three levels 的展开"},{t:'三项并列',c:'A, B, <b>and</b> C —— 三个名词短语结构对称，这是英文列举的黄金规则'},{t:'复合形容词',c:'manager-rated = 由主管评定的（名词 + 过去分词构成形容词，连字符不能省）'},{t:'时间状语',c:'right after / in / after —— 三个介词精准定位不同时点'}],
    tip:'<b>平行结构（parallelism）</b>是英文表达是否「专业」的核心指标。列举时三项词性必须一致：都是名词短语，或都是动词短语，不能混。'},
   {en:"Surveys tell us if people enjoyed it; behavior change tells us if it paid off.",zh:'问卷只能告诉我们大家喜不喜欢；行为改变才告诉我们这是否见效。',
    parts:[{t:'对照结构',c:'A tells us X; B tells us Y —— 分号连接两个结构相同的独立句，形成鲜明对比'},{t:'宾语从句',c:'if = whether（是否），引导 tell 的宾语从句，从句用陈述语序'},{t:'时态',c:'enjoyed / paid off 用过去式，指培训已经发生'}],
    tip:'<b>分号（;）</b>用于连接两个关系紧密的完整句子，比句号更紧凑、比逗号更正确。写邮件时用对分号，专业度立刻不一样。'}],
  qz:[
   {q:'"That won\'t move the needle." 意思是？',o:['那不会动指针','那起不到实质作用','那会引起变动','那需要调整仪表'],a:1,e:'move the needle = 带来可见的、实质性的改变。'},
   {q:'"The bonus is tied to team performance." 意思是？',o:['奖金被绑住了','奖金与团队绩效挂钩','奖金被取消','奖金平均分配'],a:1,e:'be tied to = 与…挂钩、取决于。'},
   {q:'哪句符合平行结构？',o:['We measured reaction, demonstrating skills, and improvement.','We measured reaction, skill demonstration, and improvement.','We measured to react, skill, and improved.','We measured reaction, skills demonstrate, improvement.'],a:1,e:'并列的三项应为同类结构（此处均为名词短语）。'},
   {q:'"The cost is spread over three years." 意思是？',o:['成本涨了三年','成本分摊到三年','成本在三年后产生','成本超支三年'],a:1,e:'spread over = 分摊/分布在某段时间内。'},
   {q:'"The investment paid off." 说明？',o:['投资付了款','投资得到了回报','投资打水漂了','投资推迟了'],a:1,e:'pay off = 见效、获得回报。'}],
  spk:[0,2,6,8]},

 {id:'trn3',lv:3,t:'领导力发展与培训 ROI',en:'Leadership Development & ROI',
  scene:'向 CEO 汇报领导力项目的成效与投资回报，需要抵御质疑、用数据说话、承认局限。这是最接近「用英语做汇报」的实战。',
  dlg:[
   {s:'HR Director',en:"Over the past twelve months, we've put twenty-four mid-level managers through the leadership accelerator.",zh:'过去十二个月，我们让二十四位中层管理者参加了领导力加速项目。'},
   {s:'CEO',b:1,en:"What have we got to show for it, beyond completion rates?",zh:'除了完课率，我们有什么实实在在的成果？'},
   {s:'HR Director',en:"Three things. Voluntary turnover in their teams dropped from fourteen to nine percent; internal promotion rate doubled; and engagement scores rose by eleven points.",zh:'三点。他们团队的主动离职率从 14% 降到 9%；内部晋升率翻倍；敬业度得分提高了 11 分。'},
   {s:'CEO',b:1,en:"How confident are you that the program caused those changes, rather than just correlating with them?",zh:'你有多大把握认为是项目导致了这些变化，而不只是相关性？'},
   {s:'HR Director',en:"Fair challenge. We compared them against a matched control group that didn't attend, and the gap held even after adjusting for department and tenure.",zh:'这个质疑很合理。我们和一个未参加的匹配对照组做了比较，在控制部门和司龄之后，差距依然存在。'},
   {s:'CEO',b:1,en:"And the cost per participant?",zh:'那每人的成本呢？'},
   {s:'HR Director',en:"Eighteen thousand, against an estimated saving of sixty thousand per avoided resignation. Even on conservative assumptions, we break even after four retained employees.",zh:'一万八，而每避免一次离职估计可节省六万。即便按保守假设，只要留住四个人就能回本。'},
   {s:'CEO',b:1,en:"That's a case I can take to the board. What would you do differently next cycle?",zh:'这个论据我可以拿去董事会。下一轮你会做哪些改变？'},
   {s:'HR Director',en:"I'd tighten the selection criteria. A few participants were nominated for recognition rather than readiness, and their outcomes dragged the average down.",zh:'我会收紧遴选标准。有几位是被当作「认可奖励」提名的，而不是因为具备发展条件，他们的结果拉低了平均值。'}],
  voc:[
   {w:'accelerator (program)',p:'n.',zh:'加速（发展）项目',ex:'She joined the leadership accelerator last year.',exzh:'她去年参加了领导力加速项目。'},
   {w:'voluntary turnover',p:'n.',zh:'主动离职率',ex:'Voluntary turnover is a key retention metric.',exzh:'主动离职率是关键的留存指标。'},
   {w:'correlate with',p:'v.',zh:'与…相关（未必是因果）',ex:'Higher pay correlates with lower turnover.',exzh:'更高的薪酬与更低的离职率相关。'},
   {w:'control group',p:'n.',zh:'对照组',ex:'We used a control group to isolate the effect.',exzh:'我们用对照组来分离出真实效果。'},
   {w:'tenure',p:'n.',zh:'司龄、在职年限',ex:'Average tenure in the team is 4.2 years.',exzh:'团队平均司龄为 4.2 年。'},
   {w:'break even',p:'phr.v.',zh:'收支平衡、回本',ex:'The project breaks even in month seven.',exzh:'该项目在第七个月回本。'},
   {w:'conservative assumption',p:'n.',zh:'保守假设',ex:'Even on conservative assumptions, the ROI is positive.',exzh:'即使按保守假设，投资回报仍为正。'},
   {w:'drag down',p:'phr.v.',zh:'拉低、拖累',ex:'Two weak quarters dragged down the annual figure.',exzh:'两个疲软的季度拉低了全年数字。'}],
  sen:[
   {en:"How confident are you that the program caused those changes, rather than just correlating with them?",zh:'你有多大把握认为是这个项目导致了那些变化，而不只是与之相关？',
    parts:[{t:'疑问结构',c:'How confident are you that… —— How + 形容词 + be 动词 + 主语 + that 从句'},{t:'同位从句',c:'that the program caused… 说明 confident 的内容（对什么有把握）'},{t:'对比',c:'rather than just correlating —— rather than 后与前面的 caused 呼应，用 -ing 保持结构对称'}],
    tip:'<b>caused vs. correlated</b> 是数据汇报的核心区分：因果 vs 相关。被这样追问时，正确应对是承认质疑（Fair challenge.）+ 拿出对照组证据，而不是硬辩。'},
   {en:"A few participants were nominated for recognition rather than readiness, and their outcomes dragged the average down.",zh:'有几位参与者是出于「表彰」而非「具备发展条件」被提名的，他们的结果拉低了平均值。',
    parts:[{t:'被动',c:'were nominated for… —— 不点名谁提名的，弱化指责'},{t:'对比',c:'for recognition rather than readiness —— 两个抽象名词对举，简洁有力'},{t:'并列句',c:'and their outcomes dragged the average down —— 短语动词 drag down 中间可插宾语'}],
    tip:'英文高阶表达偏爱<b>抽象名词对举</b>：recognition vs. readiness、effort vs. impact、activity vs. outcome。掌握几组这样的对子，汇报立刻有分量。'}],
  qz:[
   {q:'"Higher pay correlates with lower turnover." 严格来说说明？',o:['高薪导致低离职','两者存在统计相关，未必因果','高薪与离职无关','离职导致高薪'],a:1,e:'correlate with 只表明相关性，因果需另加证据（如对照组）。'},
   {q:'"We break even after four retained employees." 意思是？',o:['我们打破了四个记录','留住四个人就能收回成本','四个人离职了','我们平分给四个人'],a:1,e:'break even = 收支平衡、回本。'},
   {q:'"Average tenure is 4.2 years." 中 tenure 指？',o:['租期','司龄/在职年限','终身教职','忍耐'],a:1,e:'HR 语境中 tenure = 员工在公司的服务年限。'},
   {q:'"nominated for recognition rather than readiness" 的对比是？',o:['为了表彰 vs 为了发展准备度','为了认可 vs 为了阅读','为了名声 vs 为了金钱','为了升职 vs 为了加薪'],a:0,e:'recognition（奖励性提名）vs readiness（具备发展条件），是人才盘点的常见误区。'},
   {q:'"Two weak quarters dragged down the annual figure." 中 drag down 意思是？',o:['拖走','拉低、拖累','下载','延后'],a:1,e:'drag down = 使数值/表现下降。'}],
  spk:[2,4,6,8]},
 {id:'trn4',lv:2,t:'培训效果评估',en:'Kirkpatrick Evaluation',
  scene:'L&D 向业务负责人汇报培训评估框架，说明不只看满意度，还要看行为改变与业务结果。',
  dlg:[
   {s:'L&D',en:"For the sales training, we shouldn't stop at 'smiles sheets' — how happy people felt.",zh:'这次销售培训，我们不能停在「笑容表」——大家感不高兴。'},
   {s:'Manager',b:1,en:"Agreed. What else should we measure?",zh:'同意。我们还该衡量什么？'},
   {s:'L&D',en:"Level two: did they actually learn? We test knowledge before and after.",zh:'第二层：他们真的学到了吗？我们做训前训后知识测试。'},
   {s:'Manager',b:1,en:"And level three?",zh:'那第三层呢？'},
   {s:'L&D',en:"Behavior — are they using it on the job three months later? We sample manager observations.",zh:'行为层——三个月后他们在岗位上用上了吗？我们抽样经理的观察。'},
   {s:'Manager',b:1,en:"That's the hard part. What about results?",zh:'那是最难的。结果层呢？'},
   {s:'L&D',en:"Level four ties to business: conversion rate, ramp time. We isolate training's effect from other factors.",zh:'第四层挂到业务：转化率、上手时间。我们把培训效果和其他因素拆开看。'},
   {s:'Manager',b:1,en:"Good. Let's report all four levels in the debrief, not just satisfaction.",zh:'好。复盘时我们报全部四层，不只满意度。'}],
  voc:[
   {w:'smiles sheet',p:'n.',zh:'满意度问卷（笑容表）',ex:"Don't rely only on smiles sheets.",exzh:'别只靠满意度问卷。'},
   {w:'level',p:'n.',zh:'层级',ex:'We measure at four levels.',exzh:'我们分四层衡量。'},
   {w:'knowledge test',p:'n.',zh:'知识测试',ex:'Run a knowledge test pre and post.',exzh:'做训前训后知识测试。'},
   {w:'behavior',p:'n.',zh:'行为改变',ex:'Did behavior change on the job?',exzh:'岗位上的行为变了吗？'},
   {w:'sample',p:'v.',zh:'抽样',ex:'We sample manager observations.',exzh:'我们抽样经理观察。'},
   {w:'conversion rate',p:'n.',zh:'转化率',ex:'Training lifted conversion rate.',exzh:'培训提升了转化率。'},
   {w:'isolate',p:'v.',zh:'剥离/区分',ex:"Isolate training from other factors.",exzh:'把培训与其他因素区分开。'},
   {w:'debrief',p:'n./v.',zh:'复盘/汇报',ex:'We will debrief next week.',exzh:'我们下周复盘。'}],
  sen:[
   {en:"We shouldn't stop at 'smiles sheets' — how happy people felt.",zh:'我们不能停在「笑容表」——大家感不高兴。',
    parts:[{t:'否定',c:"shouldn't stop at… = 不该止步于…"},{t:'借代',c:'smiles sheets = 满意度问卷（学员笑着填的表）'},{t:'破折号',c:'how happy people felt 解释 smiles sheets 是什么'}],
    tip:'<b>smiles sheet</b>（亦称 happy sheet）是培训圈对满意度问卷的自嘲说法。专家级表达会明确「satisfaction ≠ learning」。'},
   {en:"We isolate training's effect from other factors.",zh:'我们把培训的影响和其他因素区分开。',
    parts:[{t:'主谓宾',c:"We isolate A from B = 把 A 从 B 中剥离"},{t:'名词所有格',c:"training's effect = 培训的效果"},{t:'宾语',c:'other factors = 其他变量（市场、季节、管理变动）'}],
    tip:'<b>isolate … from …</b> 在效果评估里极关键：业务结果变化可能来自多种因素，能「拆因」才敢说培训有效。'}],
  qz:[
   {q:'"Smiles sheets" refer to?',o:['Facial exercises','Satisfaction surveys','Pay slips','Slides'],a:1,e:'代指培训后的满意度问卷。'},
   {q:'Kirkpatrick level two measures?',o:['Happiness','Learning / knowledge gained','Pay','Attendance'],a:1,e:'第二层衡量学习/知识获取。'},
   {q:'Level three is about?',o:['Reaction','Behavior on the job','Salary','Hiring'],a:1,e:'第三层行为层，看岗位是否用上。'},
   {q:"'isolate training's effect from other factors' means?",o:['Mix them','Separate training impact from other causes','Ignore it','Double it'],a:1,e:'把培训影响与其他因素剥离。'},
   {q:'The manager wants the debrief to report?',o:['Only satisfaction','All four levels','Nothing','Just cost'],a:1,e:'复盘报全部四层，不只满意度。'}],
  spk:[0,2,4,7]}
]},
{id:'perf',name:'绩效管理',en:'Performance Management',
 icon:'<svg class="ic l" viewBox="0 0 24 24"><path d="M12 20V10M18 20V4M6 20v-4"/></svg>',
 rd:[
  {id:'perf_r1',kind:'article',title:'Make Goals SMART',
   en:'Vague goals like improve communication are hard to manage because no one knows when they are met. The SMART framework fixes this: Specific, Measurable, Achievable, Relevant, Time-bound. A weak goal — be a better leader — becomes run a 30-minute team retrospective every two weeks and raise engagement scores by 5 points by Q4. Notice the change: the goal is now observable and has a deadline. Managers should co-write SMART goals with their reports rather than hand them down; ownership drives commitment. At review time, progress is easy to discuss because the target was clear from the start.',
   zh:'像"改善沟通"这样模糊的目标很难管理，因为没人知道何时算达成。SMART 框架解决了这个问题：具体（Specific）、可衡量（Measurable）、可达成（Achievable）、相关（Relevant）、有时限（Time-bound）。一个弱目标——"成为更好的领导者"——会变成：每两周做一次 30 分钟团队复盘，并在 Q4 前把敬业度分数提高 5 分。注意变化：目标现在可观察、且有截止时间。管理者应与下属共同制定 SMART 目标，而不是自上而下下发；主人翁感带来承诺。到了复盘时，因为目标从一开始就很清晰，进度很好讨论。',
   voc:[{w:'vague',p:'adj.',zh:'模糊的'},{w:'SMART',p:'n.',zh:'具体可衡量等目标框架'},{w:'retrospective',p:'n.',zh:'复盘会'},{w:'engagement',p:'n.',zh:'敬业度、参与度'},{w:'co-write',p:'v.',zh:'共同制定'},{w:'ownership',p:'n.',zh:'主人翁感'}],
   q:[{q:'What does the "M" in SMART stand for?',o:['Motivation','Measurable','Meeting','Money'],a:1,e:'SMART: Specific, Measurable, Achievable, Relevant, Time-bound。'},
      {q:'Why should managers co-write goals with reports?',o:['To save time','Ownership drives commitment','HR requires it','Avoid meetings'],a:1,e:'共同制定带来归属感，提升承诺度。'}]},
  {id:'perf_r2',kind:'email',title:'Q2 Performance Reviews Now Open',
   head:{to:'managers@acme.com',from:'people@acme.com',subject:'Q2 performance reviews now open — due June 20'},
   en:'Hi managers,\nThe Q2 performance review cycle is now open in the system. A few reminders:\n- Submit written feedback for each direct report by June 20.\n- Use the new rating scale (1 to 5) and support each score with a specific example.\n- Calibration meetings with your skip-level will be held the week of June 23.\nPlease do not wait until the deadline; block 30 minutes per report this week. If a report is on a PIP, note progress explicitly.\nThanks for keeping this fair and on time. People Team',
   zh:'各位经理好，\nQ2 绩效评估周期已在系统中开启。几点提醒：\n- 请于 6 月 20 日前提交每位直接下属的书面反馈。\n- 使用新的评分量表（1 到 5 分），并为每个分数提供具体事例支撑。\n- 与隔级上级的校准会议安排在 6 月 23 日当周。\n请勿拖到截止日；本周请为每份评估留出 30 分钟。若下属处于 PIP（绩效改进计划）中，请明确记录进展。\n感谢大家保持公平与准时。People 团队',
   voc:[{w:'direct report',p:'n.',zh:'直接下属'},{w:'rating scale',p:'n.',zh:'评分量表'},{w:'calibration',p:'n.',zh:'校准（评分对齐）'},{w:'skip-level',p:'n.',zh:'隔级上级'},{w:'PIP',p:'n.',zh:'绩效改进计划'},{w:'explicit',p:'adj.',zh:'明确的'}],
   q:[{q:'By when should written feedback be submitted?',o:['June 20','June 23','July 1','Immediately'],a:0,e:'提交截止 June 20。'},
      {q:'What must support each rating score?',o:['A self-assessment','A specific example','A manager opinion','Nothing'],a:1,e:'每个分数都要有具体事例支撑。'}]}
 ],
 units:[
 {id:'perf1',lv:1,t:'周度一对一与目标对齐',en:'Weekly One-on-One',
  scene:'和上级每周 15 分钟的一对一：同步进度、暴露卡点、请求资源。这是职场中<b>使用频率最高</b>的英语场景，练熟它收益最大。',
  dlg:[
   {s:'Manager',en:"Hi Lisa, thanks for making time. How are things going on your side this week?",zh:'嗨 Lisa，谢谢你抽时间。这周你那边进展如何？'},
   {s:'Lisa',b:1,en:"Overall on track. The report is about eighty percent done, and I should finish it by Thursday.",zh:'总体按计划进行。报告完成了大约 80%，我应该周四能做完。'},
   {s:'Manager',en:"Good. Anything blocking you at the moment?",zh:'很好。目前有什么卡住你的吗？'},
   {s:'Lisa',b:1,en:"One thing. I'm still waiting on the finance data, and I've followed up twice without a reply.",zh:'有一件事。我还在等财务数据，已经跟进两次了但没回复。'},
   {s:'Manager',en:"Let me nudge them. If you don't hear back by tomorrow noon, loop me in directly.",zh:'我去催一下。如果明天中午之前还没回音，直接把我拉进来。'},
   {s:'Lisa',b:1,en:"Will do. I'd also like to align on priorities — should I put the client deck ahead of the monthly report?",zh:'好的。我还想对一下优先级——客户材料要排在月报前面吗？'},
   {s:'Manager',en:"Yes, the deck comes first. The monthly report can slip a day if needed.",zh:'对，客户材料优先。月报如果需要可以延一天。'},
   {s:'Lisa',b:1,en:"That helps. One last thing — I'd like to take Friday off for a family matter.",zh:'那就清楚了。最后一件事——我想周五请一天假处理家事。'},
   {s:'Manager',en:"No problem, just put it in the system. Anything you need from me before then?",zh:'没问题，在系统里提交一下就行。在那之前还需要我做什么吗？'},
   {s:'Lisa',b:1,en:"Not right now. I'll flag it early if anything changes.",zh:'暂时没有。如果有变化我会尽早提出来。'}],
  voc:[
   {w:'on track',p:'phr.',zh:'按计划进行、进度正常',ex:'The project is on track for a June launch.',exzh:'项目按计划将在六月上线。'},
   {w:'blocker / blocking',p:'n./v.',zh:'阻碍、卡点',ex:'What is the biggest blocker right now?',exzh:'现在最大的卡点是什么？'},
   {w:'wait on',p:'phr.v.',zh:'等待（某人给东西）',ex:"I'm waiting on approval from legal.",exzh:'我在等法务的审批。'},
   {w:'follow up',p:'phr.v.',zh:'跟进',ex:'I will follow up with them tomorrow.',exzh:'我明天会跟他们跟进。'},
   {w:'nudge',p:'v.',zh:'轻推、催一下（委婉）',ex:'Can you nudge the vendor for a response?',exzh:'你能催一下供应商回复吗？'},
   {w:'loop someone in',p:'phr.v.',zh:'把某人加入沟通中',ex:'Please loop me in on that email thread.',exzh:'请把我加进那个邮件讨论里。'},
   {w:'align on',p:'phr.v.',zh:'就…达成一致',ex:'Let us align on the scope before we start.',exzh:'开始前我们先对齐一下范围。'},
   {w:'slip',p:'v.',zh:'（进度）拖延、延后',ex:'The deadline slipped by two days.',exzh:'截止日期延后了两天。'}],
  sen:[
   {en:"If you don't hear back by tomorrow noon, loop me in directly.",zh:'如果明天中午之前还没收到回复，直接把我拉进来。',
    parts:[{t:'条件句',c:"If you don't hear back… —— 从句用一般现在时（主将从现），主句是祈使句"},{t:'短语动词',c:'hear back (from sb) = 收到某人的回复，不及物，不能说 hear back the email'},{t:'时间界限',c:'by tomorrow noon = 不迟于明天中午（by 表最后期限）'},{t:'祈使',c:'loop me in —— 代词 me 必须放在 loop 和 in 中间，不能说 loop in me'}],
    tip:'<b>by 和 before 的区别</b>：by tomorrow noon 包含中午这个点（不晚于）；before noon 是中午之前。约定 deadline 时用 by 更清楚。另外短语动词带代词宾语时必须「拆开放中间」。'},
   {en:"I'd also like to align on priorities — should I put the client deck ahead of the monthly report?",zh:'我还想对一下优先级——客户材料要排在月报前面吗？',
    parts:[{t:'委婉表达',c:"I'd like to = I would like to（比 I want to 客气得多，职场默认用这个）"},{t:'搭配',c:'align on + 事项（就某事对齐）；align with + 人（与某人对齐）'},{t:'比较',c:'put A ahead of B = 把 A 排在 B 之前（优先级）'}],
    tip:'把 <b>I want</b> 全部替换成 <b>I\'d like</b>，这一个改动就能让你的英语听起来专业一个档次。同理：Can you → Could you，I need → I\'d appreciate it if…'}],
  qz:[
   {q:'"Anything blocking you at the moment?" 在问？',o:['谁挡住你了','目前有什么阻碍你的进展','你在封锁什么','你的路被堵了吗'],a:1,e:'blocker/blocking 指阻碍工作推进的因素，是敏捷团队高频词。'},
   {q:'"Please loop me in." 意思是？',o:['请绕开我','请把我加入沟通','请给我打个圈','请重复一遍'],a:1,e:'loop sb in = 把某人纳入信息链（邮件、会议、群）。'},
   {q:'"I\'m waiting on the finance data." 中 wait on 表示？',o:['服务某人','等待（某人提供的东西）','在…上等','推迟'],a:1,e:'职场中 wait on sth/sb = 在等某人给的东西，与 wait for 近义。'},
   {q:'"If you don\'t hear back by noon, ___ me in." 应填？',o:['loop','looping','to loop','looped'],a:0,e:'主句为祈使句，动词用原形。'},
   {q:'"The deadline slipped by two days." 意思是？',o:['截止日期提前了两天','截止日期延后了两天','截止日期取消了','有人滑倒了两天'],a:1,e:'slip 在项目管理中指进度延后。'}],
  spk:[2,4,5,8]},

 {id:'perf2',lv:2,t:'季度绩效面谈',en:'Performance Review',
  scene:'正式的季度绩效沟通：给出评级、举证优点与不足、协商下季度目标。既要能听懂委婉的批评，也要能有据地为自己争取。',
  dlg:[
   {s:'Manager',en:"Let's start with what went well. You consistently delivered ahead of schedule, and the client feedback has been outstanding.",zh:'我们先说做得好的部分。你一直提前交付，客户反馈也非常出色。'},
   {s:'Employee',b:1,en:"Thank you. The early delivery came from moving the review cycle up front, which cut a lot of rework.",zh:'谢谢。提前交付得益于把评审环节前置，这减少了大量返工。'},
   {s:'Manager',en:"That's a good insight. Now, one area for development: cross-team communication. Twice this quarter, other teams found out about changes after they'd already happened.",zh:'这个洞察很好。接下来说一个待发展的方面：跨团队沟通。这个季度有两次，其他团队是在变更已经发生之后才知道的。'},
   {s:'Employee',b:1,en:"I see. Could you give me a specific example so I understand the impact?",zh:'我明白了。您能举个具体例子吗，好让我理解它的影响？'},
   {s:'Manager',en:"Sure. When you changed the data format in week six, the BI team had to rebuild two dashboards over a weekend.",zh:'当然。第六周你改了数据格式，BI 团队不得不在周末重建两个看板。'},
   {s:'Employee',b:1,en:"That's fair, and I hadn't realized the downstream impact. I'll set up a change-notice checklist going forward.",zh:'这个批评合理，我当时没意识到下游影响。今后我会建立一个变更通知清单。'},
   {s:'Manager',en:"That would address it. Overall, I'm rating you as 'exceeds expectations' — strong delivery, with communication as the growth edge.",zh:'那能解决问题。总体上，我给你的评级是「超出预期」——交付很强，沟通是成长点。'},
   {s:'Employee',b:1,en:"I appreciate the recognition. Could we discuss what it would take to reach the top rating next cycle?",zh:'感谢认可。我们能聊聊下个周期要达到最高评级需要做到什么吗？'},
   {s:'Manager',en:"Good question. It usually requires influence beyond your own scope — for example, leading a cross-functional initiative.",zh:'好问题。通常需要超出本职范围的影响力——比如主导一个跨职能项目。'}],
  voc:[
   {w:'ahead of schedule',p:'phr.',zh:'提前于计划',ex:'We completed the migration ahead of schedule.',exzh:'我们提前完成了迁移。'},
   {w:'area for development',p:'n.',zh:'待改进/待发展的方面（委婉说缺点）',ex:'One area for development is delegation.',exzh:'一个待改进的方面是授权。'},
   {w:'rework',p:'n.',zh:'返工',ex:'Early review reduces rework significantly.',exzh:'提前评审能显著减少返工。'},
   {w:'downstream impact',p:'n.',zh:'对下游环节的影响',ex:'Consider the downstream impact before changing the schema.',exzh:'改结构之前先考虑下游影响。'},
   {w:'going forward',p:'phr.',zh:'今后、从现在起',ex:'Going forward, we will review weekly.',exzh:'今后我们会每周复核。'},
   {w:'exceeds expectations',p:'phr.',zh:'超出预期（绩效评级）',ex:'She was rated as exceeds expectations.',exzh:'她被评为超出预期。'},
   {w:'growth edge',p:'n.',zh:'成长点、突破口',ex:'Public speaking is his growth edge this year.',exzh:'公开演讲是他今年的成长点。'},
   {w:'cross-functional',p:'adj.',zh:'跨职能的',ex:'She leads a cross-functional initiative.',exzh:'她主导一个跨职能项目。'}],
  sen:[
   {en:"Twice this quarter, other teams found out about changes after they'd already happened.",zh:'这个季度有两次，其他团队是在变更已经发生之后才知道的。',
    parts:[{t:'频度状语',c:'Twice this quarter 置于句首，用事实次数代替主观评价，是「就事论事」的关键'},{t:'短语动词',c:'find out about sth = 得知某事（强调「获知」的动作）'},{t:'过去完成',c:"after they'd already happened —— 「变更发生」早于「团队得知」，用过去完成时表明先后"}],
    tip:'<b>过去完成时（had done）</b>专门用来表示「过去的过去」。绩效面谈中描述时间线时必须用对，否则听者会误判因果顺序。'},
   {en:"Could we discuss what it would take to reach the top rating next cycle?",zh:'我们能聊聊下个周期要达到最高评级需要做到什么吗？',
    parts:[{t:'礼貌提议',c:'Could we discuss… —— 用 we 而非 I，把对话框定为「共同探讨」'},{t:'名词从句',c:'what it would take to… = 需要什么条件才能…（it 是形式主语，take 表「需要付出」）'},{t:'虚拟',c:'would 表示对未来假设情形的推测，比 will 更留有余地'}],
    tip:'<b>What would it take to…?</b> 是职场万能句：谈晋升、谈资源、谈合作都能用，意思是「要达成 X，需要什么条件？」——把索取变成探讨，非常高级。'}],
  qz:[
   {q:'"One area for development is delegation." 实际是在说？',o:['一个发展区域','授权方面还有不足（委婉批评）','已经很擅长授权','需要开发新区域'],a:1,e:'area for development 是英美职场对「缺点」的标准委婉说法。'},
   {q:'"…after they had already happened." 使用过去完成时是为了？',o:['表示礼貌','表明该动作早于另一个过去动作','表示将来','表示假设'],a:1,e:'过去完成时表示「过去的过去」，理清时间先后。'},
   {q:'"What would it take to get promoted?" 的意思是？',o:['升职要花多少钱','升职需要具备什么条件','升职要多久','谁能带我升职'],a:1,e:'take 在此表示「需要（付出/具备）」。'},
   {q:'"Going forward, we will review weekly." 中 going forward 意思是？',o:['向前走','今后','正在推进','前瞻性地'],a:1,e:'going forward = from now on，今后。'},
   {q:'"Consider the downstream impact." 提醒你考虑？',o:['下游河道','对后续环节/团队的连带影响','向下的压力','降级的可能'],a:1,e:'downstream impact 指变更对后续依赖方的影响。'}],
  spk:[3,5,7,8]},

 {id:'perf3',lv:3,t:'绩效改进计划与艰难对话',en:'PIP & Difficult Conversation',
  scene:'向持续未达标的员工正式提出绩效改进计划（PIP）。措辞必须精确、有据、合规——既传达严重性，又不留法律隐患。这是 HR 英语的天花板场景。',
  dlg:[
   {s:'Manager',en:"I want to be direct with you, because I don't think it would be fair to leave any ambiguity here.",zh:'我想跟你直说，因为我认为在这件事上留有含糊对你并不公平。'},
   {s:'Employee',b:1,en:"I'd rather you were direct. Where do we stand?",zh:'我也希望您直说。目前情况如何？'},
   {s:'Manager',en:"Your output has been below the agreed target for two consecutive quarters, despite the support we put in place in March.",zh:'尽管三月我们已经提供了支持，你的产出仍连续两个季度低于约定目标。'},
   {s:'Employee',b:1,en:"I don't dispute the numbers. I do think the scope changed substantially without the target being adjusted.",zh:'我不否认这些数字。但我确实认为工作范围发生了很大变化，而目标却没有相应调整。'},
   {s:'Manager',en:"That's a legitimate point, and I should have revisited the target when the scope shifted. That said, the gap is wider than scope alone would explain.",zh:'这个观点是有道理的，范围变化时我本应重新审视目标。话虽如此，这个差距比单靠范围变化能解释的要大。'},
   {s:'Employee',b:1,en:"Understood. What happens next?",zh:'明白。接下来会怎样？'},
   {s:'Manager',en:"We're placing you on a formal performance improvement plan for sixty days, with clearly defined, measurable milestones at day thirty and day sixty.",zh:'我们将为你启动一个为期六十天的正式绩效改进计划，在第 30 天和第 60 天设有明确、可衡量的里程碑。'},
   {s:'Employee',b:1,en:"And if I meet those milestones?",zh:'如果我达成了这些里程碑呢？'},
   {s:'Manager',en:"Then the plan closes and you return to standard performance management. If they're not met, we would need to discuss other options, and I want you to hear that clearly now rather than be surprised later.",zh:'那么计划就结束，你回到常规绩效管理。如果没有达成，我们就需要讨论其他选择——我希望你现在就清楚地听到这一点，而不是之后感到意外。'},
   {s:'Employee',b:1,en:"I appreciate you spelling it out. Can I have the plan in writing before I respond?",zh:'谢谢您说清楚。我能在答复前先拿到书面计划吗？'}],
  voc:[
   {w:'ambiguity',p:'n.',zh:'模糊、含糊之处',ex:'We should remove any ambiguity from the contract.',exzh:'我们应当消除合同中的任何含糊之处。'},
   {w:'consecutive',p:'adj.',zh:'连续的',ex:'Three consecutive months of decline.',exzh:'连续三个月下滑。'},
   {w:'dispute',p:'v.',zh:'质疑、有异议',ex:'Nobody disputes the need for change.',exzh:'没人质疑变革的必要性。'},
   {w:'legitimate',p:'adj.',zh:'合理的、正当的',ex:'That is a legitimate concern.',exzh:'那是一个合理的关切。'},
   {w:'that said',p:'phr.',zh:'话虽如此（转折）',ex:'That said, we still need to act.',exzh:'话虽如此，我们仍需行动。'},
   {w:'performance improvement plan (PIP)',p:'n.',zh:'绩效改进计划',ex:'He was placed on a PIP for sixty days.',exzh:'他被启动了为期六十天的绩效改进计划。'},
   {w:'milestone',p:'n.',zh:'里程碑（阶段性节点）',ex:'The first milestone is due at day thirty.',exzh:'第一个里程碑在第三十天到期。'},
   {w:'spell out',p:'phr.v.',zh:'讲清楚、明确说明',ex:'Let me spell out what we expect.',exzh:'让我明确说明我们的期望。'}],
  sen:[
   {en:"Your output has been below the agreed target for two consecutive quarters, despite the support we put in place in March.",zh:'尽管三月我们已提供了支持，你的产出仍连续两个季度低于约定目标。',
    parts:[{t:'现在完成',c:'has been below… for two quarters —— 强调「持续至今仍未改善」，这是 PIP 成立的关键时态'},{t:'过去分词作定语',c:'the agreed target = 已达成一致的目标（暗示对方也认可过，堵住争议）'},{t:'让步状语',c:'despite + 名词短语（不能接从句！despite that ✘ / although + 从句 ✔）'},{t:'省略定语从句',c:'the support (that) we put in place —— 省略了关系代词 that'}],
    tip:'<b>despite / in spite of 后只能接名词或动名词</b>，不能接句子。要接句子请用 although / even though。这是六级以上仍高频出错的点。'},
   {en:"If they're not met, we would need to discuss other options, and I want you to hear that clearly now rather than be surprised later.",zh:'如果没有达成，我们就需要讨论其他选择——我希望你现在就清楚地听到这一点，而不是之后感到意外。',
    parts:[{t:'条件+虚拟',c:'If they\'re not met, we would need… —— 混合语气：条件用现在时，主句用 would 弱化威胁感'},{t:'委婉',c:'discuss other options 是「可能解除劳动关系」的标准委婉说法'},{t:'使役结构',c:'want sb to do sth —— I want you to hear that'},{t:'平行',c:'hear that clearly now <b>rather than</b> be surprised later —— rather than 前后都用动词原形，保持对称'}],
    tip:'艰难对话的黄金公式：<b>事实（数据）+ 承认对方合理处 + 明确后果 + 书面化</b>。语气用 would 而非 will，是为了保留余地、避免被视为已作决定。'}],
  qz:[
   {q:'"despite the support we put in place" 中 despite 后面能接？',o:['完整句子','名词或动名词','动词原形','形容词'],a:1,e:'despite / in spite of 是介词，后接名词性成分；接句子要用 although。'},
   {q:'HR 说 "we would need to discuss other options"，实际暗示？',o:['有更多选择很开心','可能走向解除劳动关系','会给你换个部门旅游','需要开会讨论'],a:1,e:'这是英美职场对「可能终止雇佣」的标准委婉表达。'},
   {q:'"That said, we still need to act." 中 that said 的作用是？',o:['补充说明','表示转折（话虽如此）','表示总结','表示同意'],a:1,e:'that said = having said that，引出让步后的转折。'},
   {q:'"Can you spell it out?" 是请求对方？',o:['把单词拼出来','把话说清楚、讲明白','写下来','慢慢说'],a:1,e:'spell out = 详细、明确地说明（不只是拼写）。'},
   {q:'"Your output has been below target for two quarters." 用现在完成时是为了强调？',o:['已经结束','持续到现在仍未改善','将来会发生','偶尔发生过'],a:1,e:'现在完成时表示状态从过去延续至今，是 PIP 论证的关键。'}],
  spk:[0,4,6,8]},
 {id:'perf4',lv:2,t:'绩效改进计划 PIP',en:'Performance Improvement',
  scene:'经理与绩效不佳员工沟通 PIP，明确期望、支持与时间表，语气专业且建设性。',
  dlg:[

  sen:[

    parts:[{t:'主谓宾',c:'We will put a plan in place = 把计划落地（ put … in place 表「实施」）'},{t:'定语',c:'a 60-day performance improvement plan = 60天绩效改进计划'},{t:'伴随状语',c:'with clear goals and weekly check-ins = 带明确目标和每周跟进'}],

{id:'comp',name:'薪酬福利',en:'Compensation & Benefits',
 icon:'<svg class="ic l" viewBox="0 0 24 24"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
 rd:[
  {id:'comp_r1',kind:'article',title:'Understanding Total Rewards',
   en:'Employees rarely see the full value of what they receive. Total rewards includes far more than base salary: variable pay such as bonuses, long-term incentives like stock, and benefits from health insurance to paid leave. A clear total-rewards statement helps retention because people understand their real package. For HR, the work is to communicate, not just calculate. Explain the vesting of equity in plain language, show how the bonus is funded, and remind staff of less visible perks — mental-health support, learning budgets, commuting allowances. When employees grasp the whole picture, they are less likely to leave for a slightly higher base elsewhere.',
   zh:'员工很少看到自己所得的全部价值。整体薪酬远不止基本工资：它包括奖金等变动薪酬、股票等长期激励，以及从医疗保险到带薪休假的各项福利。一份清晰的整体薪酬单有助于留人，因为员工看清了自己真实的薪酬包。对 HR 来说，工作是要"沟通"而不只是"计算"。用大白话解释股权的归属期，说明奖金的资金来源，并提醒员工那些不太显眼的福利——心理健康支持、学习预算、通勤补贴。当员工掌握全貌，他们就不太会为了别处略高的底薪而离职。',
   voc:[{w:'total rewards',p:'n.',zh:'整体薪酬'},{w:'variable pay',p:'n.',zh:'变动薪酬'},{w:'long-term incentive',p:'n.',zh:'长期激励'},{w:'vesting',p:'n.',zh:'（股权）归属'},{w:'equity',p:'n.',zh:'股权、权益'},{w:'retention',p:'n.',zh:'留任'}],
   q:[{q:'"Total rewards" includes which of the following?',o:['Only base salary','Base, variable pay, equity and benefits','Cash only','Overtime only'],a:1,e:'整体薪酬含基本工资、变动薪酬、股权、福利等。'},
      {q:'Why does a clear total-rewards statement help retention?',o:['It reduces taxes','Employees see their real package value','It is required by law','It saves printing'],a:1,e:'员工看清真实总包价值，不易为略高底薪离职。'}]},
  {id:'comp_r2',kind:'email',title:'Your FY25 Compensation Update',
   head:{to:'jane.doe@acme.com',from:'people@acme.com',subject:'Your FY25 compensation update'},
   en:'Dear Jane,\nCongratulations — following the annual review, your base salary will increase from 180,000 to 192,000, effective July 1. Your target bonus remains 15% of base. The increase reflects strong delivery on your objectives and a market adjustment to keep you within band.\nYour updated total-rewards statement is available in the portal. As a reminder, details of individual compensation are confidential; please do not share them internally.\nWe appreciate your contribution this year. People Team',
   zh:'尊敬的 Jane，\n恭喜——根据年度评估，你的基本工资将从 180,000 上调至 192,000，7 月 1 日生效。目标奖金维持为底薪的 15%。这次调薪反映了你在目标上的出色达成，也是为让你保持在薪酬区间内所做的市场对标。\n更新后的整体薪酬单已在门户中可查。提醒一下，个人薪酬细节属于保密信息，请勿在公司内部分享。\n感谢你今年的付出。People 团队',
   voc:[{w:'base salary',p:'n.',zh:'基本工资'},{w:'effective',p:'adj.',zh:'生效的'},{w:'target bonus',p:'n.',zh:'目标奖金'},{w:'market adjustment',p:'n.',zh:'市场对标调整'},{w:'band',p:'n.',zh:'薪酬区间、职级带宽'},{w:'confidential',p:'adj.',zh:'保密的'}],
   q:[{q:"What is Jane's new base salary?",o:['180,000','192,000','15%','207,000'],a:1,e:'新底薪 192,000，生效 7 月 1 日。'},
      {q:'Which statement about the increase is TRUE?',o:['It is a market adjustment','It is a penalty','It is temporary','It reduces her bonus'],a:0,e:'调薪反映目标达成 + 市场对标，属市场调整。'}]}
 ],
 units:[
 {id:'comp1',lv:1,t:'工资条与福利咨询',en:'Payslip & Benefits Enquiry',
  scene:'员工来问工资条上的扣款、社保公积金、年假和商业保险。这是 HR 每月都会被问几十次的对话，句型高度重复，练熟一次终身受用。',
  dlg:[
   {s:'Employee',en:"Hi, I have a question about my payslip. There's a deduction I don't recognize.",zh:'你好，我想问一下工资条。有一项扣款我看不懂。'},
   {s:'HR',b:1,en:"Sure, let me take a look. Which line are you referring to?",zh:'好的，我看看。您指的是哪一行？'},
   {s:'Employee',en:"The one labeled 'supplementary insurance', about 180 yuan.",zh:'标着「补充保险」那一行，大约 180 元。'},
   {s:'HR',b:1,en:"That's the employee contribution to our commercial medical plan. The company covers seventy percent and you pay the rest.",zh:'那是商业医疗计划的员工自付部分。公司承担 70%，剩下的由您支付。'},
   {s:'Employee',en:"I see. Does that cover my family as well?",zh:'明白了。这也覆盖我的家人吗？'},
   {s:'HR',b:1,en:"Your spouse and children can be added, but the extra premium is fully at your own cost. Enrollment opens every November.",zh:'配偶和子女可以加进来，但额外保费需要您全额承担。每年十一月开放投保。'},
   {s:'Employee',en:"Good to know. One more thing — how many annual leave days do I have left?",zh:'知道了。还有一件事——我还剩多少年假？'},
   {s:'HR',b:1,en:"You've used six out of fifteen, so nine days remain. They expire at the end of March next year.",zh:'您已用了 15 天中的 6 天，还剩 9 天。它们在明年三月底作废。'},
   {s:'Employee',en:"Can unused days be carried over or cashed out?",zh:'没用完的假可以顺延或折现吗？'},
   {s:'HR',b:1,en:"They can be carried over for three months, but they can't be cashed out under the current policy.",zh:'可以顺延三个月，但按现行政策不能折现。'}],
  voc:[
   {w:'payslip',p:'n.',zh:'工资条',ex:'Payslips are issued on the fifth of each month.',exzh:'工资条每月五号发放。'},
   {w:'deduction',p:'n.',zh:'扣款、扣除项',ex:'Tax and social insurance are standard deductions.',exzh:'个税和社保是标准扣除项。'},
   {w:'contribution',p:'n.',zh:'（个人/公司）缴纳部分',ex:'The employer contribution is twelve percent.',exzh:'公司缴纳比例为 12%。'},
   {w:'premium',p:'n.',zh:'保费',ex:'The premium increases with age.',exzh:'保费随年龄增长而上升。'},
   {w:'enrollment',p:'n.',zh:'参保、报名登记',ex:'Open enrollment runs through November.',exzh:'开放参保期持续整个十一月。'},
   {w:'annual leave',p:'n.',zh:'年假',ex:'You are entitled to fifteen days of annual leave.',exzh:'您享有十五天年假。'},
   {w:'carry over',p:'phr.v.',zh:'（假期/余额）结转到下期',ex:'Unused days can be carried over to Q1.',exzh:'未使用的天数可结转至第一季度。'},
   {w:'cash out',p:'phr.v.',zh:'折现、兑换成现金',ex:'Leave cannot be cashed out at resignation.',exzh:'离职时年假不能折现。'}],
  sen:[
   {en:"Your spouse and children can be added, but the extra premium is fully at your own cost.",zh:'您的配偶和子女可以加入，但额外保费需要您全额承担。',
    parts:[{t:'被动+情态',c:'can be added —— 强调「可以被加入」，不必说明由谁操作'},{t:'转折',c:'but 连接两个独立分句，前半给好消息，后半给条件'},{t:'固定短语',c:'at your own cost = 由你自费（同义：at your own expense）'}],
    tip:'HR 回答问题的标准结构：<b>先给可行性（can be…），再给条件（but…）</b>。这个「先肯定后限定」的顺序，比一上来说 No 要专业得多。'},
   {en:"They can be carried over for three months, but they can't be cashed out under the current policy.",zh:'它们可以顺延三个月，但按现行政策不能折现。',
    parts:[{t:'并列被动',c:'can be carried over / can\'t be cashed out —— 两个被动结构对称，读起来清晰有力'},{t:'时长',c:'for three months = 持续三个月（for + 时间段）'},{t:'依据状语',c:'under the current policy = 按照现行政策（under 表「依据、根据」）'}],
    tip:'<b>under the current policy</b> 是 HR 的护身符句式：把「不行」的责任归于制度而非个人。同类还有 as per company policy、in line with regulations。'}],
  qz:[
   {q:'"Unused days can be carried over." 意思是？',o:['未使用的天数可以带走','未使用的天数可以结转到下一期','未使用的天数会作废','未使用的天数可以卖掉'],a:1,e:'carry over = 结转、顺延到下一周期。'},
   {q:'"The extra premium is at your own cost." 意思是？',o:['额外保费由公司出','额外保费由你自己承担','额外保费不用交','额外保费打折'],a:1,e:'at one\'s own cost/expense = 自费。'},
   {q:'"Leave cannot be cashed out." 意思是？',o:['不能请假','假期不能折算成现金','不能提现工资','不能出门'],a:1,e:'cash out = 折现、兑成现金。'},
   {q:'"under the current policy" 意思是？',o:['在政策之下藏着','按照现行政策','政策即将改变','违反政策'],a:1,e:'under 在此表「依据、按照」。'},
   {q:'工资条上的 "deduction" 指？',o:['奖金','扣除项','推理','折扣券'],a:1,e:'deduction 指从应发工资中扣除的部分，如个税、社保。'}],
  spk:[0,3,5,9]},

 {id:'comp2',lv:2,t:'调薪沟通与市场对标',en:'Salary Adjustment & Benchmarking',
  scene:'员工提出加薪诉求，HR 用市场数据、内部公平性和绩效表现三个维度回应。既要能主张自己的价值，也要能听懂对方的制度约束。',
  dlg:[
   {s:'Employee',en:"I'd like to raise the topic of compensation. Based on what I've seen in the market, I believe my current salary is below where it should be.",zh:'我想谈一下薪酬。根据我了解的市场情况，我认为我目前的薪资低于应有水平。'},
   {s:'HR',b:1,en:"I'm glad you brought it up. Can you share what data you're basing that on?",zh:'很高兴你提出来。你能分享一下依据的是什么数据吗？'},
   {s:'Employee',en:"Two recruiters approached me with roles at a similar level paying fifteen to twenty percent more.",zh:'有两位猎头联系我，提供同级别岗位，薪资高出 15% 到 20%。'},
   {s:'HR',b:1,en:"That's useful, though recruiter figures often reflect the top of the range rather than the median.",zh:'这个信息有用，不过猎头给的数字往往反映的是区间上限，而非中位数。'},
   {s:'Employee',en:"Fair. What does our internal benchmarking show?",zh:'有道理。那我们内部的对标数据显示什么？'},
   {s:'HR',b:1,en:"You sit at the sixtieth percentile of the band, which is consistent with your performance rating and tenure.",zh:'你处于薪酬带的第 60 百分位，这与你的绩效评级和司龄是相符的。'},
   {s:'Employee',en:"Then what would move me toward the seventy-fifth percentile?",zh:'那么什么能让我向第 75 百分位靠拢？'},
   {s:'HR',b:1,en:"Consistently exceeding expectations, plus taking on scope beyond your current level. Both of those feed directly into the merit matrix.",zh:'持续超出预期，加上承担超越当前层级的职责范围。这两点都会直接影响调薪矩阵。'},
   {s:'Employee',en:"That gives me something concrete to work toward. When is the next adjustment cycle?",zh:'这给了我具体可努力的方向。下一次调薪周期是什么时候？'},
   {s:'HR',b:1,en:"April, with proposals locked by mid-March. I'd suggest we revisit this in February so your manager can build the case.",zh:'四月，方案在三月中旬锁定。我建议我们二月再聊一次，这样你的主管可以准备论据。'}],
  voc:[
   {w:'bring something up',p:'phr.v.',zh:'提出（话题）',ex:'Thanks for bringing that up.',exzh:'谢谢你提出这一点。'},
   {w:'base something on',p:'v.',zh:'以…为依据',ex:'The estimate is based on last year data.',exzh:'该估算以去年数据为依据。'},
   {w:'median',p:'n.',zh:'中位数',ex:'We pay at the market median.',exzh:'我们按市场中位数付薪。'},
   {w:'percentile',p:'n.',zh:'百分位',ex:'She is at the eightieth percentile of her band.',exzh:'她处于其薪酬带的第 80 百分位。'},
   {w:'consistent with',p:'adj.',zh:'与…相符',ex:'The result is consistent with our forecast.',exzh:'结果与我们的预测相符。'},
   {w:'take on scope',p:'phr.',zh:'承担更大职责范围',ex:'He took on scope well beyond his level.',exzh:'他承担了远超其层级的职责。'},
   {w:'merit matrix',p:'n.',zh:'调薪矩阵（按绩效与市场位置定幅度）',ex:'The merit matrix links rating to increase percentage.',exzh:'调薪矩阵把绩效评级与涨幅挂钩。'},
   {w:'build the case',p:'phr.',zh:'准备论据、做立项说明',ex:'Your manager needs time to build the case.',exzh:'你的主管需要时间准备论据。'}],
  sen:[
   {en:"That's useful, though recruiter figures often reflect the top of the range rather than the median.",zh:'这个信息有用，不过猎头给的数字往往反映的是区间上限，而非中位数。',
    parts:[{t:'先肯定',c:"That's useful —— 先承认对方信息的价值，再反驳，是不激化冲突的关键"},{t:'让步连词',c:'though 引导让步从句，位置比 although 灵活，口语中常置于句中或句末'},{t:'对比',c:'the top of the range <b>rather than</b> the median —— 用「上限 vs 中位数」精准反驳，而非否定对方'}],
    tip:'<b>先肯定 + though + 数据反驳</b>是英文异议表达的标准三段式。直接说 You are wrong 在英语职场几乎等同于失礼。'},
   {en:"You sit at the sixtieth percentile of the band, which is consistent with your performance rating and tenure.",zh:'你处于薪酬带的第 60 百分位，这与你的绩效评级和司龄相符。',
    parts:[{t:'比喻用法',c:'sit at… —— 用 sit 表示「处于某个位置」，比 you are at 更专业'},{t:'序数词',c:'the sixtieth percentile —— 百分位必须用序数词（60th），不能说 sixty percentile'},{t:'非限定',c:'which is consistent with… —— which 指代「你处于 60 百分位」这件事'}],
    tip:'谈薪时听懂 <b>percentile（百分位）</b>至关重要：50th = 市场中位，75th = 高于四分之三的人。对方说 you sit at the 60th，等于在说「你不低，但也不算特别高」。'}],
  qz:[
   {q:'"We pay at the market median." 意思是？',o:['我们按市场最高价付薪','我们按市场中位数付薪','我们不参考市场','我们付薪低于市场'],a:1,e:'median = 中位数，是薪酬对标最常用的基准点。'},
   {q:'"That\'s useful, though recruiter figures reflect the top of the range." 说话人的态度是？',o:['完全同意','先肯定再委婉反驳','完全否定','没有听懂'],a:1,e:'先认可价值再用数据修正，是英文异议表达的标准方式。'},
   {q:'"She is at the eightieth percentile." 表示她的薪资？',o:['是市场的 80%','高于该带宽内 80% 的人','排名第 80','需要涨 80%'],a:1,e:'第 80 百分位意味着高于同带宽 80% 的人。'},
   {q:'"Thanks for bringing that up." 意思是？',o:['谢谢你抬起来','谢谢你提出这个话题','谢谢你养大它','谢谢你带上来'],a:1,e:'bring up = 提出（话题、问题）。'},
   {q:'"Your manager needs time to build the case." 中 build the case 指？',o:['盖房子','准备支持该请求的论据材料','建立案例库','打官司'],a:1,e:'build a case = 组织证据和理由来支持某个主张。'}],
  spk:[0,3,6,9]},

 {id:'comp3',lv:3,t:'整体薪酬与长期激励',en:'Total Rewards & Equity',
  scene:'与高管候选人或核心人才讨论股权、递延奖金、归属条款等长期激励设计。金融术语密集，句式复杂，是薪酬英语的最高阶。',
  dlg:[
   {s:'CHRO',en:"The package consists of three components: base, an annual bonus targeted at thirty percent, and a long-term incentive granted in restricted stock units.",zh:'这个薪酬包由三部分组成：基本工资、目标为 30% 的年度奖金，以及以限制性股票单位形式授予的长期激励。'},
   {s:'Candidate',b:1,en:"What's the vesting schedule on the RSUs?",zh:'限制性股票的归属安排是怎样的？'},

  voc:[

  sen:[
   {en:"There's a double-trigger provision: acceleration applies only if there's both a change of control and an involuntary termination within twelve months.",zh:'有一个双触发条款：只有在发生控制权变更且十二个月内被非自愿解雇时，加速归属才适用。',
    parts:[{t:'存在句',c:"There's a … provision —— 引出条款存在，冒号后展开具体内容"},{t:'限定条件',c:'applies <b>only if</b>… —— only if 表示「仅当…才」，比 if 严格得多，法律文本必备'},{t:'并列结构',c:'both A <b>and</b> B —— both…and 强调两个条件<b>同时</b>满足，这正是 double-trigger 的含义'},{t:'时间限定',c:'within twelve months 修饰 termination，界定时间窗口'}],

   {q:'"double-trigger provision" 要求？',o:['触发两次即可','两个条件同时满足才生效','可以选择其中一个条件','连续触发两年'],a:1,e:'双触发通常是「控制权变更 + 非自愿离职」两个条件同时成立。'},

 rd:[
  {id:'er_r1',kind:'article',title:'The Real Reason People Quit',
   en:'Most people do not leave jobs — they leave managers. Year after year, engagement surveys tell the same story: pay is rarely the top reason people walk out the door. What pushes them to leave is usually closer to home: a manager who does not listen, goals that keep shifting, or no clear path to grow. The good news for HR is that these drivers show up early. A short stay interview — asking a valued employee why they stay, before they start looking elsewhere — costs nothing and catches risk months ahead of an exit interview. Smart teams also watch the quiet signals: a drop in meeting participation, fewer new ideas, or a sudden interest in internal transfers. None of it proves someone is leaving, but together they are worth a caring conversation.',
   zh:'大多数人离开的不是工作，而是管理者。年复一年，敬业度调研讲述同一个故事：薪酬很少是人们离职的头号原因。真正推动他们离开的，往往更"近身"：不倾听的管理者、不断变动的目标，或没有清晰的成长路径。对 HR 的好消息是，这些驱动因素很早就出现。一次简短的留人面谈——在宝贵员工开始向外看之前，问他们为什么留下——不花一分钱，却能在离职面谈前几个月就捕捉到风险。聪明的团队也会留意那些安静的信号：会议参与减少、新想法变少，或突然对内部转岗产生兴趣。这些单独都不能证明谁要走，但合在一起，值得一次走心的谈话。',
   voc:[{w:'engagement',p:'n.',zh:'敬业度'},{w:'stay interview',p:'n.',zh:'留人面谈'},{w:'exit interview',p:'n.',zh:'离职面谈'},{w:'driver',p:'n.',zh:'驱动因素'},{w:'internal transfer',p:'n.',zh:'内部转岗'},{w:'participation',p:'n.',zh:'参与度'}],
   q:[{q:'According to the passage, what is the most common real reason people leave?',o:['Low pay','Their manager / poor management','Long commute','The office food'],a:1,e:'文章首句点明：人离开的是管理者，而非工作本身。'},
      {q:'What is a "stay interview"?',o:['An interview after someone quits','A talk asking why a valued employee stays, before they leave','A salary review','A performance warning'],a:1,e:'stay interview 是在员工萌生去意前，主动问其为什么留下的留人面谈。'}]},
  {id:'er_r2',kind:'email',title:'Policy Update: Flexible Work',
   head:{to:'All Staff',from:'People.Team@acme.com',subject:'Updated flexible work policy (effective June 1)'},
   en:'Hi everyone,\nWe are updating our flexible work guidelines, effective June 1:\n- Hybrid staff work in office Tuesday and Wednesday; other days are remote by default.\n- Request occasional fully-remote weeks through your manager at least one week ahead.\n- Client-facing roles keep their current schedule; no change for now.\n- Log core hours 10:00-15:00 so teams can meet live.\nPlease read the full policy on the HR portal. Questions go to people-team@acme.com. Thanks, People Team',
   zh:'各位好，\n我们更新了弹性工作指引，6 月 1 日起生效：\n- 混合办公同事周二、周三到办公室；其余天数默认远程。\n- 如需偶发的整周远程，请至少提前一周经经理申请。\n- 面向客户的岗位维持现有安排，暂不变动。\n- 核心时段 10:00-15:00 在线，以便团队实时碰面。\n请在 HR 门户阅读完整政策。问题请发 people-team@acme.com。谢谢，People 团队',
   voc:[{w:'flexible work',p:'n.',zh:'弹性工作'},{w:'hybrid',p:'adj.',zh:'混合办公的'},{w:'remote',p:'adj.',zh:'远程的'},{w:'core hours',p:'n.',zh:'核心时段'},{w:'by default',p:'phr.',zh:'默认'},{w:'guideline',p:'n.',zh:'指引、准则'}],
   q:[{q:'Which two days are in-office for hybrid staff?',o:['Monday and Friday','Tuesday and Wednesday','Thursday and Saturday','Every day'],a:1,e:'邮件写明周二周三到岗。'},
      {q:'When should fully-remote weeks be requested?',o:['On the day','At least one week ahead','Never','After the fact'],a:1,e:'需至少提前一周经经理申请。'}]}

 units:[
 {id:'er1',lv:1,t:'请假与考勤沟通',en:'Leave & Attendance',
  scene:'向上级和 HR 请病假、事假、调休，说明原因、时长和工作交接。这是最实用、最该优先练熟的一组表达。',
  dlg:[
   {s:'Employee',en:"Morning. I'm not feeling well — I think I've caught a stomach bug. I'd like to take today off as sick leave.",zh:'早上好。我不太舒服——我想我是肠胃感染了。我想今天请病假。'},
   {s:'Manager',b:1,en:"Sorry to hear that. Take the rest you need. Do you have anything urgent on your plate today?",zh:'很遗憾听到这个。好好休息。你今天手头有什么紧急的事吗？'},
   {s:'Employee',en:"Just the client call at two. I've already asked Tom to cover it and sent him my notes.",zh:'只有下午两点的客户电话。我已经请 Tom 顶替，并把我的笔记发给他了。'},
   {s:'Manager',b:1,en:"Perfect, that's well handled. Do you need a doctor's note?",zh:'很好，处理得很到位。你需要开病假条吗？'},
   {s:'Employee',en:"Only if it's more than one day, right? I'll get one if I'm still out tomorrow.",zh:'超过一天才需要，对吧？如果明天还不能上班我就去开。'},
   {s:'Manager',b:1,en:"That's right. Anything beyond two consecutive days needs medical documentation.",zh:'没错。连续超过两天就需要医疗证明。'},
   {s:'Employee',en:"Understood. I'll submit the leave request in the system before noon.",zh:'明白。我会在中午前在系统里提交请假申请。'},
   {s:'Manager',b:1,en:"Sounds good. And by the way, you still have two days of time off in lieu from the overtime last month.",zh:'好的。顺便说一句，上个月加班还剩两天调休没用。'},
   {s:'Employee',en:"Thanks for reminding me. I'll plan to use them before they expire.",zh:'谢谢提醒。我会在过期前安排用掉。'}],
  voc:[
   {w:'sick leave',p:'n.',zh:'病假',ex:'She is on sick leave until Friday.',exzh:'她休病假到周五。'},
   {w:'on your plate',p:'phr.',zh:'手头有（待办事项）',ex:'What do you have on your plate this week?',exzh:'你这周手头有什么任务？'},
   {w:'cover for someone',p:'phr.v.',zh:'替某人顶班/代管',ex:'Can you cover for me on Thursday?',exzh:'周四你能替我一下吗？'},
   {w:"doctor's note",p:'n.',zh:'病假条、医生证明',ex:"HR requires a doctor's note after two days.",exzh:'超过两天 HR 会要求提供病假条。'},
   {w:'leave request',p:'n.',zh:'请假申请',ex:'Submit your leave request in advance.',exzh:'请提前提交请假申请。'},
   {w:'time off in lieu (TOIL)',p:'n.',zh:'调休',ex:'Overtime is compensated with time off in lieu.',exzh:'加班以调休方式补偿。'},
   {w:'expire',p:'v.',zh:'过期、失效',ex:'Your leave balance expires in March.',exzh:'您的假期余额在三月过期。'},
   {w:'handover',p:'n.',zh:'工作交接',ex:'Please prepare a handover note before your leave.',exzh:'请假前请准备一份交接说明。'}],
  sen:[
   {en:"I've already asked Tom to cover it and sent him my notes.",zh:'我已经请 Tom 顶替，并把我的笔记发给他了。',
    parts:[{t:'现在完成',c:"I've already asked… and sent… —— 一个 have 带两个过去分词（asked / sent），第二个 have 省略"},{t:'使役',c:'ask sb <b>to do</b> sth —— ask 后接不定式，不能说 ask him cover'},{t:'双宾',c:'sent him my notes = sent my notes to him'}],
    tip:'请假的黄金句式：<b>说明情况 + 已做的交接安排</b>。主动说出 I\'ve asked X to cover it，会让上级立刻放心，比单纯说 I\'m sick 专业十倍。'},
   {en:"Anything beyond two consecutive days needs medical documentation.",zh:'连续超过两天就需要医疗证明。',
    parts:[{t:'不定代词作主语',c:'Anything beyond… 作主语时视为<b>单数</b>，所以谓语用 needs 而非 need'},{t:'介词',c:'beyond = 超过（等同 more than，但更正式）'},{t:'名词化',c:'medical documentation 比 a paper from the doctor 更书面、更专业'}],
    tip:'<b>anything / everything / nothing 作主语一律视作单数</b>：Everything is ready ✔ / Everything are ready ✘。这类主谓一致错误在口语中特别容易暴露。'}],
  qz:[
   {q:'"What do you have on your plate?" 是在问？',o:['你盘子里有什么菜','你手头有哪些工作','你想吃什么','你带了什么'],a:1,e:'on one\'s plate = 手头的任务量。'},
   {q:'"Can you cover for me on Thursday?" 意思是？',o:['你能替我值班/顶一下吗','你能替我付钱吗','你能帮我盖住吗','你能保护我吗'],a:0,e:'cover for sb = 在某人缺席时代其履职。'},
   {q:'"time off in lieu" 指？',o:['带薪年假','以调休替代加班费','无薪假','病假'],a:1,e:'in lieu of = 代替；TOIL 即加班换调休。'},
   {q:'"Anything beyond two days ___ documentation." 应填？',o:['need','needs','needing','to need'],a:1,e:'anything 作主语视为单数，谓语用第三人称单数。'},
   {q:'"I\'ve asked Tom ___ it." 应填？',o:['cover','to cover','covering','covers'],a:1,e:'ask sb to do sth 是固定结构。'}],
  spk:[0,2,6,8]},

 {id:'er2',lv:2,t:'员工投诉与调查访谈',en:'Grievance & Investigation',
  scene:'员工提出对同事行为的投诉，HR 进行调查访谈：保持中立、保密、只问事实。措辞稍有偏差就可能引发二次纠纷。',
  dlg:[
   {s:'HR',en:"Thank you for coming in. Before we start, I want to explain how this process works so there are no surprises.",zh:'谢谢你来。开始之前，我想说明一下流程是怎样的，以免让你感到意外。'},
   {s:'Employee',b:1,en:"I'd appreciate that. Honestly, I'm worried about retaliation.",zh:'那太好了。说实话，我担心会被报复。'},
   {s:'HR',en:"That concern is taken seriously. Retaliation is a separate and serious violation of our policy, regardless of what this investigation finds.",zh:'这个顾虑我们会认真对待。无论调查结果如何，报复行为本身都是对公司政策的另一项严重违反。'},
   {s:'Employee',b:1,en:"That's reassuring. So what happens with what I tell you today?",zh:'这让我安心一些。那我今天说的内容会如何处理？'},
   {s:'HR',en:"I'll keep it confidential on a need-to-know basis. I may need to share specific details with the investigator, but not with your team.",zh:'我会在「必要知悉」的范围内保密。我可能需要向调查人员分享具体细节，但不会告诉你的团队。'},
   {s:'Employee',en:"Okay. On March twelfth, during the team meeting, he interrupted me repeatedly and made a comment about my accent.",zh:'好。三月十二日团队会议上，他多次打断我，并对我的口音发表了评论。'},
   {s:'HR',b:1,en:"Can you recall his exact words, as closely as possible? And was anyone else present?",zh:'你能尽可能准确地回忆他的原话吗？当时还有其他人在场吗？'},
   {s:'Employee',en:"He said, 'Maybe say it again in Chinese, we'd understand better.' Four people were in the room.",zh:'他说：「也许你用中文再说一遍，我们会更容易懂。」当时房间里有四个人。'},
   {s:'HR',b:1,en:"Thank you. I'm not going to draw any conclusions today — my role is to gather facts and let the process run its course.",zh:'谢谢。我今天不会下任何结论——我的职责是收集事实，让流程正常走完。'}],
  voc:[
   {w:'grievance',p:'n.',zh:'（正式）申诉、投诉',ex:'He filed a formal grievance last week.',exzh:'他上周提交了正式申诉。'},
   {w:'retaliation',p:'n.',zh:'报复',ex:'Retaliation against complainants is prohibited.',exzh:'禁止对投诉人实施报复。'},
   {w:'regardless of',p:'phr.',zh:'不论、无论',ex:'Regardless of the outcome, the policy applies.',exzh:'无论结果如何，该政策都适用。'},
   {w:'confidential',p:'adj.',zh:'保密的',ex:'This conversation is confidential.',exzh:'这次谈话是保密的。'},
   {w:'need-to-know basis',p:'n.',zh:'必要知悉原则',ex:'Information is shared on a need-to-know basis.',exzh:'信息仅在必要知悉范围内共享。'},
   {w:'recall',p:'v.',zh:'回忆起',ex:'Can you recall the exact date?',exzh:'你能回忆起确切日期吗？'},
   {w:'draw a conclusion',p:'phr.',zh:'下结论',ex:'It is too early to draw conclusions.',exzh:'现在下结论为时过早。'},
   {w:'run its course',p:'phr.',zh:'（让流程）走完、自然发展',ex:'Let the process run its course.',exzh:'让流程正常走完。'}],
  sen:[
   {en:"Retaliation is a separate and serious violation of our policy, regardless of what this investigation finds.",zh:'无论本次调查结果如何，报复行为本身都是对公司政策的另一项严重违反。',
    parts:[{t:'并列形容词',c:'a separate <b>and</b> serious violation —— 两个形容词共用一个冠词，修饰同一名词'},{t:'搭配',c:'a violation <b>of</b> our policy（违反…用介词 of）'},{t:'让步状语',c:'regardless of + 名词性从句 what this investigation finds —— of 后必须接名词性成分，从句用陈述语序'}],
    tip:'注意 <b>regardless of</b> 后不能直接跟完整句子，必须是名词或名词从句。要接句子请用 no matter what / whatever。'},
   {en:"I'm not going to draw any conclusions today — my role is to gather facts and let the process run its course.",zh:'我今天不会下任何结论——我的职责是收集事实，让流程正常走完。',
    parts:[{t:'将来意图',c:"I'm not going to… —— be going to 表明确意图/计划，比 will 更强调「我打算这么做」"},{t:'表语不定式',c:'my role is <b>to gather</b>… <b>and</b> (to) let… —— 两个不定式并列，第二个 to 可省'},{t:'使役',c:'let sth do sth —— let 后接<b>动词原形</b>，不加 to'}],
    tip:'HR 调查的三句护身符：<b>I\'m here to gather facts / I won\'t draw conclusions today / This is confidential on a need-to-know basis.</b> 背下来能保护自己也保护当事人。'}],
  qz:[
   {q:'"on a need-to-know basis" 意思是？',o:['需要知道的时候再说','仅在必要知悉的范围内共享','公开告知所有人','需要申请才能知道'],a:1,e:'信息只提供给因职责必须知晓的人。'},
   {q:'"regardless of what this investigation finds" 中 regardless of 后接？',o:['完整句子','名词或名词性从句','动词原形','形容词'],a:1,e:'regardless of 是介词短语，后接名词性成分。'},
   {q:'"Let the process run its course." 意思是？',o:['让流程加速','让流程按既定方式走完','停止流程','改变流程'],a:1,e:'run its course = 顺其自然地完成既定过程。'},
   {q:'"my role is to gather facts and ___ the process run its course." 应填？',o:['to letting','let','letting','lets'],a:1,e:'与前面的 to gather 并列，第二个 to 省略，用动词原形 let。'},
   {q:'"He filed a formal grievance." 意思是？',o:['他归档了文件','他提交了正式申诉','他很悲伤','他填了表格'],a:1,e:'file a grievance = 正式提出申诉。'}],
  spk:[0,2,4,8]},

 {id:'er3',lv:3,t:'解雇面谈与合规风险',en:'Termination & Compliance',
  scene:'执行解雇面谈：告知决定、说明补偿、处理情绪、规避法律风险。每一句话都可能成为呈堂证据——这是 HR 英语中风险最高、措辞最讲究的场景。',
  dlg:[
   {s:'HR',en:"I've asked you here to inform you of a decision that has already been made, and I want to walk you through it carefully.",zh:'我请你来是要告知你一个已经作出的决定，我会仔细地向你说明。'},
   {s:'Employee',b:1,en:"Already been made? So there's nothing to discuss?",zh:'已经作出了？所以没有讨论余地了？'},
   {s:'HR',en:"The decision to eliminate the position is final. What we can discuss is the transition — timing, severance, and support.",zh:'撤销该岗位的决定是最终的。我们可以讨论的是过渡安排——时间、遣散和支持。'},
   {s:'Employee',b:1,en:"Is this about my performance? Because my last review said I met expectations.",zh:'这跟我的绩效有关吗？因为我上次评估是「达到预期」。'},
   {s:'HR',en:"To be clear, this is a role elimination, not a performance decision. Your review record stands as it is.",zh:'明确地说，这是岗位撤销，不是绩效决定。你的评估记录保持原样。'},
   {s:'Employee',b:1,en:"What does the package look like?",zh:'补偿方案是什么样的？'},
   {s:'HR',en:"Statutory severance based on your seven years of service, plus one additional month as a goodwill payment, and outplacement support for three months.",zh:'基于你七年司龄的法定经济补偿，外加一个月作为额外的善意补偿，以及三个月的再就业支持。'},
   {s:'Employee',en:"I'd like to have this reviewed before I sign anything.",zh:'在我签任何东西之前，我想让人先审阅一下。'},
   {s:'HR',b:1,en:"That's entirely your right, and I'd encourage it. There's no pressure to sign today; the offer stays open for fourteen days.",zh:'这完全是你的权利，我也鼓励你这么做。今天没有签字压力；这份方案十四天内有效。'},
   {s:'Employee',en:"Alright. Can you put everything we discussed in writing?",zh:'好吧。你能把我们讨论的一切都写成书面文件吗？'}],
  voc:[
   {w:'inform someone of',p:'v.',zh:'正式告知某人',ex:'We must inform employees of any change in terms.',exzh:'条款有任何变动我们都必须正式告知员工。'},
   {w:'role elimination',p:'n.',zh:'岗位撤销（区别于绩效解雇）',ex:'This is a role elimination, not a dismissal for cause.',exzh:'这是岗位撤销，而非因过失解雇。'},
   {w:'severance',p:'n.',zh:'遣散费、经济补偿',ex:'Severance is calculated by years of service.',exzh:'经济补偿按服务年限计算。'},
   {w:'statutory',p:'adj.',zh:'法定的',ex:'Statutory notice is thirty days.',exzh:'法定通知期为三十天。'},
   {w:'goodwill payment',p:'n.',zh:'善意补偿（法定之外的额外补偿）',ex:'The extra month is a goodwill payment.',exzh:'多出的一个月属于善意补偿。'},
   {w:'outplacement',p:'n.',zh:'再就业支持服务',ex:'Outplacement includes coaching and CV support.',exzh:'再就业支持包含辅导与简历服务。'},
   {w:'stand as it is',p:'phr.',zh:'保持原样、维持不变',ex:'The agreement stands as it is.',exzh:'该协议保持原样有效。'},
   {w:'stay open',p:'phr.',zh:'（要约）保持有效',ex:'The offer stays open until Friday.',exzh:'该要约有效期至周五。'}],
  sen:[
   {en:"I've asked you here to inform you of a decision that has already been made, and I want to walk you through it carefully.",zh:'我请你来是要告知你一个已经作出的决定，我会仔细地向你说明。',
    parts:[{t:'现在完成',c:"I've asked you here —— 说明「此刻你在这里」的原因，比 I asked 更贴近当下"},{t:'目的状语',c:'to inform you of… —— 不定式表目的；inform sb <b>of</b> sth 是固定搭配'},{t:'定语从句',c:'a decision <b>that has already been made</b> —— 现在完成时被动，强调「已成事实」，同时不指明决策人'},{t:'并列',c:'and I want to walk you through it —— 先立场后关怀，顺序不能颠倒'}],
    tip:'解雇面谈开场的<b>唯一正确结构</b>：明确「决定已作出」+ 不指明具体决策人（被动语态）+ 承诺充分说明。任何暗示「还可商量」的措辞，都会带来后续纠纷。'},
   {en:"To be clear, this is a role elimination, not a performance decision. Your review record stands as it is.",zh:'明确地说，这是岗位撤销，不是绩效决定。你的评估记录保持原样。',
    parts:[{t:'澄清句',c:'To be clear, … —— 用于纠正误解、划清边界，语气坚定但不攻击'},{t:'对比否定',c:'this is A, not B —— 直接否定对方的错误归因，避免日后被主张「绩效歧视」'},{t:'固定表达',c:'stands as it is = 维持原状不变（stand 此处意为「有效、成立」）'}],
    tip:'合规红线：<b>绝不能把「岗位撤销」和「绩效不佳」混为一谈</b>。一旦措辞含糊，员工可主张公司以绩效为名行歧视之实。To be clear 这个短语在此就是法律防火墙。'}],
  qz:[
   {q:'"This is a role elimination, not a dismissal for cause." 强调？',o:['是因过失被开除','是岗位撤销而非因个人过错解雇','是自愿离职','是转岗'],a:1,e:'区分二者对补偿标准和法律风险有决定性影响。'},
   {q:'"inform you ___ a decision" 应填？',o:['about','of','to','for'],a:1,e:'inform sb of sth 是标准搭配（inform sb about 也可，但 of 更正式）。'},
   {q:'"The offer stays open for fourteen days." 意思是？',o:['办公室开放两周','该方案十四天内有效','要开十四天会','公开招聘十四天'],a:1,e:'stay open = （要约/职位）保持有效、可接受。'},
   {q:'"Your review record stands as it is." 意思是？',o:['你的记录要重写','你的记录维持原样不变','你的记录被删除','你要站着看记录'],a:1,e:'stand as it is = 保持现状、维持有效。'},
   {q:'"a decision that has already been made" 使用被动语态的主要用意是？',o:['语法要求','不指明具体决策人，降低对立与法律风险','显得更长','表示将来'],a:1,e:'被动语态回避责任主体，是高风险沟通的标准做法。'}],
  spk:[0,2,4,8]},

 {id:'er4',lv:2,t:'离职面谈与经验沉淀',en:'Exit Interview',
  scene:'一位骨干员工提出离职，HR 做离职面谈：不走过场，收集真实原因与可落地的改进建议，为团队留存经验。',
  dlg:[
   {s:'HR',en:"Before your last day, I'd love to do a proper exit interview — not a formality, but a real conversation about what worked and what didn't.",zh:'在离职前，我想认真做一次离职面谈——不是走流程，而是好好聊聊哪些做得好、哪些没做好。'},
   {s:'Employee',b:1,en:"I appreciate that. Honestly, the main reason is the lack of a clear growth path. I kept asking about a promotion, but nothing moved.",zh:'谢谢。说实话，主要原因是没有清晰的成长路径。我一直问晋升的事，但毫无进展。'},
   {s:'HR',en:"That's hard to hear, and it's useful. Were there other factors — workload, your manager, or the team?",zh:'听到这个我不好受，但也很有价值。还有别的因素吗——工作量、你的经理，还是团队？'},
   {s:'Employee',b:1,en:"Workload was fine, and my manager was supportive. It was really the career stuckness.",zh:'工作量没问题，经理也很支持。主要是职业停滞。'},
   {s:'HR',en:"If we had opened a development plan six months ago, would that have changed your mind?",zh:'如果我们半年前就启动了发展计划，会改变你的想法吗？'},
   {s:'Employee',b:1,en:"Probably, yes. I wasn't asking to be promoted tomorrow — just to see a route.",zh:'大概率会。我不是要求明天就升职——只是想看到一条路。'},
   {s:'HR',en:"Noted. Is there anything we should fix so the next person doesn't hit the same wall?",zh:'记下了。有什么该改的，好让下一个人别撞同一堵墙？'},
   {s:'Employee',b:1,en:"Make the growth criteria transparent. Right now it feels like a black box.",zh:'把成长的标准透明化。现在感觉像个黑箱。'},
   {s:'HR',en:"That's concrete and fair. I'll raise it with your old manager and the leadership team.",zh:'这很具体也很合理。我会跟你的前任经理和领导团队提出来。'}],
  voc:[
   {w:'exit interview',p:'n.',zh:'离职面谈',ex:'We run an exit interview in the final week.',exzh:'我们在最后一周做离职面谈。'},
   {w:'formality',p:'n.',zh:'形式、走流程',ex:'This is not just a formality.',exzh:'这不只是走个过场。'},
   {w:'growth path',p:'n.',zh:'成长路径',ex:'He left for lack of a growth path.',exzh:'他因没有成长路径而离职。'},
   {w:'career stuckness',p:'n.',zh:'职业停滞',ex:'Career stuckness drove the exit.',exzh:'职业停滞导致了离职。'},
   {w:'development plan',p:'n.',zh:'发展计划',ex:'Open a development plan early.',exzh:'尽早启动发展计划。'},
   {w:'transparent',p:'adj.',zh:'透明的',ex:'Make the criteria transparent.',exzh:'把标准透明化。'},
   {w:'black box',p:'n.',zh:'黑箱、不透明机制',ex:'The process feels like a black box.',exzh:'这个流程像个黑箱。'},
   {w:'raise it',p:'phr.',zh:'提出（议题）',ex:'I will raise it with the team.',exzh:'我会向团队提出这件事。'}],
  sen:[
   {en:"I kept asking about a promotion, but nothing moved.",zh:'我一直问晋升的事，但毫无进展。',
    parts:[{t:'持续动作',c:'kept + asking —— kept 后接动名词，强调"反复问、一直问"且结果落空'},{t:'转折',c:'but nothing moved = 但（事情）毫无进展，move 在此指"有推进"'},{t:'对比',c:'比单纯 I asked 更能传达"诉求石沉大海"的挫败感'}],
    tip:'职场里 <b>kept + doing</b> 描述"持续做某事"是高频结构。I kept asking but nothing moved 是表达"诉求无回音"的绝佳句式，比 I asked many times 更自然。'},
   {en:"Make the growth criteria transparent. Right now it feels like a black box.",zh:'把成长的标准透明化。现在感觉像个黑箱。',
    parts:[{t:'祈使句',c:'Make the growth criteria transparent = 把标准透明化（祈使句直接提要求）'},{t:'比喻',c:"feels like a black box = 感觉像个黑箱（输入可见、过程不可见、结果不可预期）"}],
    tip:'<b>black box</b>（黑箱）是管理沟通里的绝佳比喻，形容不透明流程。用 feels like a black box 比说 it\'s unclear 生动十倍，外籍同事一听就懂。'}],
  qz:[
   {q:'"exit interview" 通常是？',o:['入职培训','员工离职前的面谈','年度旅游','绩效考核'],a:1,e:'exit interview 是离职面谈，收集反馈。'},
   {q:'"nothing moved" 在语境中意思是？',o:['有人升职了','事情毫无进展','搬了办公室','换了岗位'],a:1,e:'move 此处指"有推进"，nothing moved = 毫无进展。'},
   {q:'"career stuckness" 指？',o:['职业高速发展','职业停滞','职业规划','职业转型'],a:1,e:'stuckness = 停滞不前。'},
   {q:'"Make the growth criteria transparent." 中 transparent 意思是？',o:['复杂的','透明的、公开的','困难的','临时的'],a:1,e:'transparent = 透明、公开可见。'},
   {q:'"feels like a black box" 比喻？',o:['流程透明','过程不透明、结果不可预期','速度很快','很安全'],a:1,e:'black box 喻指黑箱/不透明机制。'}],
  spk:[0,2,5,7]},

 {id:'er5',lv:3,t:'灵活用工与分类合规',en:'Contingent Workforce',
  scene:'HR 与用人经理确认一名外包/顾问的用工分类，避免"假外包真雇佣"的合规风险。法律看的是"怎么用工"，不是"怎么签合同"。',
  dlg:[
   {s:'Manager',en:"I want to bring in a contractor for the six-month project — can we just put them on a fixed-term contract?",zh:'我想为这个六个月的 Project 请个合同工——直接签固定期限合同行吗？'},
   {s:'HR',b:1,en:"We can, but classification matters. If they work like our employees — same hours, our tools, our manager — a fixed-term label won't protect us.",zh:'可以，但分类定性很重要。如果他们用工方式像我们的员工——同样的工时、用我们的工具、归我们的经理管——光贴个固定期限标签保护不了我们。'},
   {s:'Manager',en:"What's the risk exactly?",zh:'具体有什么风险？'},
   {s:'HR',b:1,en:"Misclassification. If they're really controlled by us, labor law may treat them as employees, with back pay, benefits, and penalties.",zh:'错误分类。如果他们实际上是受我们控制的，劳动法可能把他们视作员工，要补发工资、补缴福利，还有罚款。'},
   {s:'Manager',en:"So how do we stay clean?",zh:'那我们怎么合规？'},
   {s:'HR',b:1,en:"Use a registered agency for true contractors, or keep them genuinely independent — their own tools, their own method, multiple clients.",zh:'真外包就走注册中介，或者让他们真正独立——用自己的工具、自己的方法、服务多个客户。'},
   {s:'Manager',en:"What if the project needs them daily in our office?",zh:'如果 Project 需要他们每天来我们办公室呢？'},
   {s:'HR',b:1,en:"Then they look like employees, and we should hire. Don't dress a worker as a contractor to skip benefits.",zh:'那他们看起来就是员工了，我们应该正式雇佣。别把工人伪装成合同工来规避福利。'},
   {s:'Manager',en:"Fair. I'll route it through procurement with the agency option.",zh:'有道理。我会走采购通道，用中介方案。'}],
  voc:[
   {w:'contractor',p:'n.',zh:'承包商/合同工',ex:'We hired a contractor for the project.',exzh:'我们为项目请了个合同工。'},
   {w:'fixed-term contract',p:'n.',zh:'固定期限合同',ex:'A fixed-term contract has an end date.',exzh:'固定期限合同有明确的结束日。'},
   {w:'classification',p:'n.',zh:'分类、定性',ex:'Worker classification is a compliance issue.',exzh:'用工分类是个合规问题。'},
   {w:'misclassification',p:'n.',zh:'（用工）错误分类',ex:'Misclassification triggers penalties.',exzh:'错误分类会触发罚款。'},
   {w:'back pay',p:'n.',zh:'补发工资',ex:'They may owe back pay.',exzh:'他们可能要补发工资。'},
   {w:'registered agency',p:'n.',zh:'注册外包机构',ex:'Use a registered agency for contractors.',exzh:'真外包就走注册机构。'},
   {w:'genuinely independent',p:'phr.',zh:'真正独立',ex:'Keep them genuinely independent.',exzh:'让他们真正独立。'},
   {w:'procurement',p:'n.',zh:'采购',ex:'Route it through procurement.',exzh:'走采购通道处理。'}],
  sen:[
   {en:"If they work like our employees — same hours, our tools, our manager — a fixed-term label won't protect us.",zh:'如果他们用工方式像我们的员工——同样的工时、用我们的工具、归我们的经理管——光贴个固定期限标签保护不了我们。',
    parts:[{t:'条件从句',c:'If they work like our employees —— 引出前提'},{t:'插入解释',c:'same hours, our tools, our manager —— 三个并列名词短语，具体界定"像员工"的表现'},{t:'主句',c:'a fixed-term label won\'t protect us = 固定期限标签保护不了我们'}],
    tip:'用工合规的<b>实质重于形式</b>原则：法律看的是"你怎么用工"，不是"你怎么签合同"。a label won\'t protect us 这句提醒——贴标签没用，看实质。'},
   {en:"Don't dress a worker as a contractor to skip benefits.",zh:'别把工人伪装成合同工来规避福利。',
    parts:[{t:'祈使否定',c:"Don't dress a worker as a contractor = 别把工人伪装成合同工（ dress A as B 把A扮成B）"},{t:'目的',c:'to skip benefits = 目的是规避福利成本'}],
    tip:'<b>dress A as B</b> 是地道比喻，指"把A伪装/包装成B"。to skip benefits = 为了省下福利支出。整句是对"假外包真雇佣"的直白警告。'}],
  qz:[
   {q:'"classification" 在用工场景指？',o:['培训','用工性质/分类定性','招聘','工资条'],a:1,e:'classification 此处指把人定性为员工还是合同工。'},
   {q:'"Misclassification" 可能带来？',o:['奖金','补发工资、补缴福利与罚款','升职','表扬'],a:1,e:'错误分类会被认定为事实劳动关系，补薪补福利加罚款。'},
   {q:'"a fixed-term label won\'t protect us" 强调？',o:['合同名称最重要','用工实质重于合同形式','签长期合同就好','不用管'],a:1,e:'法律看实质用工，不看标签。'},
   {q:'"keep them genuinely independent" 指？',o:['让他们每天来公司','让他们真正独立（自备工具、方法、多客户）','让他们汇报给经理','让他们用公司系统'],a:1,e:'真正独立才不构成事实雇佣。'},
   {q:'"Don\'t dress a worker as a contractor" 中 dress as 意思是？',o:['给工人买衣服','把…伪装成','培训工人','解雇工人'],a:1,e:'dress A as B = 把A伪装/包装成B。'}],
  spk:[0,3,6,7]}
]},
{id:'pillar',name:'HR三支柱',en:'HR Three-Pillar Model',
 icon:'<svg class="ic l" viewBox="0 0 24 24"><path d="M4 21V8M12 21V4M20 21V11"/><path d="M2 8h4M10 4h4M18 11h4"/></svg>',
 rd:[
  {id:'pl_r1',kind:'article',title:'What the Three-Pillar Model Actually Fixes',
   en:'Traditional HR often splits by function — recruiting here, payroll there — leaving managers to chase many contacts for one problem. The three-pillar model reorganizes HR around the manager and employee instead. HRBP (Business Partner) sits close to the business, translating strategy into people actions and coaching managers on the ground. COE (Center of Expertise) holds the deep specialist knowledge — compensation design, employment law, leadership frameworks — and builds the playbooks others use. SSC (Shared Service Center) handles the high-volume, repeatable transactions: onboarding paperwork, payroll runs, routine queries. The model works only when the boundaries are clear: COE designs, SSC delivers, HRBP applies. When they blur, the same work gets done twice or dropped entirely.',
   zh:'传统 HR 常按职能切分——招聘在这里、薪酬在那里——让管理者为一个问题要找好多人。三支柱模型改为围绕管理者和员工重组 HR。HRBP（业务伙伴）贴近业务，把战略转化为人员行动，并在一线辅导管理者。COE（专家中心）掌握深厚的专业知识——薪酬设计、雇佣法、领导力框架——并搭建他人使用的操作手册。SSC（共享服务中心）处理量大、可重复的事务：入职文书、发薪运转、常规咨询。这个模型只有在边界清晰时才有效：COE 设计，SSC 交付，HRBP 落地。边界一旦模糊，同样的工作会被做两遍，或干脆被漏掉。',
   voc:[{w:'three-pillar',p:'adj.',zh:'三支柱的'},{w:'HRBP',p:'n.',zh:'HR 业务伙伴'},{w:'COE',p:'n.',zh:'专家中心'},{w:'SSC',p:'n.',zh:'共享服务中心'},{w:'playbook',p:'n.',zh:'操作手册、打法'},{w:'boundaries',p:'n.',zh:'边界'}],
   q:[{q:'In the three-pillar model, who sits closest to the business and coaches managers?',o:['SSC','HRBP','COE','IT'],a:1,e:'HRBP 贴近业务，做管理者教练。'},
      {q:'Which pillar handles payroll runs and routine queries?',o:['COE','HRBP','SSC','Finance'],a:2,e:'SSC 处理高频重复性事务，如发薪与常规咨询。'}]},
  {id:'pl_r2',kind:'email',title:'Memo: New HR Support Routing',
   head:{to:'All Managers',from:'HR.Operations@acme.com',subject:'How to reach HR — three routes'},
   en:'Hi managers,\nFrom next month, route HR requests as follows:\n- People or strategy questions (hiring plan, org change): contact your HRBP.\n- Policy or design questions (pay bands, legal): contact COE via the HR portal.\n- Transactions (payslip, badge, name change): use the SSC self-service portal.\nThis keeps experts on expert work and gets you faster answers. Questions: hr-ops@acme.com.\nBest, HR Operations',
   zh:'各位经理好，\n从下月起，HR 需求按如下路径分派：\n- 人员或战略问题（招聘计划、组织变更）：联系你的 HRBP。\n- 政策或设计问题（薪酬带宽、法律）：通过 HR 门户联系 COE。\n- 事务类（工资单、工牌、改名）：使用 SSC 自助门户。\n这样让专家专注于专业工作，也能让你更快得到答复。问题请发 hr-ops@acme.com。\n祝好，HR Operations',
   voc:[{w:'route',p:'v.',zh:'分派、转接'},{w:'org change',p:'n.',zh:'组织变更'},{w:'pay bands',p:'n.',zh:'薪酬带宽'},{w:'self-service',p:'adj.',zh:'自助的'},{w:'payslip',p:'n.',zh:'工资单'},{w:'HRBP',p:'n.',zh:'HR 业务伙伴'}],
   q:[{q:'Where do you send a hiring-plan question?',o:['SSC portal','Your HRBP','COE','IT helpdesk'],a:1,e:'业务/人员问题找 HRBP。'},
      {q:'A payslip question goes to?',o:['HRBP','COE','SSC self-service portal','Legal'],a:2,e:'交易类事务走 SSC 自助平台。'}]}
 ],
 units:[
 {id:'pl1',lv:1,t:'HRBP业务巡检',en:'HRBP Check-in',
  scene:'HRBP 与业务经理做月度沟通，了解团队状态、风险与人才需求。这是 HRBP 最日常、也最该练熟的一段对话。',
  dlg:[
   {s:'HRBP',en:"Hi Marco, monthly check-in — how's the team feeling after the reorg?",zh:'嗨 Marco，月度对接——重组之后团队状态怎么样？'},
   {s:'Manager',b:1,en:"Mixed. The new structure is clearer, but two seniors are overloaded and one is quietly looking.",zh:'喜忧参半。新结构更清晰了，但两个资深同事超负荷，还有一个在暗自看机会。'},
   {s:'HRBP',en:"Thanks for the candor. The two overloaded — is it volume or a skill gap?",zh:'谢谢你的坦诚。那两个超负荷的——是工作量问题还是能力缺口？'},
   {s:'Manager',b:1,en:"Mostly volume. We shipped two products ahead of schedule.",zh:'主要是量。我们提前交付了两个产品。'},
   {s:'HRBP',en:"Then it's a capacity issue, not a capability one. Can we move one junior from the slower pod?",zh:'那是产能问题，不是能力问题。我们能从进度慢的小组调一个初级过来吗？'},
   {s:'Manager',b:1,en:"That could work. I'll talk to their lead.",zh:'可以。我去跟他们的负责人谈。'},
   {s:'HRBP',en:"And the one quietly looking — any idea what's pulling them?",zh:'那个暗自看机会的——知道是什么在拉他走吗？'},
   {s:'Manager',b:1,en:"I think it's the lack of a next step. He's been a senior for four years.",zh:'我想是缺一个下一步。他做资深已经四年了。'},
   {s:'HRBP',en:"Let's scope a lead-track role for him. I'll send a draft growth plan Friday.",zh:'咱们给他规划一个后备干部岗位。我这周五发一份成长计划草案。'}],
  voc:[
   {w:'check-in',p:'n.',zh:'（定期）沟通对接',ex:'We do a monthly check-in.',exzh:'我们做月度对接。'},
   {w:'reorg',p:'n.',zh:'（组织）重组',ex:'After the reorg, reporting lines changed.',exzh:'重组后汇报线变了。'},
   {w:'candor',p:'n.',zh:'坦诚',ex:'Thanks for the candor.',exzh:'谢谢你的坦诚。'},

/* ---------------- 状态 ---------------- */
var S=null,curUnit=null,curTab='dlg',quizAns={},quizDone=false,readAns={},vtAns={},vtDone=false,vtQs=[],vtUnit='';
var spkState={unit:null,idx:0,scores:[],rec:null,recording:false};

function today(){var d=new Date();return fmt(d)}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addD(s,n){var d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return fmt(d)}
function diffD(a,b){return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/864e5)}
var _allUnits=null;
function allUnits(){if(!_allUnits){_allUnits=[];COURSE.forEach(function(m){m.units.forEach(function(u){_allUnits.push(Object.assign({mod:m.name,modId:m.id,modEn:m.en},u))})})}return _allUnits}
function findUnit(id){var r=null;allUnits().forEach(function(u){if(u.id===id)r=u});return r}

function defaults(){
  var t=today();
  return {
    goal:{name:'日常职场场景无障碍交流',date:addD(t,100),dailyMin:25,dailyUnits:1,start:t},
    prog:{},words:{},tasks:[],checkin:{},quizLog:[],spkLog:[],read:{},hl:{},
    set:{rate:0.85,autoScore:true,showZh:true},
    seeded:false,created:t
  };
}
function load(){
  try{var r=localStorage.getItem(K);S=r?JSON.parse(r):null}catch(e){S=null}
  if(!S||!S.goal){S=defaults();seed();save()}
  var d=defaults();for(var k in d){if(S[k]===undefined)S[k]=d[k]}
  for(var k2 in d.set){if(S.set[k2]===undefined)S.set[k2]=d.set[k2]}
}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){toast('存储空间不足，请导出备份后清理')}}

/* 预置示例数据（含 1 条逾期） */
function seed(){
  var t=today();
  S.prog['hrp1']={studied:1,quizBest:80,quizDone:1,spkBest:74,last:addD(t,-2),reviewNext:addD(t,-1)};
  S.prog['hrp2']={studied:1,quizBest:60,quizDone:1,spkBest:0,last:addD(t,-1),reviewNext:addD(t,1)};
  S.words={
    'attrition':{w:'attrition',zh:'（自然）流失率',u:'hrp1',box:1,next:addD(t,-3),wrong:2},
    'factor in':{w:'factor in',zh:'把…计入考虑',u:'hrp1',box:2,next:t,wrong:1},
    'fully loaded cost':{w:'fully loaded cost',zh:'全成本（含福利等）',u:'hrp2',box:1,next:t,wrong:1},
    'absorb':{w:'absorb',zh:'消化、吸收（工作量）',u:'hrp2',box:3,next:addD(t,2),wrong:1}
  };
  S.tasks=[
    {id:'t1',txt:'背完「招聘与配置 L1」核心词汇 8 个',due:addD(t,-2),done:0,demo:1},
    {id:'t2',txt:'把绩效面谈常用句练到不看中文能说出',due:t,done:0,demo:1},
    {id:'t3',txt:'周日整体复盘一次，导出备份',due:addD(t,3),done:0,demo:1}

var synth=window.speechSynthesis,curUtter=null;
function speak(text,btn,cb,rate){
  if(!synth){toast('当前浏览器不支持朗读');return}
  synth.cancel();
  document.querySelectorAll('.mini.playing').forEach(function(b){b.classList.remove('playing')});
  var u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=(rate!=null?rate:S.set.rate);u.pitch=1;
  var vs=synth.getVoices(),pick=null;
  for(var i=0;i<vs.length;i++){if(/en[-_]US/i.test(vs[i].lang)&&/(Samantha|Google US|Aria|Jenny|Female|Alex)/i.test(vs[i].name)){pick=vs[i];break}}
  if(!pick)for(var j=0;j<vs.length;j++){if(/^en/i.test(vs[j].lang)){pick=vs[j];break}}
  if(pick)u.voice=pick;
  if(btn)btn.classList.add('playing');
  u.onend=function(){if(btn)btn.classList.remove('playing');if(cb)cb()};
  u.onerror=function(){if(btn)btn.classList.remove('playing')};
  curUtter=u;synth.speak(u);
}

/* 逐词比对打分（LCS） */
function normWords(s){return String(s).toLowerCase().replace(/[^a-z0-9'\s]/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean)}
function scoreSpeech(ref,heard){
  var A=normWords(ref),B=normWords(heard);
  if(!A.length)return{score:0,marks:[]};
  var n=A.length,m=B.length,dp=[];
  for(var i=0;i<=n;i++){dp.push(new Array(m+1).fill(0))}
  for(i=1;i<=n;i++)for(var j=1;j<=m;j++){
    dp[i][j]=A[i-1]===B[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  }
  var marks=new Array(n).fill(false),ii=n,jj=m;
  while(ii>0&&jj>0){
    if(A[ii-1]===B[jj-1]){marks[ii-1]=true;ii--;jj--}
    else if(dp[ii-1][jj]>=dp[ii][jj-1])ii--;else jj--;
  }
  var hit=dp[n][m];
  return{score:Math.round(hit/n*100),marks:marks,hit:hit,total:n};
}

/* ---------------- 今日任务生成 ---------------- */
function buildToday(){
  var t=today(),list=[];
  // 1 自定义任务（逾期自动顺延，不消失）
  S.tasks.forEach(function(x){
    if(x.done)return;
    var od=diffD(x.due,t);
    list.push({k:'task',id:x.id,txt:x.txt,over:od>0,od:od,tag:'自定义',act:null,mod:x.mod||'__none'});
  });
  // 2 到期复习的错词
  var due=Object.keys(S.words).filter(function(w){return diffD(S.words[w].next,t)>=0});
  if(due.length){
    var maxOver=0;due.forEach(function(w){maxOver=Math.max(maxOver,diffD(S.words[w].next,t))});
    list.push({k:'review',txt:'复习到期生词 '+due.length+' 个',over:maxOver>0,od:maxOver,tag:'艾宾浩斯复习',act:'review',mod:'__review'});
  }
  // 3 待学单元
  var us=allUnits(),pend=us.filter(function(u){return !(S.prog[u.id]&&S.prog[u.id].studied)});
  var n=Math.min(S.goal.dailyUnits,pend.length);
  for(var i=0;i<n;i++){
    list.push({k:'unit',id:pend[i].id,txt:'学习：'+pend[i].mod+' · '+pend[i].t,over:false,tag:LVN[pend[i].lv],act:'unit',mod:pend[i].modId});
  }
  // 4 测试未达标 / 口语未达标
  us.forEach(function(u){
    var p=S.prog[u.id];if(!p||!p.studied)return;
    if(p.quizDone&&p.quizBest<80)list.push({k:'requiz',id:u.id,txt:'重测：'+u.t+'（上次 '+p.quizBest+' 分，未达 80）',over:false,tag:'成果测试',act:'quiz',mod:u.modId});
    else if(p.quizDone&&(p.spkBest||0)<75)list.push({k:'spk',id:u.id,txt:'口语跟读：'+u.t+(p.spkBest?'（上次 '+p.spkBest+' 分）':'（未测）'),over:false,tag:'口语测评',act:'spk',mod:u.modId});
  });
  list.sort(function(a,b){return (b.over?1:0)-(a.over?1:0)||(b.od||0)-(a.od||0)});
  return list.slice(0,8);
}

  S.tasks.forEach(function(x){if(x.id===id){x.done=x.done?0:1;if(x.done){var t=today();S.checkin[t]=(S.checkin[t]||0)+5}}});
  save();render();
}

/* ---------------- 渲染：课程 ---------------- */
function modStatus(m){
  var uu=m.units||[];
  var started=uu.some(function(u){var p=S.prog[u.id];return p&&(p.studied||p.quizDone||p.spkBest);})||(m.rd||[]).some(function(r){return S.read[r.id]&&S.read[r.id].done;});
  var allU=uu.length>0&&uu.every(function(u){var p=S.prog[u.id]||{};return p.quizDone&&(p.spkBest>0);});
  var rd=m.rd||[];
  var allR=rd.length===0||rd.every(function(r){return S.read[r.id]&&S.read[r.id].done;});
  return {started:started,complete:allU&&allR};
}
function firstUnitId(m){var uu=(m.units||[]).slice().sort(function(a,b){return a.lv-b.lv});return uu[0]?uu[0].id:'';}
function firstUnfinId(m){var uu=(m.units||[]).slice().sort(function(a,b){return a.lv-b.lv});for(var i=0;i<uu.length;i++){var p=S.prog[uu[i].id]||{};if(!p.quizDone)return uu[i].id;}return uu[0]?uu[0].id:'';}
function renderCourse(){
  var us=allUnits(),done=us.filter(function(u){return S.prog[u.id]&&S.prog[u.id].studied}).length;
  var allRd=COURSE.reduce(function(a,m){return a+(m.rd?m.rd.length:0)},0);
  var rdDone=allRd?Object.keys(S.read).filter(function(k){return S.read[k]&&S.read[k].done}).length:0;
  var h='<div class="card tight"><div class="ch" style="margin-bottom:6px"><h2>'+svg(I.book)+'HR 模块学习路径</h2></div>'+
    '<div class="hint">共 '+us.length+' 个单元 + '+allRd+' 篇阅读。按你自己的节奏、<b>任意顺序</b>学即可；每单元建议路径：<b>对话 → 阅读 → 词汇 → 长难句 → 成果测试 → 口语跟读</b>，模块内按 L1→L3 难度递进。已学 '+done+'/'+us.length+' 单元，阅读 '+rdDone+'/'+allRd+' 篇。</div></div>';

  COURSE.forEach(function(m){
    var uu=m.units.slice().sort(function(a,b){return a.lv-b.lv});
    var dn=uu.filter(function(u){return S.prog[u.id]&&S.prog[u.id].studied}).length;
    var ms=modStatus(m);
    var pill;
    if(ms.complete)pill='<button class="mpill end" onclick="openUnit(\''+firstUnitId(m)+'\')">结束学习</button>';
    else if(ms.started)pill='<button class="mpill doing" onclick="openUnit(\''+firstUnfinId(m)+'\')">学习中</button>';
    else pill='<button class="mpill start" onclick="openUnit(\''+firstUnitId(m)+'\')">开始学习</button>';
    h+='<div class="mod"><div class="modh"><div class="modi">'+m.icon+'</div>'+
      '<div class="modt"><b>'+m.en+'</b><span>'+m.name+'</span></div>'+
      '<div class="modp">'+dn+'/'+uu.length+'</div>'+pill+'</div>';
    if(m.rd&&m.rd.length)h+='<button class="rdlink" onclick="openUnit(\''+(uu[0]?uu[0].id:'')+'\',\'read\')">'+svg(I.book,'s')+' 阅读 '+m.rd.length+' 篇（短文 + 邮件）→</button>';
    h+='<div class="path">';
    uu.forEach(function(u,idx){
      var p=S.prog[u.id]||{};
      var st=p.quizDone?'done':p.studied?'studied':'todo';
      h+='<button class="punit '+st+'" onclick="openUnit(\''+u.id+'\')">'+
        '<div class="pdot"></div>'+
        '<div class="plv v'+u.lv+'">L'+u.lv+'</div>'+
        '<div class="pinfo"><b>'+u.en+'</b><span>'+u.t+' · '+u.voc.length+'词 · '+u.qz.length+'题</span></div>';
      if(p.quizDone)h+='<div class="pscore"><b>'+p.quizBest+'</b><small>分</small></div>';
      else if(p.studied)h+='<div class="pscore"><span class="pill blue">已学</span></div>';
      h+='</button>'+(idx<uu.length-1?'<div class="pline"></div>':'');
    });
    h+='</div></div>';
  });
  document.getElementById('v-course').innerHTML=h;
}

/* ---------------- 单元详情 ---------------- */
function openUnit(id,tab){
  curUnit=findUnit(id);if(!curUnit)return;
  curTab=tab||'dlg';
  var pp=S.prog[curUnit.id]||{};
  if(pp.quizDone){quizAns=pp.quizAns?Object.assign({},pp.quizAns):{};quizDone=true;}
  else{quizAns={};quizDone=false;}
  if(curTab==='read')readAns={};
  document.getElementById('upTitle').textContent=curUnit.modEn+' · '+curUnit.en;
  document.getElementById('upLv').innerHTML='<span class="pill l'+curUnit.lv+'">L'+curUnit.lv+'</span>';
  document.querySelectorAll('#upTabs button').forEach(function(b){b.classList.toggle('on',b.dataset.t===curTab)});
  document.getElementById('unitPage').classList.add('on');
  document.body.style.overflow='hidden';
  if(!S.prog[id])S.prog[id]={studied:0,quizBest:0,quizDone:0,spkBest:0};
  renderUnit();
}
function closeUnit(){
  stopSpeak();document.getElementById('unitPage').classList.remove('on');document.body.style.overflow='';render();
}
document.getElementById('upTabs').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  curTab=b.dataset.t;stopSpeak();
  document.querySelectorAll('#upTabs button').forEach(function(x){x.classList.toggle('on',x===b)});
  renderUnit();document.getElementById('upBody').scrollTop=0;
});

      '<button class="mini g" onclick="toggleZh(this)">'+svg(I.eye,'s')+(S.set.showZh?'隐藏中文':'显示中文')+'</button>'+
      '<button class="mini g" onclick="openSpk(\''+u.id+'\')">'+svg(I.mic,'s')+'去跟读测评</button></div>';
    u.dlg.forEach(function(d,i){
